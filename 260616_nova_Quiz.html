let state = { solved: 0, correct: 0 };

function updateBoard() {
  document.getElementById('sbSolved').textContent = state.solved;
  document.getElementById('sbCorrect').textContent = state.correct;
  const rate = state.solved > 0 ? Math.round(state.correct / state.solved * 100) : 0;
  document.getElementById('sbRate').textContent = rate + '%';
  const bar = document.getElementById('sbBar');
  bar.style.width = rate + '%';
  bar.style.background = rate >= 70 ? '#16a34a' : rate >= 40 ? '#f59e0b' : '#dc2626';
  if (state.solved === QUIZ_DATA.length) showResult();
}

      ${q.options.map((o, i) => `
        <button class="opt-btn" onclick="checkMC(${q.id}, ${i}, ${q.answer})">
          <span class="opt-label">${optLabels[i]}</span>
          <span>${o}</span>
        </button>
      `).join('')}
    </div>`;
}

function buildOX(q) {
  return `
    <div class="ox-wrap" id="opts-${q.id}">
      <button class="ox-btn" onclick="checkOX(${q.id}, 'O', '${q.answer}')">⭕</button>
      <button class="ox-btn" onclick="checkOX(${q.id}, 'X', '${q.answer}')">❌</button>
    </div>`;
}

function buildSA(q) {
  return `
    <div class="sa-wrap" id="opts-${q.id}">
      <input type="text" class="sa-input" id="sa-input-${q.id}" placeholder="정답을 입력하세요" 
        onkeydown="if(event.key==='Enter') checkSA(${q.id})">
      <button class="sa-submit" id="sa-btn-${q.id}" onclick="checkSA(${q.id})">제출</button>
    </div>`;
}

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = QUIZ_DATA.map(q => `
    <div class="q-card" id="card-${q.id}">
      <div class="q-meta">
        <span class="q-num">Q${q.id}</span>
        <span class="q-type-badge ${typeBadgeClass(q.type)}">${typeLabel(q.type)}</span>
        <span class="diff-badge ${diffClass(q.difficulty)}">${diffLabel(q.difficulty)}</span>
      </div>
      <div class="q-text">${q.question}</div>
      ${q.type === 'mc' ? buildMC(q) : q.type === 'ox' ? buildOX(q) : buildSA(q)}
      <div class="explanation" id="exp-${q.id}">
        <strong>📖 해설:</strong> ${q.explanation}
      </div>
    </div>
  `).join('');
}

function revealExplanation(qid, isCorrect) {
  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (isCorrect ? 'badge-correct' : 'badge-wrong');
  badge.textContent = isCorrect ? '✓ 정답!' : '✗ 오답';
  const card = document.getElementById('card-' + qid);
  const opts  = document.getElementById('opts-' + qid);
  opts.after(badge);
  document.getElementById('exp-' + qid).classList.add('show');
  state.solved++;
  if (isCorrect) state.correct++;
  updateBoard();
}

function checkMC(qid, chosen, correct) {
  const btns = document.querySelectorAll(`#opts-${qid} .opt-btn`);
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    if (i === chosen && chosen !== correct) btn.classList.add('wrong');
  });
  revealExplanation(qid, chosen === correct);
}

function checkOX(qid, chosen, correct) {
  const btns = document.querySelectorAll(`#opts-${qid} .ox-btn`);
  btns.forEach(btn => { btn.disabled = true; });
  const isCorrect = chosen === correct;
  const chosenIdx = chosen === 'O' ? 0 : 1;
  const correctIdx = correct === 'O' ? 0 : 1;
  btns[correctIdx].classList.add('correct');
  if (!isCorrect) btns[chosenIdx].classList.add('wrong');
  revealExplanation(qid, isCorrect);
}

function checkSA(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const input = document.getElementById('sa-input-' + qid);
  const btn   = document.getElementById('sa-btn-' + qid);
  const val   = input.value.trim();
  if (!val) { input.style.borderColor = 'var(--wrong)'; return; }
  input.disabled = true;
  btn.disabled   = true;
  const isCorrect = q.keywords.some(k => val.includes(k));
  input.style.borderColor = isCorrect ? 'var(--correct)' : 'var(--wrong)';
  revealExplanation(qid, isCorrect);
}

function showResult() {
  const score = state.correct;
  const grade = score >= 9 ? 'A+' : score >= 8 ? 'A' : score >= 7 ? 'B' : score >= 5 ? 'C' : 'D';
  const trophy = score >= 9 ? '🏆' : score >= 7 ? '🥇' : score >= 5 ? '🥈' : '📚';
  const msgs = {
    'A+': '완벽합니다! 오늘 시장 흐름을 완전히 꿰뚫고 있습니다.',
    'A': '훌륭합니다! 핵심 개념을 잘 이해하고 있습니다.',
    'B': '좋습니다. 놓친 부분을 한 번 더 복습해 보세요.',
    'C': '조금 더 집중이 필요합니다. 방송을 다시 한번 들어보세요.',
    'D': '기초부터 차근차근! 분석 리포트를 꼭 다시 확인하세요.'
  };
  document.getElementById('resTrophy').textContent = trophy;
  document.getElementById('resGrade').textContent  = grade;
  document.getElementById('resScore').textContent  = score + ' / 10';
  document.getElementById('resMsg').textContent    = msgs[grade];
  document.getElementById('resultOverlay').classList.add('show');
}

function retryQuiz() {
  state = { solved: 0, correct: 0 };
  document.getElementById('resultOverlay').classList.remove('show');
  updateBoard();
  renderQuiz();
}

renderQuiz();
updateBoard();
</script>
</body>
</html>
