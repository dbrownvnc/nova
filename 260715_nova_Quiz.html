<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퀴즈: IBM -25% 폭락과 자본의 대이동</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --bg:#ffffff; --bg-soft:#fafafa; --text:#1a1a1a; --text-soft:#777777;
    --accent:#e11d48; --accent2:#f43f5e; --line:#e5e5e5;
    --ok:#16a34a; --ok-bg:#dcfce7; --bad:#dc2626; --bad-bg:#fee2e2;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg-soft); color:var(--text); font-family:'Noto Sans KR',sans-serif;}
  .wrap{max-width:640px; margin:0 auto; padding:0 16px 60px;}
  h1{font-family:'Playfair Display',serif;}

  header{
    padding:26px 16px 18px; background:#fff; border-bottom:1px solid var(--line); text-align:center;
  }
  header .eyebrow{font-size:11px; letter-spacing:0.14em; color:var(--accent); font-weight:700; text-transform:uppercase; margin-bottom:8px;}
  header h1{font-size:21px; margin:0 0 6px; color:var(--text); font-weight:800;}
  header p{font-size:13px; color:var(--text-soft); margin:0;}

  .scoreboard{
    position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--line);
    padding:10px 16px; box-shadow:0 2px 8px rgba(0,0,0,0.05);
  }
  .sb-row{max-width:640px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; font-size:12.5px; font-weight:700;}
  .sb-row span.big{font-family:'Playfair Display',serif; font-size:15px;}
  .sb-bar-track{max-width:640px; margin:8px auto 0; height:7px; border-radius:6px; background:var(--line); overflow:hidden;}
  .sb-bar-fill{height:100%; width:0%; border-radius:6px; background:#dc2626; transition:width .35s ease, background .35s ease;}

  .qcard{
    background:#fff; border:1px solid var(--line); border-radius:12px; margin:16px 0; padding:18px 16px;
  }
  .qhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .qnum{font-family:'Playfair Display',serif; font-weight:800; font-size:14px; color:var(--accent);}
  .diff{font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px;}
  .diff.easy{background:#dcfce7; color:#16a34a;}
  .diff.medium{background:#fef3c7; color:#b45309;}
  .diff.hard{background:#fee2e2; color:#dc2626;}
  .qtext{font-size:15px; font-weight:700; margin-bottom:14px; line-height:1.5;}

  .opt{
    display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:8px;
    border:1.5px solid var(--line); border-radius:8px; background:#fff; font-size:14px;
    cursor:pointer; font-family:inherit; position:relative; transition:background .15s ease, border-color .15s ease;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:disabled{cursor:not-allowed;}
  .opt.correct{background:var(--ok-bg); border-color:var(--ok); color:#14532d;}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:#7f1d1d;}
  .badge{font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; margin-left:8px;}
  .badge.ok{background:var(--ok); color:#fff;}
  .badge.bad{background:var(--bad); color:#fff;}

  .ox-row{display:flex; gap:10px;}
  .ox-row .opt{flex:1; text-align:center; font-weight:800; font-size:18px; padding:16px;}

  .sa-row{display:flex; gap:8px;}
  .sa-row input{
    flex:1; padding:12px 14px; border:1.5px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit;
  }
  .sa-row input:disabled{background:var(--bg-soft);}
  .sa-row button{
    padding:0 18px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; font-size:13px; cursor:pointer;
  }
  .sa-row button:disabled{background:#ccc; cursor:not-allowed;}

  .explain{
    display:none; margin-top:14px; padding:13px 14px; background:var(--bg-soft); border-left:4px solid var(--accent);
    border-radius:6px; font-size:13.3px; line-height:1.6; color:#333;
  }
  .explain.show{display:block;}
  .explain b{color:var(--accent);}

  .final{
    display:none; background:linear-gradient(135deg,#1a1a1a,#3a3a3a); color:#fff; border-radius:16px;
    padding:30px 22px; margin:24px 0; text-align:center;
  }
  .final.show{display:block;}
  .final .grade{font-family:'Playfair Display',serif; font-size:52px; font-weight:800; color:var(--accent2); margin-bottom:4px;}
  .final .score{font-size:16px; font-weight:700; margin-bottom:10px;}
  .final .msg{font-size:13.5px; color:#ddd; margin-bottom:18px;}
  .final button{
    background:var(--accent); color:#fff; border:none; padding:11px 22px; border-radius:24px;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }

  footer{text-align:center; font-size:11px; color:var(--text-soft); padding:20px 16px 0;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">CIA.chat · Quiz</div>
  <h1>IBM -25% 폭락과 자본의 대이동</h1>
  <p>2026년 7월 14일 CIA.chat 멤버미팅 내용 기반 · 총 10문제</p>
</header>

<div class="scoreboard">
  <div class="sb-row">
    <span>푼 문제 <span class="big" id="sbSolved">0</span> / 10</span>
    <span>맞힌 문제 <span class="big" id="sbCorrect">0</span></span>
    <span>정답률 <span class="big" id="sbRate">0</span>%</span>
  </div>
  <div class="sb-bar-track"><div class="sb-bar-fill" id="sbBarFill"></div></div>
</div>

<div class="wrap">
  <div id="quizContainer"></div>
  <div class="final" id="finalCard">
    <div class="grade" id="finalGrade">A</div>
    <div class="score" id="finalScore">10 / 10</div>
    <div class="msg" id="finalMsg"></div>
    <button id="retryBtn">🔄 다시 풀기</button>
  </div>
  <footer>ⓒ 2026 CIA.chat · 문제 근거: 2026.07.14 멤버미팅 원본 자막</footer>
</div>

<script>
const QUIZ_DATA = [
  {
    id: 1, type: 'ox', difficulty: 'easy',
    question: "IBM의 주가는 실적 발표 이후 단 하루 만에 25.2% 폭락했다.",
    answer: "O",
    explanation: "IBM은 단 하루 만에 시가총액 680억 달러가 증발하며 주가가 25.2% 폭락했고, 이 여파로 다우지수 전체가 급락했습니다."
  },
  {
    id: 2, type: 'mc', difficulty: 'easy',
    question: "이날 미국 증시 반등의 가장 큰 배경이 된 경제 지표는 무엇인가요?",
    options: ["PPI(생산자물가지수)", "CPI(소비자물가지수)", "실업률", "기준금리 발표"],
    answer: "CPI(소비자물가지수)",
    explanation: "6월 CPI가 3.5%로 전월 대비 0.4%포인트 둔화되며 시장이 안도했고, 10년물 국채금리 하락과 나스닥 반등으로 이어졌습니다."
  },
  {
    id: 3, type: 'mc', difficulty: 'easy',
    question: "골드만삭스의 어닝 서프라이즈 이후 이날 주가는 약 몇 % 움직였나요?",
    options: ["약 5%", "약 10%", "약 15%", "약 20%"],
    answer: "약 10%",
    explanation: "골드만삭스는 어닝 서프라이즈로 이날 약 10% 주가가 움직였는데, 특히 스페이스X 관련 수수료 수익이 약 130% 폭증한 것이 실적을 견인했습니다."
  },
  {
    id: 4, type: 'mc', difficulty: 'medium',
    question: "아르빈드 크리슈나 IBM CEO가 실적 부진의 원인으로 지목한 고객들의 예산 집중처는 어디인가요?",
    options: ["마케팅·광고", "서버·스토리지·메모리", "인건비·채용", "부동산·설비"],
    answer: "서버·스토리지·메모리",
    explanation: "CEO 서한에서 \"고객들이 향후 가격 인상에 대비해 서버, 스토리지, 메모리에 예산을 집중하면서 기존 소프트웨어 계약이 지연되었다\"고 밝혔습니다."
  },
  {
    id: 5, type: 'short', difficulty: 'medium',
    question: "IBM의 2분기 인프라 부문 매출은 전년 대비 몇 % 감소했나요? (숫자만, %는 자동 처리)",
    answer: "7",
    explanation: "IBM의 인프라 부문 매출은 7% 감소했으며, 조정 EPS 역시 2.93달러로 시장 예상치를 큰 폭으로 밑돌았습니다."
  },
  {
    id: 6, type: 'mc', difficulty: 'medium',
    question: "SK하이닉스 주가가 장중 약 27% 폭등한 계기가 된 핵심 키워드는 무엇인가요?",
    options: ["감산 발표", "솔드아웃(완판)", "자사주 매입", "무상증자"],
    answer: "솔드아웃(완판)",
    explanation: "SK하이닉스 회장이 26~27년 물량이 '솔드아웃(완판)'되었다고 언급하면서 주가가 장중 약 27% 폭등했습니다."
  },
  {
    id: 7, type: 'short', difficulty: 'medium',
    question: "바클레이스가 SK하이닉스에 제시한 목표주가는 얼마인가요? (숫자만, 달러 단위)",
    answer: "330",
    explanation: "바클레이스는 SK하이닉스 목표주가를 330달러로 제시했으며, 이는 당시 주가(180~190달러 선) 대비 약 2배에 가까운 수준이었습니다."
  },
  {
    id: 8, type: 'ox', difficulty: 'medium',
    question: "뉴욕주는 향후 1년간 AI 데이터센터의 신규 건설을 전면 금지하는 모라토리엄을 선언했다.",
    answer: "O",
    explanation: "뉴욕주는 전력망 안전성 훼손과 기후변화 목표 달성을 이유로 AI 데이터센터 신규 건설을 1년간 전면 금지했습니다."
  },
  {
    id: 9, type: 'short', difficulty: 'hard',
    question: "루시드 그룹의 주가는 파산보호 신청 루머로 장중 한때 몇 % 까지 폭락했나요? (숫자만)",
    answer: "57",
    explanation: "루시드는 파산보호 신청 및 비상장 전환 루머로 장중 57%까지 폭락하며 거래가 일시 정지됐고, 회사의 부인에도 불구하고 정규장 -16.2%, 장후 추가 하락으로 하루 동안 총 20% 가까이 떨어졌습니다."
  },
  {
    id: 10, type: 'mc', difficulty: 'hard',
    question: "KeyBanc가 애플 투자등급을 '비중축소'로 하향하며 제시한 목표주가는 얼마인가요?",
    options: ["350달러", "300달러", "250달러", "200달러"],
    answer: "250달러",
    explanation: "KeyBanc는 애플 투자등급을 비중축소(Underweight)로 낮추고 목표가를 250달러로 제시했는데, 이는 당시 주가(314.86달러) 대비 약 20%의 하락 여력을 시사한 수치였습니다."
  }
];

let state = { solved: 0, correct: 0 };

const diffLabel = { easy: '쉬움', medium: '보통', hard: '어려움' };
const typeLabel = { mc: '객관식', ox: 'O/X', short: '단답형' };

function renderQuiz(){
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUIZ_DATA.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'qcard-' + q.id;

    let bodyHtml = '';
    if (q.type === 'mc'){
      bodyHtml = q.options.map(opt =>
        `<button class="opt" data-value="${opt.replace(/"/g,'&quot;')}">${opt}</button>`
      ).join('');
    } else if (q.type === 'ox'){
      bodyHtml = `<div class="ox-row">
        <button class="opt" data-value="O">O</button>
        <button class="opt" data-value="X">X</button>
      </div>`;
    } else if (q.type === 'short'){
      bodyHtml = `<div class="sa-row">
        <input type="text" placeholder="정답을 입력하세요" id="input-${q.id}">
        <button id="submit-${q.id}">제출</button>
      </div>`;
    }

    card.innerHTML = `
      <div class="qhead">
        <span class="qnum">Q${idx+1}. ${typeLabel[q.type]}</span>
        <span class="diff ${q.difficulty}">${diffLabel[q.difficulty]}</span>
      </div>
      <div class="qtext">${q.question}</div>
      <div class="opts">${bodyHtml}</div>
      <div class="explain" id="explain-${q.id}"><b>해설</b><br>${q.explanation}</div>
    `;
    container.appendChild(card);
  });

  // Attach handlers
  QUIZ_DATA.forEach(q => {
    if (q.type === 'mc' || q.type === 'ox'){
      const card = document.getElementById('qcard-' + q.id);
      card.querySelectorAll('.opt').forEach(btn => {
        btn.addEventListener('click', () => gradeChoice(q, btn));
      });
    } else if (q.type === 'short'){
      const input = document.getElementById('input-' + q.id);
      const btn = document.getElementById('submit-' + q.id);
      const submit = () => gradeShort(q, input, btn);
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    }
  });
}

function normalize(str){
  return str.toString().trim().toLowerCase().replace(/[%$,\s]/g,'').replace('달러','');
}

function gradeChoice(q, clickedBtn){
  const card = document.getElementById('qcard-' + q.id);
  const allBtns = card.querySelectorAll('.opt');
  const isCorrect = clickedBtn.dataset.value === q.answer;

  allBtns.forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.value === q.answer){
      btn.classList.add('correct');
      if (btn === clickedBtn || isCorrect){
        btn.insertAdjacentHTML('beforeend', ' <span class="badge ok">✓ 정답!</span>');
      } else {
        btn.insertAdjacentHTML('beforeend', ' <span class="badge ok">정답</span>');
      }
    } else if (btn === clickedBtn && !isCorrect){
      btn.classList.add('wrong');
      btn.insertAdjacentHTML('beforeend', ' <span class="badge bad">✗ 오답</span>');
    }
  });

  finalizeQuestion(q, isCorrect);
}

function gradeShort(q, input, btn){
  if (input.disabled) return;
  const userVal = input.value;
  const isCorrect = normalize(userVal) === normalize(q.answer) && userVal.trim() !== '';
  input.disabled = true;
  btn.disabled = true;
  input.style.background = isCorrect ? '#dcfce7' : '#fee2e2';
  input.style.borderColor = isCorrect ? '#16a34a' : '#dc2626';
  const row = input.parentElement;
  if (!isCorrect){
    row.insertAdjacentHTML('afterend', `<div style="margin-top:6px; font-size:12.5px; color:#dc2626;">정답: <b>${q.answer}</b></div>`);
  } else {
    row.insertAdjacentHTML('afterend', `<div style="margin-top:6px; font-size:12.5px; color:#16a34a;">✓ 정답!</div>`);
  }
  finalizeQuestion(q, isCorrect);
}

function finalizeQuestion(q, isCorrect){
  document.getElementById('explain-' + q.id).classList.add('show');
  state.solved += 1;
  if (isCorrect) state.correct += 1;
  updateScoreboard();
  if (state.solved === QUIZ_DATA.length){
    setTimeout(showFinal, 400);
  }
}

function updateScoreboard(){
  document.getElementById('sbSolved').textContent = state.solved;
  document.getElementById('sbCorrect').textContent = state.correct;
  const rate = state.solved > 0 ? Math.round((state.correct / state.solved) * 100) : 0;
  document.getElementById('sbRate').textContent = rate;
  const fill = document.getElementById('sbBarFill');
  fill.style.width = rate + '%';
  if (rate < 40) fill.style.background = '#dc2626';
  else if (rate < 70) fill.style.background = '#f59e0b';
  else fill.style.background = '#16a34a';
}

function showFinal(){
  const rate = Math.round((state.correct / QUIZ_DATA.length) * 100);
  let grade, msg;
  if (rate >= 90){ grade = 'A'; msg = '완벽합니다! 이날 브리핑의 핵심 흐름을 정확히 꿰뚫고 계시네요.'; }
  else if (rate >= 70){ grade = 'B'; msg = '훌륭해요! 핵심 포인트는 대부분 잡으셨습니다.'; }
  else if (rate >= 50){ grade = 'C'; msg = '괜찮아요. 리포트를 한 번 더 훑어보면 완벽해질 거예요.'; }
  else { grade = 'D'; msg = '리포트를 다시 읽고 재도전해 보세요. 다음엔 더 잘하실 거예요!'; }

  document.getElementById('finalGrade').textContent = grade;
  document.getElementById('finalScore').textContent = state.correct + ' / ' + QUIZ_DATA.length;
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('finalCard').classList.add('show');
  document.getElementById('finalCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('retryBtn').addEventListener('click', () => {
  state = { solved: 0, correct: 0 };
  updateScoreboard();
  document.getElementById('finalCard').classList.remove('show');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderQuiz();
</script>

</body>
</html>
