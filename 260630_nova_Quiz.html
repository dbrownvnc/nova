<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쪼개서 성공 vs 합쳐서 성공 — 이해도 점검 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg2:#fafafa; --text:#1a1a1a; --text2:#777777;
    --accent:#e11d48; --accent2:#f43f5e; --border:#e5e5e5;
    --green:#15803d; --green-bg:#f0fdf4; --red:#dc2626; --red-bg:#fef2f2;
    --blue:#2563eb;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg2);color:var(--text);
    font-family:'Noto Sans KR',sans-serif;line-height:1.7;font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px;margin:0 auto;background:var(--bg);min-height:100vh}

  /* ===== STICKY SCOREBOARD ===== */
  .scorebar{
    position:sticky;top:0;z-index:50;background:#fff;
    border-bottom:1px solid var(--border);padding:12px 20px 10px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  .score-stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .score-stats .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;font-family:'Playfair Display',serif}
  .score-stats .nums{display:flex;gap:16px;font-size:13px}
  .score-stats .nums b{font-family:'Playfair Display',serif;font-size:15px;color:var(--text)}
  .score-stats .nums .g{color:var(--green)}
  .score-stats .nums .r{color:var(--accent)}
  .pbar{height:7px;background:#eee;border-radius:4px;overflow:hidden}
  .pbar-fill{height:100%;width:0;background:var(--red);border-radius:4px;transition:width .4s ease,background .4s ease}

  /* ===== HEADER ===== */
  .qhead{padding:40px 24px 30px;border-bottom:2px solid var(--text);text-align:center}
  .qhead .eb{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
  .qhead h1{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;line-height:1.25;margin-bottom:10px}
  .qhead p{font-size:13.5px;color:var(--text2)}

  /* ===== QUIZ AREA ===== */
  .quiz{padding:20px 20px 40px}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:22px 20px;margin-bottom:20px;
  }
  .card-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .qno{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;color:var(--accent)}
  .badge{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.03em}
  .b-easy{background:#ecfdf5;color:var(--green)}
  .b-mid{background:#fff7ed;color:#c2410c}
  .b-hard{background:#fef2f2;color:var(--red)}
  .b-type{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
  .qtext{font-size:16px;font-weight:500;line-height:1.6;margin-bottom:16px}

  /* options */
  .opts{display:grid;gap:9px}
  .opt{
    border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;
    font-size:14.5px;cursor:pointer;transition:.15s;background:#fff;text-align:left;
    display:flex;align-items:center;gap:10px;font-family:'Noto Sans KR';color:var(--text);
  }
  .opt:hover:not(.disabled){border-color:var(--accent);background:#fff7f9}
  .opt .mk{
    flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text2);
  }
  .opt.correct{border-color:var(--green);background:var(--green-bg)}
  .opt.correct .mk{background:var(--green);color:#fff;border-color:var(--green)}
  .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .opt.wrong .mk{background:var(--red);color:#fff;border-color:var(--red)}
  .opt.disabled{cursor:default;opacity:.96}
  .opt .tag{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px}
  .opt.correct .tag{background:var(--green);color:#fff}
  .opt.wrong .tag{background:var(--red);color:#fff}

  /* OX */
  .ox{display:flex;gap:12px}
  .ox .opt{flex:1;justify-content:center;font-size:18px;font-weight:700}

  /* short answer */
  .sa{display:flex;gap:8px}
  .sa input{
    flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;
    font-size:14.5px;font-family:'Noto Sans KR';outline:none;
  }
  .sa input:focus{border-color:var(--accent)}
  .sa button{
    padding:12px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;
    font-family:'Noto Sans KR';font-weight:700;font-size:14px;cursor:pointer;
  }
  .sa button:disabled{background:#ccc;cursor:default}
  .sa-hint{font-size:11.5px;color:var(--text2);margin-top:7px}

  /* explanation */
  .exp{
    margin-top:14px;border-left:3px solid var(--accent);background:var(--bg2);
    padding:13px 15px;border-radius:0 6px 6px 0;font-size:13.5px;line-height:1.65;
    display:none;
  }
  .exp.show{display:block;animation:slide .35s ease}
  @keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .exp .et{font-weight:700;color:var(--accent);margin-bottom:5px;font-size:12.5px;letter-spacing:.04em}
  .exp .src{margin-top:8px;font-size:12px;color:var(--text2);font-style:italic}

  /* ===== FINAL MODAL ===== */
  .modal-bg{
    position:fixed;inset:0;background:rgba(26,26,26,.6);z-index:100;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .modal-bg.show{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;border-radius:16px;padding:38px 28px;max-width:380px;width:100%;
    text-align:center;animation:pop .4s cubic-bezier(.2,.8,.3,1.2);
  }
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .eb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px}
  .modal .grade{font-family:'Playfair Display',serif;font-weight:800;font-size:72px;line-height:1;color:var(--accent);margin-bottom:8px}
  .modal .sc{font-size:17px;font-weight:700;margin-bottom:6px}
  .modal .msg{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.6}
  .modal button{
    width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:9px;
    font-family:'Noto Sans KR';font-weight:700;font-size:15px;cursor:pointer;transition:.2s;
  }
  .modal button:hover{background:#be123c}

  .footnote{text-align:center;padding:0 24px 50px;font-size:12px;color:var(--text2)}

  @media(max-width:420px){
    .qhead h1{font-size:23px}
    .qtext{font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- STICKY SCOREBOARD -->
  <div class="scorebar">
    <div class="score-stats">
      <span class="lab">Score</span>
      <div class="nums">
        <span>푼 문제 <b id="sSolved">0</b>/10</span>
        <span class="g">맞힘 <b id="sCorrect" class="g">0</b></span>
        <span class="r">정답률 <b id="sRate" class="r">0%</b></span>
      </div>
    </div>
    <div class="pbar"><div class="pbar-fill" id="pbar"></div></div>
  </div>

  <!-- HEADER -->
  <div class="qhead">
    <div class="eb">Comprehension Check · 2026.06.30</div>
    <h1>쪼개서 성공 vs 합쳐서 성공</h1>
    <p>변동성 장세의 자본 배분 논리 — 10문제로 이해도 점검</p>
  </div>

  <!-- QUIZ -->
  <div class="quiz" id="quizArea"></div>

  <div class="footnote">본 퀴즈는 방송 자막 내용에 근거합니다 · 투자 권유가 아닌 학습용 자료입니다.</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="eb">Result</div>
    <div class="grade" id="mGrade">A</div>
    <div class="sc" id="mScore">10 / 10</div>
    <div class="msg" id="mMsg"></div>
    <button id="retryBtn">다시 풀기</button>
  </div>
</div>

const answered = {};

const typeLabel = { mc:'객관식', sa:'단답형', ox:'O/X' };
const diffLabel = { easy:'쉬움', mid:'보통', hard:'어려움' };
const diffClass = { easy:'b-easy', mid:'b-mid', hard:'b-hard' };

const area = document.getElementById('quizArea');

QUIZ_DATA.forEach(q => {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + q.id;

  let inner = `
    <div class="card-top">
      <span class="qno">Q${q.id}</span>
      <span class="badge ${diffClass[q.difficulty]}">${diffLabel[q.difficulty]}</span>
      <span class="badge b-type">${typeLabel[q.type]}</span>
    </div>
    <div class="qtext">${q.question}</div>
  `;

  if (q.type === 'mc'){
    inner += `<div class="opts" id="opts-${q.id}">`;
    const letters = ['A','B','C','D'];
    q.options.forEach((o,i) => {
      inner += `<button class="opt" data-q="${q.id}" data-i="${i}">
        <span class="mk">${letters[i]}</span><span>${o}</span></button>`;
    });
    inner += `</div>`;
  } else if (q.type === 'ox'){
    inner += `<div class="ox" id="opts-${q.id}">
      <button class="opt" data-q="${q.id}" data-ox="O"><span class="mk">O</span></button>
      <button class="opt" data-q="${q.id}" data-ox="X"><span class="mk">X</span></button>
    </div>`;
  } else if (q.type === 'sa'){
    inner += `<div class="sa">
      <input type="text" id="sa-${q.id}" placeholder="정답을 입력하세요" autocomplete="off">
      <button data-q="${q.id}" class="sa-btn">제출</button>
    </div>
    <div class="sa-hint">힌트: 핵심 키워드만 입력해도 됩니다.</div>`;
  }

  inner += `<div class="exp" id="exp-${q.id}">
    <div class="et">💡 해설</div>
    <div>${q.explanation}</div>
    <div class="src">${q.src}</div>
  </div>`;

  card.innerHTML = inner;
  area.appendChild(card);
});

// ===== event handlers =====
function updateScore(){
  document.getElementById('sSolved').textContent = state.solved;
  document.getElementById('sCorrect').textContent = state.correct;
  const rate = state.solved ? Math.round(state.correct/state.solved*100) : 0;
  document.getElementById('sRate').textContent = rate + '%';
  const bar = document.getElementById('pbar');
  bar.style.width = (state.solved/10*100) + '%';
  let col = '#dc2626';
  if (rate >= 70) col = '#15803d';
  else if (rate >= 40) col = '#ea580c';
  bar.style.background = col;
  if (state.solved === 10) setTimeout(showModal, 450);
}

function grade(qId, isCorrect){
  if (answered[qId]) return;
  answered[qId] = true;
  state.solved++;
  if (isCorrect) state.correct++;
  document.getElementById('exp-'+qId).classList.add('show');
  updateScore();
}

// MC + OX
document.querySelectorAll('.opt').forEach(btn => {
  btn.addEventListener('click', () => {
    const qId = +btn.dataset.q;
    if (answered[qId]) return;
    const q = QUIZ_DATA.find(x => x.id === qId);
    const container = document.getElementById('opts-'+qId);
    const allOpts = container.querySelectorAll('.opt');
    allOpts.forEach(o => o.classList.add('disabled'));

    let isCorrect;
    if (q.type === 'mc'){
      const idx = +btn.dataset.i;
      isCorrect = (idx === q.answer);
      if (isCorrect){
        btn.classList.add('correct');
        btn.insertAdjacentHTML('beforeend','<span class="tag">✓ 정답!</span>');
      } else {
        btn.classList.add('wrong');
        btn.insertAdjacentHTML('beforeend','<span class="tag">✗ 오답</span>');
        const correctBtn = container.querySelector(`.opt[data-i="${q.answer}"]`);
        correctBtn.classList.add('correct');
        correctBtn.insertAdjacentHTML('beforeend','<span class="tag">정답</span>');
      }
    } else { // ox
      const val = btn.dataset.ox;
      isCorrect = (val === q.answer);
      if (isCorrect){
        btn.classList.add('correct');
        btn.insertAdjacentHTML('beforeend','<span class="tag">✓</span>');
      } else {
        btn.classList.add('wrong');
        btn.insertAdjacentHTML('beforeend','<span class="tag">✗</span>');
        const correctBtn = container.querySelector(`.opt[data-ox="${q.answer}"]`);
        correctBtn.classList.add('correct');
        correctBtn.insertAdjacentHTML('beforeend','<span class="tag">정답</span>');
      }
    }
    grade(qId, isCorrect);
  });
});

// SA
document.querySelectorAll('.sa-btn').forEach(btn => {
  const qId = +btn.dataset.q;
  const input = document.getElementById('sa-'+qId);
  const submit = () => {
    if (answered[qId]) return;
    const q = QUIZ_DATA.find(x => x.id === qId);
    const val = input.value.trim().toLowerCase().replace(/\s/g,'');
    if (!val){ input.style.borderColor = '#dc2626'; return; }
    const isCorrect = q.answer.some(a => {
      const norm = a.toLowerCase().replace(/\s/g,'');
      return val === norm || val.includes(norm) || norm.includes(val);
    });
    input.disabled = true; btn.disabled = true;
    input.style.borderColor = isCorrect ? '#15803d' : '#dc2626';
    input.style.background = isCorrect ? '#f0fdf4' : '#fef2f2';
    btn.textContent = isCorrect ? '✓ 정답' : '✗ 오답';
    btn.style.background = isCorrect ? '#15803d' : '#dc2626';
    grade(qId, isCorrect);
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
});

// ===== modal =====
function showModal(){
  const rate = Math.round(state.correct/10*100);
  let grade, msg;
  if (rate >= 90){ grade='A'; msg='완벽합니다! 자본 배분의 논리를 완전히 꿰뚫으셨네요. 오늘 시장의 모순을 명쾌하게 읽어내셨습니다.'; }
  else if (rate >= 70){ grade='B'; msg='훌륭합니다! 핵심 흐름을 잘 잡으셨어요. 헷갈린 부분은 해설로 한 번 더 짚어보세요.'; }
  else if (rate >= 50){ grade='C'; msg='기본기는 갖추셨습니다. 곡괭이·삽 전략과 자본 배분 파트를 복습하면 한층 단단해질 거예요.'; }
  else { grade='D'; msg='괜찮습니다. 분석 리포트를 다시 읽고 도전해 보세요. 핵심은 \'명확한 정체성에 자본을 배분하라\'입니다.'; }
  document.getElementById('mGrade').textContent = grade;
  document.getElementById('mScore').textContent = state.correct + ' / 10';
  document.getElementById('mMsg').textContent = msg;
  document.getElementById('modalBg').classList.add('show');
}

document.getElementById('retryBtn').addEventListener('click', () => location.reload());

updateScore();
</script>
</body>
</html>
