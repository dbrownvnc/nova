<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIA.chat 멤버 미팅 (2026.05.28) — 인터랙티브 시험문제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,500&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg2:#fafafa; --ink:#1a1a1a; --sub:#777777;
    --accent:#e11d48; --accent2:#f43f5e; --line:#e5e5e5;
    --ok:#0a8a3f; --okbg:#e7f6ec; --no:#e11d48; --nobg:#fdecf0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 80px}

  /* sticky scoreboard */
  .score{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);border-bottom:2px solid var(--ink);padding:12px 16px}
  .score-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .score .stat{font-size:12.5px;font-weight:500;color:var(--sub)}
  .score .stat b{font-family:'Playfair Display',serif;font-size:17px;color:var(--ink);font-weight:700;margin-left:2px}
  .score .stat.acc b{color:var(--accent)}
  .bar{flex:1 1 100%;height:7px;background:var(--line);border-radius:7px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:7px;
    transition:width .5s ease,background .3s ease}

  /* header */
  header{padding:48px 0 30px;text-align:center;border-bottom:1px solid var(--line);margin-bottom:8px}
  .kick{font-size:11px;letter-spacing:.24em;font-weight:700;color:var(--accent);margin-bottom:12px}
  header h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(27px,7vw,38px);line-height:1.1}
  header p{font-size:13.5px;color:var(--sub);margin-top:10px}

  /* question card */
  .q{background:var(--bg2);border:1px solid var(--line);border-radius:14px;
    padding:22px 18px;margin:18px 0}
  .q-top{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
  .qno{font-family:'Playfair Display',serif;font-weight:900;font-size:19px;color:var(--accent)}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:20px}
  .b-easy{background:#e7f6ec;color:#0a8a3f}
  .b-med{background:#fef3e2;color:#c47f12}
  .b-hard{background:var(--nobg);color:var(--accent)}
  .b-type{background:#eef0f3;color:#555}
  .q-text{font-size:16px;font-weight:500;line-height:1.55;margin-bottom:16px}

  /* options */
  .opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);
    border-radius:10px;padding:13px 15px;margin-bottom:9px;font-family:inherit;font-size:14.5px;
    cursor:pointer;transition:.15s;color:var(--ink);position:relative}
  .opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
  .opt:disabled{cursor:default}
  .opt.correct{background:var(--okbg);border-color:var(--ok)}
  .opt.wrong{background:var(--nobg);border-color:var(--no)}
  .opt .tagb{float:right;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:8px}
  .opt.correct .tagb{background:var(--ok);color:#fff}
  .opt.wrong .tagb{background:var(--no);color:#fff}

  /* short answer */
  .sa{display:flex;gap:8px;margin-bottom:6px}
  .sa input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;
    font-family:inherit;font-size:14.5px;outline:none}
  .sa input:focus{border-color:var(--accent)}
  .sa input:disabled{background:var(--bg2)}
  .sa button{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:0 18px;
    font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
  .sa button:disabled{opacity:.5;cursor:default}
  .sa-hint{font-size:11.5px;color:var(--sub);margin-bottom:4px}

  /* OX */
  .ox{display:flex;gap:10px}
  .ox button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;
    padding:18px;font-family:'Playfair Display',serif;font-size:24px;font-weight:900;cursor:pointer;transition:.15s}
  .ox button:hover:not(:disabled){border-color:var(--accent)}
  .ox button:disabled{cursor:default}
  .ox button.correct{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .ox button.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}

  /* explanation */
  .exp{max-height:0;overflow:hidden;transition:max-height .45s ease,margin .3s ease;
    background:var(--bg);border-radius:10px;border-left:4px solid var(--accent)}
  .exp.show{max-height:600px;margin-top:14px}
  .exp-in{padding:14px 16px}
  .exp-verdict{font-weight:700;font-size:13.5px;margin-bottom:6px}
  .exp-verdict.ok{color:var(--ok)}
  .exp-verdict.no{color:var(--no)}
  .exp-body{font-size:13.5px;color:#333;line-height:1.6}
  .exp-src{font-size:11.5px;color:var(--sub);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .exp-src b{color:var(--accent)}

  /* final modal */
  .ov{position:fixed;inset:0;background:rgba(26,26,26,.6);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .ov.show{display:flex}
  .modal{background:var(--bg);border-radius:20px;max-width:380px;width:100%;padding:34px 26px;text-align:center;
    border-top:6px solid var(--accent);box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal .mg{font-family:'Playfair Display',serif;font-size:62px;font-weight:900;line-height:1;color:var(--accent)}
  .modal .ms{font-size:14px;color:var(--sub);margin:6px 0 18px}
  .modal .mscore{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;margin-bottom:8px}
  .modal .mmsg{font-size:14px;color:#333;margin-bottom:22px;line-height:1.6}
  .modal button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px 28px;
    font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}
  .modal button:hover{background:var(--accent2)}
  .foot{text-align:center;font-size:11.5px;color:var(--sub);margin-top:30px;line-height:1.7}
</style>
</head>
<body>

<!-- sticky scoreboard -->
<div class="score">
  <div class="score-in">
    <span class="stat">푼 문제 <b id="sSolved">0</b> / 10</span>
    <span class="stat">맞힌 문제 <b id="sCorrect">0</b></span>
    <span class="stat acc">정답률 <b id="sAcc">0%</b></span>
    <div class="bar"><i id="sBar"></i></div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="kick">CIA.CHAT 멤버 미팅 · 2026.05.28</div>
    <h1>이해도 점검 퀴즈</h1>
    <p>총 10문제 · 보기를 선택하면 즉시 채점되고 해설이 펼쳐집니다.</p>
  </header>

  <div id="quiz"></div>

  <div class="foot">
    출처: CIA.chat 멤버 미팅 (NOVA Real Invest) · 본 퀴즈는 방송 내용 학습용입니다.<br>
    모든 문항은 원본 자막에 실제 등장한 내용만으로 출제되었습니다.
  </div>
</div>

<!-- final modal -->
<div class="ov" id="ov">
  <div class="modal">
    <div class="mg" id="mGrade">A</div>
    <div class="ms">최종 등급</div>
    <div class="mscore" id="mScore">10 / 10</div>
    <div class="mmsg" id="mMsg"></div>
    <button id="mRetry">다시 풀기</button>
  </div>
</div>

<script>
const QUIZ_DATA = [
  {
    id:1, type:'mc', difficulty:'easy',
    question:'델(DELL) 시간외 폭등의 핵심이 된, AI 서버 매출의 전년비(YoY) 증가율은?',
    options:['+75.7%','+757%','+38%','+244%'],
    answer:1,
    explanation:'델의 AI 서버 매출은 전년 대비 757% 폭증($16.1B)했습니다. 숫자 단위에 주의하세요(75.7%가 아닌 757%). +38%는 시간외 주가 상승률, 244억 달러는 AI 주문 잔고입니다.',
    src:'자막: "서버 관련 매출이 757%나 성장했어요. YOY로 보면."'
  },
  {
    id:2, type:'mc', difficulty:'easy',
    question:'Snowflake(SNOW)가 +39.43% 폭등한 직접적 계기인, AWS와 체결한 딜의 규모와 기간은?',
    options:['3년간 30억 달러','5년간 60억 달러','10년간 100억 달러','5년간 244억 달러'],
    answer:1,
    explanation:'스노우플레이크는 AWS와 5년간 60억 달러 규모의 AI 인프라 메가딜을 체결했고, 이 한 가지 호재로 상장 이래 최고 일일 상승률(+39.43%)을 기록했습니다.',
    src:'자막: "AWS랑 5년간 60억 달러의 딜을 했다. 이거죠. 이거 하나에요."'
  },
  {
    id:3, type:'ox', difficulty:'easy',
    question:'이날 발표된 4월 헤드라인 PCE(물가)는 시장 예상치보다 높게 나왔다.',
    answer:'O',
    explanation:'정답은 O입니다. 4월 헤드라인 PCE는 전년비 3.8%로 예상치를 상당히 웃돌며 3년래 최고치를 기록했습니다. 이것이 스태그플레이션 공포를 자극한 "물가 재가속" 신호였습니다.',
    src:'자막: "PCE를 보면 Y5Y로 3.8입니다. 예상치보다 상당히 높은 숫자를 보여줬고요."'
  },
  {
    id:4, type:'mc', difficulty:'medium',
    question:'시장의 안도 랠리를 촉발한 美·이란 휴전 양해각서(MOU)의 잠정 합의 기간은?',
    options:['영구적 휴전','30일','60일 (30일+30일)','90일'],
    answer:2,
    explanation:'영구적인 휴전이 아니라 60일(30일+30일) 동안 휴전을 연장하는 양해각서에 잠정 합의했다는 뉴스였습니다. 노바는 "영원히가 아니고 60일"이라는 점을 분명히 강조했습니다.',
    src:'자막: "60일입니다. 60일 30일. 30일 두 개 하면 2개월이죠. 2개월 동안 휴전을 연장한다라는 양의 각서에 잠정 합의."'
  },
  {
    id:5, type:'mc', difficulty:'medium',
    question:'노바가 설명한 "AI 밸류체인의 수직적 확산"에서, 현재 자금이 이동해 가고 있는 최상위 레이어는?',
    options:['GPU / 실리콘 레이어','인프라 / 서버 레이어','데이터 / 소프트웨어 레이어','네트워크 / 통신 레이어'],
    answer:2,
    explanation:'초기 GPU(실리콘) → 서버(인프라) → 데이터/소프트웨어 순으로 자금이 상향 이동 중입니다. 데이터를 다루는 기업(스노우플레이크, 몽고DB, 팔란티어)이 현재 주도층이며, "원소스(데이터)가 형편없으면 AI가 소용없다"는 논리입니다.',
    src:'자막: "이제는 어디로 가고 있는 거예요. 데이터 소프트웨어 레이어로 가는 거예요."'
  },
  {
    id:6, type:'sa', difficulty:'medium',
    question:'드론주 UMAC(Unusual Machines)이 +61.88% 폭등한 배경으로, 이 회사 이사회에 참여한 것으로 언급된 인물은 누구인가? (이름)',
    answer:['트럼프 주니어','트럼프주니어','trump jr','트럼프 jr','도널드 트럼프 주니어'],
    explanation:'트럼프 주니어가 이사회에 참여한 것으로 언급됐고, 노바는 이를 "아빠 찬스"라고 표현했습니다. 펜타곤 DDP(드론 지배 프로그램) 보도와 맞물려 숏스퀴즈까지 겹치며 폭등했습니다.',
    src:'자막: "이 회사의 고문이 누굽니까? 트럼프 주니어죠 ... 아빠 찬스를 쓴 겁니다."'
  },
  {
    id:7, type:'mc', difficulty:'medium',
    question:'고물가 시대 소비재 양극화에서, 노바가 "SELL / AVOID" 신호를 준 섹터는?',
    options:['가성비 할인점(DLTR, COST)','AI 기기 리테일(BBY)','일반 의류(AEO, GAP)','비만치료제(LLY)'],
    answer:2,
    explanation:'아메리칸이글(AEO −11%)·갭(GAP −14%) 등 일반 재량 의류 소비재는 고객 트래픽 급감과 가이던스 하향으로 SELL/AVOID 신호를 받았습니다. 반면 DLTR·COST는 BUY, BBY는 BUY/HOLD였습니다.',
    src:'자막: "아메리칸 이글이라든지 갭은 완전히 망가졌어요 ... 고객 트래픽 자체가 줄었다."'
  },
  {
    id:8, type:'sa', difficulty:'medium',
    question:'델의 AI 서버 가이던스는 기존 10억 달러에서 60억 달러로 상향됐다. 이는 몇 배 증가한 것인가? (숫자만)',
    answer:['6','6배','6.0','six'],
    explanation:'기존 가이던스 $10B → 신규 $60B로 6배 상향입니다. 노바는 "실적도 6배인데 가이던스도 6배. 이는 계약 물량이 이미 숫자로 확정됐다는 신호"라고 해석했습니다.',
    src:'자막: "기존에 10빌리언이었는데 60빌리언 ... 6배예요. 6배. 6배 가이던스가 또 늘어난 거예요."'
  },
  {
    id:9, type:'ox', difficulty:'hard',
    question:'노바는 코스피 3만 도달의 전제 조건으로 "연임이 가능한 개헌"이 이뤄지는 경우를 들었다.',
    answer:'O',
    explanation:'정답은 O입니다. 노바는 "연임이 가능한 개헌 소식이 나오면 코스피 3만도 갑니다"라고 언급했습니다. 다만 본인은 "그럴 일이 없겠지"라며 실현 가능성에는 회의적 견해를 덧붙였습니다.',
    src:'자막: "연임이 가능한 개헌 소식이 나온다 그럼 코스피 3만도 갑니다."'
  },
  {
    id:10, type:'mc', difficulty:'hard',
    question:'여름철 단기 기술적 조정에 대비해 노바가 권고한 현금 확보 비중은? (BofA 리포트 경고와 연계)',
    options:['0~5%','10~15%','25~30%','50% 이상'],
    answer:1,
    explanation:'노바는 BofA 조사에서 기관 현금 비중이 3.9%로 급감했다는 경고를 인용하며, 여름철 단기 기술적 조정(10~15% 하락 가능)에 대비해 현금 10~15%를 확보한 상태에서 분할 매수 원칙을 고수하라고 권고했습니다.',
    src:'자막: "현금 10~15% 확보 상태에서 분할 매수 원칙 고수 ... 박앤세일 준비를 좀 하셔야."'
  }
];

let state = { solved:0, correct:0, done:{} };
const quizEl = document.getElementById('quiz');

function norm(s){return (s||'').toString().trim().toLowerCase().replace(/\s+/g,'').replace(/[.,!?]/g,'');}

function render(){
  QUIZ_DATA.forEach(q=>{
    const card=document.createElement('div');
    card.className='q'; card.id='q'+q.id;
    const diffMap={easy:['쉬움','b-easy'],medium:['보통','b-med'],hard:['어려움','b-hard']};
    const typeMap={mc:'객관식',sa:'단답형',ox:'O/X'};
    let body='';
    if(q.type==='mc'){
      body='<div class="opts">'+q.options.map((o,i)=>
        `<button class="opt" data-i="${i}">${o}<span class="tagb" style="display:none"></span></button>`).join('')+'</div>';
    } else if(q.type==='sa'){
      body=`<div class="sa-hint">정답을 입력하고 제출하세요.</div>
        <div class="sa"><input type="text" placeholder="답 입력..." autocomplete="off"><button>제출</button></div>`;
    } else {
      body=`<div class="ox"><button data-v="O">O</button><button data-v="X">X</button></div>`;
    }
    card.innerHTML=`
      <div class="q-top">
        <span class="qno">Q${q.id}</span>
        <span class="badge ${diffMap[q.difficulty][1]}">${diffMap[q.difficulty][0]}</span>
        <span class="badge b-type">${typeMap[q.type]}</span>
      </div>
      <div class="q-text">${q.question}</div>
      ${body}
      <div class="exp" id="exp${q.id}"><div class="exp-in">
        <div class="exp-verdict" id="ver${q.id}"></div>
        <div class="exp-body">${q.explanation}</div>
        <div class="exp-src">📌 <b>근거</b> · ${q.src}</div>
      </div></div>`;
    quizEl.appendChild(card);

    if(q.type==='mc'){
      card.querySelectorAll('.opt').forEach(btn=>{
        btn.addEventListener('click',()=>{
          if(state.done[q.id])return;
          const pick=+btn.dataset.i;
          gradeMC(q,card,pick);
        });
      });
    } else if(q.type==='sa'){
      const inp=card.querySelector('input'), sub=card.querySelector('button');
      const go=()=>{if(state.done[q.id])return; gradeSA(q,card,inp.value);};
      sub.addEventListener('click',go);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    } else {
      card.querySelectorAll('.ox button').forEach(btn=>{
        btn.addEventListener('click',()=>{if(state.done[q.id])return; gradeOX(q,card,btn.dataset.v);});
      });
    }
  });
}

function lockExplain(q,card,isCorrect){
  state.done[q.id]=true;
  state.solved++;
  if(isCorrect)state.correct++;
  const ver=document.getElementById('ver'+q.id);
  ver.className='exp-verdict '+(isCorrect?'ok':'no');
  ver.textContent=isCorrect?'✓ 정답입니다!':'✗ 오답입니다';
  document.getElementById('exp'+q.id).classList.add('show');
  updateScore();
  if(state.solved===QUIZ_DATA.length)setTimeout(showFinal,500);
}

function gradeMC(q,card,pick){
  const opts=card.querySelectorAll('.opt');
  const correct = pick===q.answer;
  opts.forEach((o,i)=>{
    o.disabled=true;
    const tag=o.querySelector('.tagb');
    if(i===q.answer){o.classList.add('correct');tag.style.display='inline';tag.textContent='✓ 정답';}
    if(i===pick && !correct){o.classList.add('wrong');tag.style.display='inline';tag.textContent='✗ 오답';}
  });
  lockExplain(q,card,correct);
}

function gradeSA(q,card,val){
  const correct = q.answer.map(norm).includes(norm(val));
  const inp=card.querySelector('input'), sub=card.querySelector('button');
  inp.disabled=true; sub.disabled=true;
  inp.style.borderColor = correct?'var(--ok)':'var(--no)';
  inp.style.background = correct?'var(--okbg)':'var(--nobg)';
  if(!correct){
    const hint=card.querySelector('.sa-hint');
    hint.innerHTML=`정답: <b style="color:var(--ok)">${q.answer[0]}</b>`;
  }
  lockExplain(q,card,correct);
}

function gradeOX(q,card,v){
  const correct = v===q.answer;
  card.querySelectorAll('.ox button').forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===q.answer)b.classList.add('correct');
    if(b.dataset.v===v && !correct)b.classList.add('wrong');
  });
  lockExplain(q,card,correct);
}

function updateScore(){
  document.getElementById('sSolved').textContent=state.solved;
  document.getElementById('sCorrect').textContent=state.correct;
  const acc = state.solved? Math.round(state.correct/state.solved*100):0;
  document.getElementById('sAcc').textContent=acc+'%';
  const bar=document.getElementById('sBar');
  bar.style.width=acc+'%';
  bar.style.background = acc<40?'#e11d48':(acc<70?'#f59e0b':'#0a8a3f');
}

function showFinal(){
  const total=QUIZ_DATA.length, c=state.correct;
  const pct=Math.round(c/total*100);
  let grade,msg;
  if(pct>=90){grade='A';msg='완벽합니다! 이날 미팅의 핵심을 모두 꿰뚫었습니다.';}
  else if(pct>=70){grade='B';msg='훌륭합니다. 주요 트렌드를 잘 이해하고 있어요.';}
  else if(pct>=50){grade='C';msg='기본은 잡혔습니다. 해설을 다시 읽어보며 보완해 보세요.';}
  else {grade='D';msg='아쉽네요. 분석 리포트를 한 번 더 복습하고 도전해 보세요.';}
  document.getElementById('mGrade').textContent=grade;
  document.getElementById('mScore').textContent=c+' / '+total;
  document.getElementById('mMsg').textContent=msg;
  document.getElementById('ov').classList.add('show');
}

document.getElementById('mRetry').addEventListener('click',()=>{
  state={solved:0,correct:0,done:{}};
  quizEl.innerHTML='';
  document.getElementById('ov').classList.remove('show');
  updateScore();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
});

render();
updateScore();
</script>
</body>
</html>
