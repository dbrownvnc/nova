<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Real Invest — 인터랙티브 시험문제</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg2: #fafafa;
    --text: #1a1a1a;
    --text2: #777777;
    --accent: #e11d48;
    --accent2: #f43f5e;
    --border: #e5e5e5;
    --correct-bg: #dcfce7;
    --correct-bd: #86efac;
    --correct-txt: #15803d;
    --wrong-bg: #fff1f2;
    --wrong-bd: #fda4af;
    --wrong-txt: #be123c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f5f5f5;
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── 스티키 점수판 ── */
  .scorebar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--text);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  .scorebar-title {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    flex: 1;
    min-width: 100px;
  }
  .score-items { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .score-chip {
    font-size: 12px;
    background: rgba(255,255,255,.12);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .score-chip span { font-weight: 700; color: #fff; }
  .progress-bar-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,.15);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 2px;
    width: 0%;
    transition: width .4s ease, background-color .4s ease;
    background: #ef4444;
  }

  /* ── 헤더 ── */
  .hero {
    background: var(--text);
    color: #fff;
    padding: 36px 20px 28px;
    text-align: center;
  }
  .hero-label { font-size: 11px; letter-spacing: 3px; color: var(--accent); margin-bottom: 10px; }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 5vw, 30px);
    font-weight: 900;
    margin-bottom: 8px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p { font-size: 13px; color: #aaa; }

  /* ── 컨테이너 ── */
  .container { max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }

  /* ── 문제 카드 ── */
  .q-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 20px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .q-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    min-width: 32px;
  }
  .q-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
  }
  .badge-easy { background: #dcfce7; color: #15803d; }
  .badge-normal { background: #fef3c7; color: #92400e; }
  .badge-hard { background: #fee2e2; color: #b91c1c; }
  .badge-mc { background: #ede9fe; color: #6d28d9; }
  .badge-short { background: #e0f2fe; color: #0369a1; }
  .badge-ox { background: #fce7f3; color: #9d174d; }

  .q-text {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 16px;
    line-height: 1.7;
  }

  /* ── 보기 버튼 ── */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: var(--bg2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all .2s;
    color: var(--text);
    line-height: 1.5;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #fff1f2;
  }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct-bd);
    color: var(--correct-txt);
    font-weight: 700;
  }
  .opt-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-bd);
    color: var(--wrong-txt);
  }
  .opt-btn .badge-result {
    float: right;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 8px;
  }
  .badge-ok { background: var(--correct-txt); color: #fff; }
  .badge-no { background: var(--wrong-txt); color: #fff; }

  /* ── OX 버튼 ── */
  .ox-wrap { display: flex; gap: 10px; }
  .ox-btn {
    flex: 1;
    padding: 14px;
    font-size: 22px;
    font-weight: 900;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--bg2);
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .ox-btn:hover:not(:disabled) { border-color: var(--accent); background: #fff1f2; }
  .ox-btn:disabled { cursor: default; }
  .ox-btn.correct { background: var(--correct-bg); border-color: var(--correct-bd); }
  .ox-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong-bd); }

  /* ── 단답형 ── */
  .short-wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .short-input {
    flex: 1;
    min-width: 160px;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .short-input:focus { border-color: var(--accent); }
  .short-input:disabled { background: var(--bg2); }
  .submit-btn {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity .2s;
  }
  .submit-btn:hover { opacity: .85; }
  .submit-btn:disabled { opacity: .4; cursor: default; }

  /* ── 해설 ── */
  .explanation {
    display: none;
    margin-top: 14px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: #78350f;
    line-height: 1.7;
  }
  .explanation strong { color: #92400e; }
  .explanation.show { display: block; }

  /* ── 모달 ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 36px 28px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    animation: popIn .4s ease;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .modal-emoji { font-size: 56px; margin-bottom: 12px; }
  .modal-score {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 900;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .modal-grade {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .modal-msg { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.7; }
  .retry-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  @media (max-width: 400px) {
    .q-card { padding: 16px 14px; }
    .scorebar { gap: 6px; }
    .score-items { gap: 6px; }
  }
</style>
</head>

let state = { solved: 0, correct: 0 };

function updateScoreboard() {
  document.getElementById('solved').textContent  = state.solved;
  document.getElementById('correct').textContent = state.correct;
  const rate = state.solved === 0 ? 0 : Math.round(state.correct / state.solved * 100);
  document.getElementById('rate').textContent = rate;
  const bar = document.getElementById('progressBar');
  bar.style.width = (state.solved / 10 * 100) + '%';
  bar.style.background = rate >= 70 ? '#16a34a' : rate >= 40 ? '#d97706' : '#ef4444';

  if (state.solved === 10) showResult();
}

function markAnswer(isCorrect) {
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreboard();
}

function showExplanation(id) {
  document.getElementById('exp-' + id).classList.add('show');
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  state = { solved: 0, correct: 0 };
  updateScoreboard();

  QUIZ_DATA.forEach((q) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + q.id;

    const diffMap = { easy: '쉬움', normal: '보통', hard: '어려움' };
    const diffClass = { easy: 'badge-easy', normal: 'badge-normal', hard: 'badge-hard' };
    const typeMap = { mc: '객관식', ox: 'OX', short: '단답형' };
    const typeClass = { mc: 'badge-mc', ox: 'badge-ox', short: 'badge-short' };

    let optionsHTML = '';

    if (q.type === 'mc') {
      optionsHTML = '<div class="options">' + q.options.map((opt, i) =>
        `<button class="opt-btn" onclick="checkMC(${q.id}, ${i})">${opt}</button>`
      ).join('') + '</div>';
    } else if (q.type === 'ox') {
      optionsHTML = `<div class="ox-wrap">
        <button class="ox-btn" onclick="checkOX(${q.id}, 'O')">⭕</button>
        <button class="ox-btn" onclick="checkOX(${q.id}, 'X')">❌</button>
      </div>`;
    } else if (q.type === 'short') {
      optionsHTML = `<div class="short-wrap">
        <input type="text" class="short-input" id="short-${q.id}" placeholder="정답을 입력하세요..." onkeydown="if(event.key==='Enter') checkShort(${q.id})">
        <button class="submit-btn" id="sbtn-${q.id}" onclick="checkShort(${q.id})">제출</button>
      </div>
      <div id="short-result-${q.id}" style="margin-top:8px;font-size:13px;font-weight:700;"></div>`;
    }

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">Q${q.id}</div>
        <span class="q-badge ${diffClass[q.difficulty]}">${diffMap[q.difficulty]}</span>
        <span class="q-badge ${typeClass[q.type]}">${typeMap[q.type]}</span>
      </div>
      <div class="q-text">${q.question}</div>
      ${optionsHTML}
      <div class="explanation" id="exp-${q.id}">
        <strong>📚 해설:</strong> ${q.explanation}
      </div>
    `;
    container.appendChild(card);
  });
}

function checkMC(qid, chosen) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const card = document.getElementById('card-' + qid);
  const btns = card.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = chosen === q.answer;
  btns[chosen].classList.add(isCorrect ? 'correct' : 'wrong');
  btns[chosen].innerHTML += `<span class="badge-result ${isCorrect ? 'badge-ok' : 'badge-no'}">${isCorrect ? '✓ 정답!' : '✗ 오답'}</span>`;

  if (!isCorrect) {
    btns[q.answer].classList.add('correct');
    btns[q.answer].innerHTML += `<span class="badge-result badge-ok">✓ 정답</span>`;
  }
  showExplanation(qid);
  markAnswer(isCorrect);
}

function checkOX(qid, chosen) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const card = document.getElementById('card-' + qid);
  const btns = card.querySelectorAll('.ox-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = chosen === q.answer;
  const chosenIdx = chosen === 'O' ? 0 : 1;
  const correctIdx = q.answer === 'O' ? 0 : 1;
  btns[chosenIdx].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) btns[correctIdx].classList.add('correct');
  showExplanation(qid);
  markAnswer(isCorrect);
}

function checkShort(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const input = document.getElementById('short-' + qid);
  const sbtn  = document.getElementById('sbtn-' + qid);
  const resultEl = document.getElementById('short-result-' + qid);
  const val = input.value.trim();
  if (!val) return;

  input.disabled = true;
  sbtn.disabled = true;

  const allAnswers = [q.answer, ...(q.answerAlts || [])].map(a => a.toLowerCase().replace(/\s/g,''));
  const isCorrect = allAnswers.includes(val.toLowerCase().replace(/\s/g,''));

  resultEl.textContent = isCorrect ? '✓ 정답!' : `✗ 오답 — 정답: ${q.answer}`;
  resultEl.style.color = isCorrect ? '#15803d' : '#be123c';
  showExplanation(qid);
  markAnswer(isCorrect);
}

function showResult() {
  const score = state.correct;
  const rate  = Math.round(score / 10 * 100);
  let grade, emoji, msg;

  if (score >= 9) { grade = 'A+'; emoji = '🏆'; msg = '완벽합니다! NOVA 방송을 완벽하게 이해하셨군요. AI 시대의 승자가 되실 자격이 있습니다!'; }
  else if (score >= 8) { grade = 'A';  emoji = '🥇'; msg = '훌륭합니다! 핵심 내용을 잘 파악하셨습니다. AI 로드킬은 없을 것 같네요.'; }
  else if (score >= 7) { grade = 'B';  emoji = '👍'; msg = '좋은 성적입니다! 조금 더 복습하면 완벽해질 것 같아요.'; }
  else if (score >= 5) { grade = 'C';  emoji = '📚'; msg = '괜찮습니다! 아직 복습이 필요한 부분이 있어요. 분석 리포트를 다시 읽어보세요.'; }
  else { grade = 'D'; emoji = '💪'; msg = '더 열심히 공부해 봅시다! AI 로드킬을 피하기 위해 다시 방송을 돌려보세요.'; }

  document.getElementById('modalEmoji').textContent  = emoji;
  document.getElementById('modalScore').textContent  = score + ' / 10';
  document.getElementById('modalGrade').textContent  = '등급: ' + grade + ' (' + rate + '%)';
  document.getElementById('modalMsg').textContent    = msg;
  document.getElementById('resultModal').classList.add('show');
}

function retryQuiz() {
  document.getElementById('resultModal').classList.remove('show');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 초기 렌더링
renderQuiz();
</script>
</body>
</html>
