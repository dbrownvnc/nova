<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Real Invest — 시험문제 2026.05.02</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg2: #fafafa;
    --text: #1a1a1a;
    --text2: #777777;
    --accent: #e11d48;
    --accent2: #f43f5e;
    --border: #e5e5e5;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  /* ── Sticky Score Bar ── */
  #scoreBar {
    position: sticky;
    top: 0;
    z-index: 200;
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 3px solid var(--accent);
    flex-wrap: wrap;
  }
  #scoreBar .logo {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 900;
    color: var(--accent2);
    flex-shrink: 0;
  }
  #scoreBar .stats {
    display: flex;
    gap: 14px;
    font-size: 12px;
    flex-wrap: wrap;
  }
  #scoreBar .stats span { color: #aaa; }
  #scoreBar .stats strong { color: #fff; }
  .progress-wrap {
    flex: 1;
    min-width: 80px;
    background: #333;
    border-radius: 20px;
    height: 6px;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    transition: width 0.5s ease, background 0.5s ease;
    background: #e11d48;
  }

  /* ── Header ── */
  .quiz-hero {
    background: var(--text);
    color: #fff;
    padding: 36px 20px 28px;
    text-align: center;
  }
  .quiz-hero .kicker {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 10px;
  }
  .quiz-hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 10px;
  }
  .quiz-hero p { font-size: 13px; color: #aaa; }

  /* ── Main ── */
  main { max-width: 680px; margin: 0 auto; padding: 20px 16px; }

  /* ── Question Card ── */
  .q-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 22px 20px;
    margin-bottom: 18px;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: #fff0f3;
    border: 1px solid var(--accent);
    border-radius: 20px;
    padding: 2px 10px;
  }
  .q-type {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: var(--text);
    color: #fff;
    padding: 2px 8px;
    border-radius: 2px;
  }
  .q-diff {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .diff-easy   { background: #dcfce7; color: #16a34a; }
  .diff-medium { background: #fef9c3; color: #a16207; }
  .diff-hard   { background: #fee2e2; color: #dc2626; }
  .q-text {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  /* ── Options ── */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    transition: border-color 0.18s, background 0.18s;
    line-height: 1.55;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #fff5f7; }
  .opt-btn .opt-label {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    margin-top: 1px;
    transition: background 0.18s;
  }
  .opt-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .opt-btn.correct .opt-label { background: var(--correct); color: #fff; }
  .opt-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .opt-btn.wrong .opt-label { background: var(--wrong); color: #fff; }
  .opt-btn:disabled { cursor: default; }
  .result-badge {
    margin-left: auto;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    align-self: center;
  }
  .badge-correct { background: var(--correct); color: #fff; }
  .badge-wrong   { background: var(--wrong);   color: #fff; }

  /* ── Short answer ── */
  .short-wrap { display: flex; gap: 8px; }
  .short-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color 0.18s;
  }
  .short-input:focus { border-color: var(--accent); }
  .short-input:disabled { background: var(--bg2); }
  .submit-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s;
    flex-shrink: 0;
  }
  .submit-btn:hover:not(:disabled) { background: var(--accent2); }
  .submit-btn:disabled { background: var(--border); color: var(--text2); cursor: default; }

  /* ── OX ── */
  .ox-wrap { display: flex; gap: 10px; }
  .ox-btn {
    flex: 1;
    border: 2px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 14px;
    font-size: 26px;
    font-weight: 900;
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s;
    font-family: 'Playfair Display', serif;
  }
  .ox-btn:hover:not(:disabled) { border-color: var(--accent); background: #fff5f7; }
  .ox-btn.correct { background: var(--correct-bg); border-color: var(--correct); }
  .ox-btn.wrong   { background: var(--wrong-bg);   border-color: var(--wrong); }
  .ox-btn:disabled { cursor: default; }

  /* ── Explanation ── */
  .explanation {
    display: none;
    margin-top: 14px;
    background: #fffbf0;
    border: 1px solid #fcd34d;
    border-left: 4px solid #f59e0b;
    border-radius: 4px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }
  .explanation .ex-title {
    font-weight: 700;
    color: #d97706;
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .explanation.show { display: block; }

  /* ── Short answer result ── */
  .short-result {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  .short-result.correct-text { color: var(--correct); }
  .short-result.wrong-text   { color: var(--wrong); }
  .short-result.show { display: block; }

  /* ── Final Modal ── */
  #finalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #finalOverlay.show { display: flex; }
  #finalCard {
    background: #fff;
    border-radius: 10px;
    padding: 36px 28px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  #finalCard .final-emoji { font-size: 54px; margin-bottom: 12px; }
  #finalCard .final-score {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 6px;
  }
  #finalCard .final-total { font-size: 14px; color: var(--text2); margin-bottom: 14px; }
  #finalCard .final-grade {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    background: var(--text);
    color: #fff;
    padding: 6px 22px;
    border-radius: 4px;
    margin-bottom: 16px;
  }
  #finalCard .final-msg {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 24px;
    line-height: 1.6;
  }
  #retryBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 13px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }
  #retryBtn:hover { background: var(--accent2); }

  @media (max-width: 400px) {
    .quiz-hero h1 { font-size: 21px; }
    .opt-btn { font-size: 13px; }
    .short-wrap { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- Sticky Score Bar -->
<div id="scoreBar">
  <div class="logo">NOVA QUIZ</div>
  <div class="stats">
    <span>푼 문제 <strong id="sSolved">0</strong> / 10</span>
    <span>맞힌 문제 <strong id="sCorrect">0</strong></span>
    <span>정답률 <strong id="sPct">0%</strong></span>
  </div>
  <div class="progress-wrap">
    <div id="progressBar"></div>
  </div>
</div>

<!-- Hero -->
<div class="quiz-hero">
  <div class="kicker">NOVA Real Invest — 2026.05.02 Live</div>
  <h1>오늘 방송 핵심<br>인터랙티브 퀴즈 10문제</h1>
  <p>객관식 · 단답형 · OX | 클릭 한 번으로 즉시 채점 · 해설 자동 표시</p>
</div>

<main id="quizMain"></main>

<!-- Final Modal -->
<div id="finalOverlay">
  <div id="finalCard">
    <div class="final-emoji" id="finalEmoji">🏆</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-total">/ 10점</div>
    <div class="final-grade" id="finalGrade">A</div>
    <div class="final-msg" id="finalMsg"></div>
    <button id="retryBtn" onclick="resetQuiz()">↺ 다시 풀기</button>
  </div>
</div>

<script>
const QUIZ_DATA = [

    options: ['20,000', '22,500', '25,000', '28,000'],

  },
  {

    options: ['이란 전쟁 지속', '유가 $80 돌파', '30년물 국채금리 5% 접근', 'EU 자동차 관세 25% 예고'],
    answer: 2,

  },
  {

  },
  {
    id: 4,

  {
    id: 5,

  {

  {
    id: 7,

    answer: ['1000억달러', '천억달러', '1000억 달러', '천억 달러', '101b', '100b', '1000억', '천억'],
    explanation: '"애플 2분기 매출 101밀리언달러(천억 달러)를 이만큼 번 걸 바로 천억 자사주 매입으로 승인하고 배당까지 인상해버립니다"라고 노바가 언급했습니다. 애플이 막대한 현금(캐시)을 AI 투자 대신 주주 환원에 사용하는 전략입니다.'

  {

  {

    options: ['O', 'X'],
    answer: 0,
    explanation: '노바는 "이제 주식시장이 어느 정도 건강해진 거다"라고 말했습니다. 밈 주식, 꿈팔이, 미래팔이 등 스토리만으로 주가가 오르던 시대가 끝나고 실제 실적·현금 흐름이 중요해진 것을 "반갑다"고 표현했습니다. "모든 사람들이 이걸로 이제 정신을 차려야 됩니다"라고도 언급했습니다.'
  }
];

let state = { solved: 0, correct: 0, answeredIds: new Set() };

function diffLabel(d) {
  if (d === 'easy')   return '<span class="q-diff diff-easy">쉬움</span>';
  if (d === 'medium') return '<span class="q-diff diff-medium">보통</span>';
  return '<span class="q-diff diff-hard">어려움</span>';
}
function typeLabel(t) {
  if (t === 'mc')    return '객관식';
  if (t === 'ox')    return 'O / X';
  if (t === 'short') return '단답형';
  return t;
}

function buildQuiz() {
  const main = document.getElementById('quizMain');
  main.innerHTML = '';
  QUIZ_DATA.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${q.id}`;

    let optionsHTML = '';
    if (q.type === 'mc') {
      optionsHTML = `<div class="options" id="opts-${q.id}">` +
        q.options.map((opt, i) =>
          `<button class="opt-btn" onclick="answerMC(${q.id},${i})" data-idx="${i}">
            <span class="opt-label">${['①','②','③','④'][i]}</span>
            <span>${opt}</span>
           </button>`
        ).join('') + '</div>';
    } else if (q.type === 'ox') {
      optionsHTML = `<div class="ox-wrap" id="opts-${q.id}">
        <button class="ox-btn" onclick="answerOX(${q.id},0)" data-idx="0">O</button>
        <button class="ox-btn" onclick="answerOX(${q.id},1)" data-idx="1">X</button>
      </div>`;
    } else if (q.type === 'short') {
      optionsHTML = `<div class="short-wrap">
        <input class="short-input" type="text" id="sinput-${q.id}" placeholder="답을 입력하세요">
        <button class="submit-btn" id="sbtn-${q.id}" onclick="answerShort(${q.id})">제출</button>
      </div>
      <div class="short-result" id="sresult-${q.id}"></div>`;
    }

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">Q${q.id}</span>
        <span class="q-type">${typeLabel(q.type)}</span>
        ${diffLabel(q.difficulty)}
      </div>
      <div class="q-text">${q.question}</div>
      ${optionsHTML}
      <div class="explanation" id="ex-${q.id}">
        <div class="ex-title">📖 해설</div>
        <div>${q.explanation}</div>
      </div>
    `;
    main.appendChild(card);
  });
}

function updateScoreBar() {
  document.getElementById('sSolved').textContent  = state.solved;
  document.getElementById('sCorrect').textContent = state.correct;
  const pct = state.solved === 0 ? 0 : Math.round((state.correct / state.solved) * 100);
  document.getElementById('sPct').textContent = pct + '%';
  const bar = document.getElementById('progressBar');
  bar.style.width = (state.solved / 10 * 100) + '%';
  if (pct < 40)      bar.style.background = '#e11d48';
  else if (pct < 70) bar.style.background = '#f59e0b';
  else               bar.style.background = '#16a34a';
}

function markAnswered(qid, isCorrect) {
  if (state.answeredIds.has(qid)) return false;
  state.answeredIds.add(qid);
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreBar();
  if (state.solved === 10) {
    setTimeout(showFinal, 700);
  }
  return true;
}

function showExplanation(qid) {
  const el = document.getElementById(`ex-${qid}`);
  if (el) el.classList.add('show');
}

function disableOptions(containerId) {
  const cont = document.getElementById(containerId);
  if (!cont) return;
  cont.querySelectorAll('button').forEach(b => b.disabled = true);
}

function answerMC(qid, idx) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  if (!q || state.answeredIds.has(qid)) return;
  const isCorrect = idx === q.answer;
  markAnswered(qid, isCorrect);

  const btns = document.querySelectorAll(`#opts-${qid} .opt-btn`);
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) {
      btn.classList.add('correct');
      btn.insertAdjacentHTML('beforeend', '<span class="result-badge badge-correct">✓ 정답!</span>');
    }
    if (i === idx && !isCorrect) {
      btn.classList.add('wrong');
      btn.querySelector('.result-badge')?.remove();
      btn.insertAdjacentHTML('beforeend', '<span class="result-badge badge-wrong">✗ 오답</span>');
    }
  });
  showExplanation(qid);
}

function answerOX(qid, idx) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  if (!q || state.answeredIds.has(qid)) return;
  const isCorrect = idx === q.answer;
  markAnswered(qid, isCorrect);

  const btns = document.querySelectorAll(`#opts-${qid} .ox-btn`);
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('wrong');
  });
  showExplanation(qid);
}

function answerShort(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  if (!q || state.answeredIds.has(qid)) return;
  const input = document.getElementById(`sinput-${qid}`);
  const val = input.value.trim().toLowerCase().replace(/\s/g, '');
  const accepted = q.answer.map(a => a.toLowerCase().replace(/\s/g, ''));
  const isCorrect = accepted.some(a => val.includes(a) || a.includes(val));

  markAnswered(qid, isCorrect);
  input.disabled = true;
  document.getElementById(`sbtn-${qid}`).disabled = true;

  const resultEl = document.getElementById(`sresult-${qid}`);
  if (isCorrect) {
    resultEl.textContent = '✓ 정답입니다!';
    resultEl.className = 'short-result correct-text show';
  } else {
    resultEl.textContent = `✗ 오답. 정답: ${q.answer[0]}`;
    resultEl.className = 'short-result wrong-text show';
  }
  showExplanation(qid);
}

function showFinal() {
  const sc = state.correct;
  let grade, msg, emoji;
  if (sc >= 9)      { grade = 'A+'; msg = '완벽합니다! 노바 방송을 정말 집중해서 들으셨군요. 당신은 이미 고수입니다. 🎉'; emoji = '🏆'; }
  else if (sc >= 8) { grade = 'A';  msg = '훌륭합니다! 핵심 내용을 대부분 파악하셨습니다.'; emoji = '🥇'; }
  else if (sc >= 7) { grade = 'B';  msg = '잘 하셨습니다. 놓친 부분을 다시 한번 복습해보세요.'; emoji = '🥈'; }
  else if (sc >= 5) { grade = 'C';  msg = '무난한 수준입니다. 방송 내용을 한 번 더 확인해보세요.'; emoji = '📖'; }
  else              { grade = 'D';  msg = '아직 갈 길이 있습니다. 방송 복습 후 다시 도전해보세요!'; emoji = '💪'; }

  document.getElementById('finalEmoji').textContent = emoji;
  document.getElementById('finalScore').textContent = sc;
  document.getElementById('finalGrade').textContent = grade;
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('finalOverlay').classList.add('show');
}

function resetQuiz() {
  state = { solved: 0, correct: 0, answeredIds: new Set() };
  updateScoreBar();
  document.getElementById('finalOverlay').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
buildQuiz();
updateScoreBar();
</script>
</body>
</html>
