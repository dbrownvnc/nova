<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매크로의 중력이 AI 랠리를 시험한 날 — 시험문제</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --bg2: #fafafa;
  --text: #1a1a1a;
  --text2: #777777;
  --accent: #e11d48;
  --accent2: #f43f5e;
  --border: #e5e5e5;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --green-border: #86efac;
  --red-bg: #fff1f2;
  --red-border: #fecdd3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  line-height: 1.7;
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px 60px;
}

/* HEADER */
.quiz-header {
  text-align: center;
  padding: 32px 0 16px;
  border-bottom: 3px solid var(--accent);
  margin-bottom: 16px;
}
.quiz-header .label {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
}
.quiz-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 5vw, 30px);
  font-weight: 900;
  line-height: 1.2;
  margin: 10px 0 8px;
}
.quiz-header p {
  font-size: 13px;
  color: var(--text2);
}

/* STICKY SCORE BAR */
.score-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 2px solid var(--border);
  padding: 10px 16px;
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 13px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.score-bar .s-item { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
.score-bar .s-num { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; color: var(--accent); line-height: 1.1; }
.score-bar .s-label { font-size: 10px; color: var(--text2); letter-spacing: 0.5px; }
.score-bar .progress-wrap { flex: 1; }
.progress-track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.5s; }

/* QUIZ CARDS */
.quiz-list { margin-top: 8px; }
.quiz-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 18px;
  margin: 16px 0;
  transition: border-color 0.3s;
}
.quiz-card.answered { border-color: #d1d5db; }
.q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.q-num {
  background: var(--accent);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
}
.q-diff {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}
.diff-easy { background: #dcfce7; color: #15803d; }
.diff-normal { background: #fef9c3; color: #a16207; }
.diff-hard { background: #fee2e2; color: #b91c1c; }
.q-type {
  font-size: 10px;
  color: var(--text2);
  background: white;
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 20px;
}
.q-text {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 14px;
  color: var(--text);
}

/* OPTIONS */
.options { display: flex; flex-direction: column; gap: 8px; }
.opt-btn {
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: white;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.5;
}
.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #fff5f7; }
.opt-btn.correct { background: var(--green-bg) !important; border-color: var(--green-border) !important; color: var(--green) !important; font-weight: 700; }
.opt-btn.wrong { background: var(--red-bg) !important; border-color: var(--red-border) !important; color: var(--accent) !important; font-weight: 700; }
.opt-btn:disabled { cursor: not-allowed; }

/* OX */
.ox-wrap { display: flex; gap: 12px; }
.ox-btn {
  flex: 1;
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: white;
  font-size: 28px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Noto Sans KR', sans-serif;
}
.ox-btn:hover:not(:disabled) { border-color: var(--accent); background: #fff5f7; }
.ox-btn.correct { background: var(--green-bg) !important; border-color: var(--green-border) !important; }
.ox-btn.wrong { background: var(--red-bg) !important; border-color: var(--red-border) !important; }
.ox-btn:disabled { cursor: not-allowed; }

/* SHORT ANSWER */
.short-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
.short-input {
  flex: 1;
  min-width: 160px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.short-input:focus { border-color: var(--accent); }
.short-input:disabled { background: var(--bg2); }
.submit-btn {
  padding: 10px 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.submit-btn:hover:not(:disabled) { background: var(--accent2); }
.submit-btn:disabled { background: #d1d5db; cursor: not-allowed; }

/* FEEDBACK BADGE */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  margin-top: 10px;
}
.badge-correct { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-wrong { background: var(--red-bg); color: var(--accent); border: 1px solid var(--red-border); }

/* EXPLANATION */
.explanation {
  margin-top: 12px;
  padding: 12px 14px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  display: none;
}
.explanation.show { display: block; }
.explanation strong { color: var(--text); }

/* RESULT MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: white;
  border-radius: 16px;
  padding: 32px 28px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal .grade {
  font-family: 'Playfair Display', serif;
  font-size: 72px;
  font-weight: 900;
  color: var(--accent);
  line-height: 1;
}
.modal .score-text {
  font-size: 18px;
  font-weight: 700;
  margin: 8px 0 4px;
}
.modal .msg { font-size: 14px; color: var(--text2); margin: 8px 0 24px; }
.retry-btn {
  padding: 14px 32px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 30px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.retry-btn:hover { background: var(--accent2); }

.footer {
  text-align: center;
  padding: 24px 0 10px;
  border-top: 1px solid var(--border);
  margin-top: 32px;
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="quiz-header">
  <div class="label">CIA.chat 멤버미팅 20 · 이해도 확인</div>
  <h1>시험문제 10선</h1>
  <p>매크로의 중력이 AI 랠리를 시험한 날 — 핵심 내용 검증</p>
</div>

<!-- STICKY SCORE BAR -->
<div class="score-bar" id="scoreBar">
  <div class="s-item">
    <div class="s-num" id="sc-solved">0</div>
    <div class="s-label">푼 문제</div>
  </div>
  <div class="s-item">
    <div class="s-num" id="sc-correct">0</div>
    <div class="s-label">맞힌 수</div>
  </div>
  <div class="s-item">
    <div class="s-num" id="sc-pct">0%</div>
    <div class="s-label">정답률</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div style="font-size:11px;color:var(--text2);margin-top:4px;text-align:right;">10문제</div>
  </div>
</div>

<div class="quiz-list" id="quizList"></div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="grade" id="modalGrade">B</div>
    <div class="score-text" id="modalScore">7 / 10</div>
    <div class="msg" id="modalMsg">잘 하셨습니다!</div>
    <button class="retry-btn" id="retryBtn">↺ 다시 풀기</button>
  </div>
</div>

<div class="footer">CIA.chat 멤버미팅 20 · 2026.05.19</div>

<script>
const QUIZ_DATA = [
  {
    id: 1,
    type: 'multiple',
    difficulty: 'easy',
    question: '2026년 5월 19일 기준, 30년물 미국 국채금리는 몇 %까지 올라 몇 년 만의 최고치를 기록했는가?',
    options: ['4.5%, 10년 만의 최고치', '5.198%, 19년 만의 최고치', '5.5%, 25년 만의 최고치', '4.75%, 5년 만의 최고치'],
    answer: 1,
    explanation: '방송에서 "30년물 국채금리가 5.198%까지 올라갔으며 이는 19년 만에 최고치"라고 명시했습니다.'
  },
  {
    id: 2,
    type: 'multiple',
    difficulty: 'easy',
    question: 'Bank of America(BofA)는 펀드매니저 현금 비중이 몇 % 이하로 떨어지면 "강세장 항복(Bull Capitulation)" 매도 시그널이 작동한다고 경고했는가?',
    options: ['5.0%', '3.5%', '4.0%', '2.5%'],
    answer: 2,
    explanation: '"4.0% 이하 진입 시 명확한 강세장 항복 및 매도 시그널 작동"이라고 BofA 보고서 내용을 언급했습니다. 당시 현금 비중은 3.9%였습니다.'
  },
  {
    id: 3,
    type: 'multiple',
    difficulty: 'normal',
    question: '엔비디아(NVDA) 실적 발표를 앞두고 옵션 시장이 선반영하고 있는 실적 후 예상 변동성 범위는?',
    options: ['±2%', '±4%', '±6%', '±10%'],
    answer: 2,
    explanation: '"옵션을 보니까 플러스 마이너스 6% 정도의 엄청난 변동성을 선반영하고 있다"고 언급했습니다.'
  },
  {
    id: 4,
    type: 'multiple',
    difficulty: 'normal',
    question: 'Google I/O 2026에서 발표된 AI 제품이 아닌 것은?',
    options: ['Gemini 3.5 Flash', 'Omni', 'Gemini Spark', 'Project Astra Pro'],
    answer: 3,
    explanation: '방송에서 언급된 구글 발표 제품은 Gemini 3.5 Flash(경량·고속), Omni(물리적 환경 시뮬레이션), Gemini Spark(에이전틱 AI 백그라운드 자동화) 세 가지입니다. Project Astra Pro는 언급되지 않았습니다.'
  },
  {
    id: 5,
    type: 'multiple',
    difficulty: 'normal',
    question: '방송에서 제시한 AI 인프라 3단계 확장 순서로 올바른 것은?',
    options: [
      '에너지 → 인프라 → 칩셋',
      '칩셋 → 에너지 → 인프라',
      '인프라 → 칩셋 → 에너지',
      '칩셋 → 인프라 → 에너지 패권'
    ],
    answer: 3,
    explanation: '"칩셋(GPU/TPU) → 인프라(하이퍼스케일 데이터센터) → 에너지 패권(전력망/신재생에너지)"의 3단계로 설명했습니다.'
  },
  {
    id: 6,
    type: 'multiple',
    difficulty: 'hard',
    question: '넥스트에라 에너지(NEE)가 도미니언(D)을 인수하는 거래 금액과 방식은?',
    options: [
      '500억 달러, 현금 인수',
      '670억 달러, 전액 주식 인수',
      '1,000억 달러, 혼합(현금+주식)',
      '300억 달러, 레버리지 바이아웃'
    ],
    answer: 1,
    explanation: '"전액 주식 인수로 합병을 한다"고 명시했으며, 제목에서도 "$67B(670억 달러) 기습 발표"라고 표현했습니다.'
  },
  {
    id: 7,
    type: 'ox',
    difficulty: 'easy',
    question: '방송에서는 엔비디아가 실적을 잘 발표한 당일 주가가 오른 경우가 많았다고 언급했다.',
    options: ['O', 'X'],
    answer: 1,
    explanation: '방송에서 "엔비디아가 실적 발표한 날 주가가 올라간 적 있습니까? 그렇지 않았습니다"라고 명확히 말했습니다. 즉, 실적이 좋아도 당일 주가가 오른 경우는 거의 없었다는 것이 핵심입니다.'
  },
  {
    id: 8,
    type: 'ox',
    difficulty: 'normal',
    question: '방송에서는 미국에서 비즈니스(상업용) 전기료가 주거용(가정용)보다 더 비싸다고 설명했다.',
    options: ['O', 'X'],
    answer: 0,
    explanation: '"미국은 가정이 싸고 비즈니스가 비싸요. 한국은 그 반대로 공장에서 쓰는 전기세가 훨씬 싸다"고 설명했습니다.'
  },
  {
    id: 9,
    type: 'short',
    difficulty: 'normal',
    question: '방송에서 제시한 3가지 "매크로 레드라인(나침반 숫자)"을 모두 쓰시오. (예: A%, B달러, C%)',
    options: null,
    answer: ['4.75', '110', '75'],
    answerDisplay: '4.75% / $110 / 75%',
    explanation: '"4.75(10년물 국채금리), 110(브렌트유 배럴당 달러), 75%(엔비디아 매출총이익률) 이 세 가지를 달달 외우라"고 강조했습니다.',
    keywords: ['4.75', '110', '75']
  },
  {
    id: 10,
    type: 'short',
    difficulty: 'hard',
    question: 'PPI가 PCE(개인소비지출 물가)의 선행지표인 이유는? (핵심 단어: 약 몇 개월 후 반영)',
    options: null,
    answer: ['1개월', '2개월'],
    answerDisplay: '약 1~2개월 후 PCE에 반영됨',
    explanation: '"PPI는 PC의 예고편이기도 합니다. 1개월 2개월 후에 이 충격이 오는 것"이라고 언급했습니다. PPI에서 6.0%가 나왔으므로 수개월 내 PCE도 6%에 근접할 수 있다는 경고입니다.',
    keywords: ['1', '2', '개월']
  }
];

let state = { solved: 0, correct: 0 };

function updateScorebar() {
  document.getElementById('sc-solved').textContent = state.solved;
  document.getElementById('sc-correct').textContent = state.correct;
  const pct = state.solved === 0 ? 0 : Math.round(state.correct / state.solved * 100);
  document.getElementById('sc-pct').textContent = pct + '%';
  const fill = document.getElementById('progressFill');
  fill.style.width = (state.solved / QUIZ_DATA.length * 100) + '%';
  if (pct < 40) fill.style.background = '#e11d48';
  else if (pct < 70) fill.style.background = '#f59e0b';
  else fill.style.background = '#16a34a';

  if (state.solved === QUIZ_DATA.length) {
    setTimeout(showModal, 600);
  }
}

function showModal() {
  const pct = Math.round(state.correct / QUIZ_DATA.length * 100);
  let grade, msg;
  if (pct >= 90) { grade = 'A'; msg = '완벽합니다! 시장 분석가 수준이네요 🎉'; }
  else if (pct >= 75) { grade = 'B'; msg = '잘 하셨습니다! 핵심을 잘 파악했어요 👍'; }
  else if (pct >= 60) { grade = 'C'; msg = '무난합니다. 복습으로 더 단단히 다져봐요 📚'; }
  else { grade = 'D'; msg = '아직은 아쉽지만 다시 도전해보세요! 💪'; }
  document.getElementById('modalGrade').textContent = grade;
  document.getElementById('modalScore').textContent = state.correct + ' / ' + QUIZ_DATA.length + '점 (' + pct + '%)';
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalOverlay').classList.add('show');
}

function markResult(isCorrect, card) {
  state.solved++;
  if (isCorrect) state.correct++;
  updateScorebar();
  const badge = document.createElement('div');
  badge.className = 'badge ' + (isCorrect ? 'badge-correct' : 'badge-wrong');
  badge.textContent = isCorrect ? '✓ 정답!' : '✗ 오답';
  card.querySelector('.answer-area').appendChild(badge);
  const exp = card.querySelector('.explanation');
  exp.classList.add('show');
  card.classList.add('answered');
}

function renderQuiz() {
  const list = document.getElementById('quizList');
  list.innerHTML = '';

  QUIZ_DATA.forEach(q => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.id = 'card-' + q.id;

    const diffMap = { easy: ['쉬움', 'diff-easy'], normal: ['보통', 'diff-normal'], hard: ['어려움', 'diff-hard'] };
    const typeMap = { multiple: '객관식', ox: 'O/X', short: '단답형' };
    const [diffLabel, diffClass] = diffMap[q.difficulty];

    let answerHTML = '';
    if (q.type === 'multiple') {
      answerHTML = `<div class="options">` +
        q.options.map((opt, i) =>
          `<button class="opt-btn" data-idx="${i}" onclick="handleMultiple(this, ${q.id}, ${i})">${opt}</button>`
        ).join('') +
        `</div>`;
    } else if (q.type === 'ox') {
      answerHTML = `<div class="ox-wrap">
        <button class="ox-btn" onclick="handleOX(this, ${q.id}, 0)">O</button>
        <button class="ox-btn" onclick="handleOX(this, ${q.id}, 1)">X</button>
      </div>`;
    } else if (q.type === 'short') {
      answerHTML = `<div class="short-wrap">
        <input type="text" class="short-input" id="short-${q.id}" placeholder="답을 입력하세요..." />
        <button class="submit-btn" onclick="handleShort(${q.id})">제출</button>
      </div>`;
    }

    card.innerHTML = `
      <div class="q-meta">
        <span class="q-num">Q${q.id}</span>
        <span class="q-diff ${diffClass}">${diffLabel}</span>
        <span class="q-type">${typeMap[q.type]}</span>
      </div>
      <div class="q-text">${q.question}</div>
      <div class="answer-area">
        ${answerHTML}
      </div>
      <div class="explanation">
        <strong>📖 해설:</strong> ${q.explanation}
        ${q.answerDisplay ? `<br><strong>정답:</strong> ${q.answerDisplay}` : ''}
      </div>
    `;
    list.appendChild(card);
  });
}

function handleMultiple(btn, qId, idx) {
  const q = QUIZ_DATA.find(x => x.id === qId);
  const card = document.getElementById('card-' + qId);
  const btns = card.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.answer;
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) btns[q.answer].classList.add('correct');
  markResult(isCorrect, card);
}

function handleOX(btn, qId, idx) {
  const q = QUIZ_DATA.find(x => x.id === qId);
  const card = document.getElementById('card-' + qId);
  const btns = card.querySelectorAll('.ox-btn');
  btns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.answer;
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) btns[q.answer].classList.add('correct');
  markResult(isCorrect, card);
}

function handleShort(qId) {
  const q = QUIZ_DATA.find(x => x.id === qId);
  const card = document.getElementById('card-' + qId);
  const input = document.getElementById('short-' + qId);
  const submitBtn = card.querySelector('.submit-btn');
  const val = input.value.trim().replace(/\s+/g, '');

  if (!val) return;

  input.disabled = true;
  submitBtn.disabled = true;

  const matched = q.keywords.some(kw => val.includes(kw));
  const ansArr = Array.isArray(q.answer) ? q.answer : [q.answer];
  const exact = ansArr.some(a => val.includes(String(a).replace(/\s/g, '')));
  const isCorrect = exact || matched;

  input.style.borderColor = isCorrect ? '#86efac' : '#fecdd3';
  input.style.background = isCorrect ? '#f0fdf4' : '#fff1f2';
  markResult(isCorrect, card);
}

document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('show');
  state = { solved: 0, correct: 0 };
  updateScorebar();
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderQuiz();
updateScorebar();
</script>
