<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA | PPI 물가 폭등 퀴즈 10문제</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --bg2: #fafafa;
  --text: #1a1a1a;
  --text2: #777777;
  --accent: #e11d48;
  --accent2: #f43f5e;
  --border: #e5e5e5;
  --correct: #16a34a;
  --wrong: #dc2626;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size:15px;
  line-height:1.7;
  max-width:480px;
  margin:0 auto;
  padding-bottom:60px;
}

/* STICKY SCORE BAR */
.score-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--text);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.score-bar .score-title {
  font-size:11px;
  color:#aaa;
  letter-spacing:2px;
  text-transform:uppercase;
  white-space:nowrap;
}
.score-stats {
  display:flex;
  gap:10px;
  flex:1;
  justify-content:flex-end;
  font-size:12px;
  color:#fff;
  font-weight:500;
}
.score-stats span { color:#aaa; }
.score-stats strong { color:#fff; }
.progress-wrap {
  position:absolute;
  bottom:0; left:0; right:0;
  height:3px;
  background:#333;
}
.progress-bar {
  height:3px;
  background: var(--accent);
  transition: width 0.4s ease, background 0.4s ease;
  width:0%;
}

/* HEADER */
.quiz-header {
  padding: 28px 20px 20px;
  border-bottom: 1px solid var(--border);
}
.quiz-header .tag {
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:700;
}
.quiz-header h1 {
  font-family:'Playfair Display',serif;
  font-size:22px;
  font-weight:900;
  margin:8px 0 6px;
  line-height:1.3;
}
.quiz-header p {
  font-size:12px;
  color:var(--text2);
}

/* QUESTION CARD */
.q-card {
  margin:16px 16px 0;
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  transition: border-color 0.3s;
}
.q-card.answered { border-color: var(--border); }

.q-header {
  background:var(--bg2);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--border);
}
.q-num {
  font-family:'Playfair Display',serif;
  font-size:18px;
  font-weight:700;
  color:var(--accent);
  min-width:28px;
}
.q-type {
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:2px;
  background:var(--text);
  color:#fff;
}
.q-diff {
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:2px;
  margin-left:auto;
}
.diff-easy { background:#dcfce7; color:#16a34a; }
.diff-mid  { background:#fef9c3; color:#ca8a04; }
.diff-hard { background:#fee2e2; color:#dc2626; }

.q-body { padding:14px; }
.q-text {
  font-size:14px;
  font-weight:500;
  line-height:1.6;
  margin-bottom:14px;
}

/* OPTION BUTTONS */
.options { display:flex; flex-direction:column; gap:8px; }
.opt-btn {
  width:100%;
  text-align:left;
  padding:10px 13px;
  border:1.5px solid var(--border);
  border-radius:4px;
  background:#fff;
  font-size:13px;
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  transition: all 0.2s;
  color: var(--text);
  line-height:1.5;
}
.opt-btn:hover:not(:disabled) { border-color:var(--accent); background:#fff5f7; }
.opt-btn:disabled { cursor:default; }
.opt-btn.correct {
  background:#dcfce7;
  border-color:#16a34a;
  color:#15803d;
  font-weight:700;
}
.opt-btn.wrong {
  background:#fee2e2;
  border-color:#dc2626;
  color:#dc2626;
}
.opt-badge {
  float:right;
  font-size:11px;
  font-weight:700;
  margin-left:8px;
}

/* SHORT ANSWER */
.sa-wrap { display:flex; gap:8px; margin-top:4px; }
.sa-input {
  flex:1;
  padding:9px 12px;
  border:1.5px solid var(--border);
  border-radius:4px;
  font-size:13px;
  font-family:'Noto Sans KR',sans-serif;
  outline:none;
  transition:border-color 0.2s;
}
.sa-input:focus { border-color:var(--accent); }
.sa-input:disabled { background:#f5f5f5; color:#999; }
.sa-submit {
  padding:9px 16px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:13px;
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  font-weight:700;
  white-space:nowrap;
  transition:background 0.2s;
}
.sa-submit:hover:not(:disabled) { background:var(--accent2); }
.sa-submit:disabled { background:#ccc; cursor:default; }
.sa-result {
  margin-top:8px;
  font-size:13px;
  font-weight:700;
  display:none;
}
.sa-result.correct { color:#16a34a; }
.sa-result.wrong { color:#dc2626; }

/* OX BUTTONS */
.ox-wrap { display:flex; gap:12px; margin-top:4px; }
.ox-btn {
  flex:1;
  padding:14px;
  border:1.5px solid var(--border);
  border-radius:4px;
  background:#fff;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
  transition:all 0.2s;
  font-family:'Playfair Display',serif;
  color:var(--text2);
}
.ox-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
.ox-btn:disabled { cursor:default; }
.ox-btn.correct { background:#dcfce7; border-color:#16a34a; color:#16a34a; }
.ox-btn.wrong   { background:#fee2e2; border-color:#dc2626; color:#dc2626; }

/* EXPLANATION */
.explanation {
  display:none;
  margin-top:12px;
  padding:12px;
  background:#fff9f0;
  border-left:3px solid #f59e0b;
  border-radius:0 4px 4px 0;
  font-size:13px;
  line-height:1.7;
}
.explanation .exp-label {
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#d97706;
  margin-bottom:6px;
}
.explanation .exp-answer {
  font-weight:700;
  color:var(--text);
  margin-bottom:4px;
}
.explanation .exp-reason { color:#555; }

/* MODAL */
.modal-overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.show { display:flex; }
.modal-card {
  background:#fff;
  border-radius:8px;
  padding:30px 24px;
  text-align:center;
  max-width:340px;
  width:100%;
  animation: popIn 0.3s ease;
}
@keyframes popIn {
  from { transform:scale(0.85); opacity:0; }
  to   { transform:scale(1);    opacity:1; }
}
.modal-card .modal-icon { font-size:48px; margin-bottom:12px; }
.modal-card h2 {
  font-family:'Playfair Display',serif;
  font-size:22px;
  font-weight:900;
  margin-bottom:6px;
}
.modal-card .modal-score {
  font-size:36px;
  font-family:'Playfair Display',serif;
  font-weight:700;
  color:var(--accent);
  margin:10px 0;
}
.modal-card .modal-grade {
  font-size:14px;
  color:var(--text2);
  margin-bottom:16px;
}
.modal-card .modal-msg {
  font-size:13px;
  line-height:1.6;
  color:var(--text);
  margin-bottom:20px;
}
.btn-retry {
  width:100%;
  padding:12px;
  background:var(--text);
  color:#fff;
  border:none;
  border-radius:4px;
  font-size:14px;
  font-family:'Noto Sans KR',sans-serif;
  font-weight:700;
  cursor:pointer;
  letter-spacing:1px;
}
.btn-retry:hover { background:var(--accent); }
</style>
</head>

    explanation: {
      correct: '✅ 정답: X (거짓)',
      reason: '"아직 지금 비만약이 하나 나왔어요...아직 승인받지 않은 비만약인데 이미 틱톡이나 이런 데서 지금 난리도 아니래요"라고 방송에서 말했습니다. 임상실험 중인 미승인 의약품임에도 블랙마켓이 형성될 정도로 수요가 폭발적이라고 소개됐습니다.'
    }
  }
];

// State
let state = { solved: 0, correct: 0 };

function updateScoreBar() {
  document.getElementById('sbSolved').textContent = state.solved;
  document.getElementById('sbCorrect').textContent = state.correct;
  const rate = state.solved === 0 ? 0 : Math.round((state.correct / state.solved) * 100);
  document.getElementById('sbRate').textContent = rate + '%';
  const bar = document.getElementById('progressBar');
  bar.style.width = (state.solved / QUIZ_DATA.length * 100) + '%';
  if (rate >= 70) bar.style.background = '#16a34a';
  else if (rate >= 40) bar.style.background = '#f59e0b';
  else bar.style.background = '#e11d48';

  if (state.solved === QUIZ_DATA.length) {
    setTimeout(showModal, 600);
  }
}

function onAnswer(isCorrect) {
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreBar();
}

function showModal() {
  const rate = Math.round((state.correct / QUIZ_DATA.length) * 100);
  let grade, icon, msg;
  if (rate >= 90) { grade='A+'; icon='🏆'; msg='완벽합니다! 방송 내용을 완전히 숙지하셨네요. 실전 투자에도 바로 활용 가능한 수준입니다.'; }
  else if (rate >= 80) { grade='A';  icon='🎉'; msg='훌륭합니다! AI 디커플링 시장과 인플레이션 국면을 잘 이해하고 있습니다.'; }
  else if (rate >= 70) { grade='B';  icon='👍'; msg='좋습니다! 핵심 개념은 잡았지만 세부 수치를 한 번 더 확인해보세요.'; }
  else if (rate >= 60) { grade='C';  icon='📚'; msg='방송을 다시 한 번 돌려보며 PPI·금리 수치와 종목 이유를 정리해보세요.'; }
  else               { grade='D';  icon='💪'; msg='괜찮습니다! 분석 리포트를 먼저 꼼꼼히 읽고 다시 도전해보세요.'; }

  document.getElementById('modalIcon').textContent = icon;
  document.getElementById('modalScore').textContent = state.correct + ' / ' + QUIZ_DATA.length;
  document.getElementById('modalGrade').textContent = '등급: ' + grade + ' (' + rate + '%)';
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('finalModal').classList.add('show');
}

function retryAll() {
  state = { solved: 0, correct: 0 };
  document.getElementById('finalModal').classList.remove('show');
  updateScoreBar();
  renderQuiz();
}

// RENDER
function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  QUIZ_DATA.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + q.id;

    const diffLabel = {easy:'쉬움',mid:'보통',hard:'어려움'}[q.difficulty];
    const diffClass = {easy:'diff-easy',mid:'diff-mid',hard:'diff-hard'}[q.difficulty];
    const typeLabel = {mcq:'객관식',short:'단답형',ox:'OX'}[q.type];

    let bodyHTML = `<div class="q-text">${q.question}</div>`;

    if (q.type === 'mcq') {
      bodyHTML += `<div class="options" id="opts-${q.id}">`;
      q.options.forEach((opt, i) => {
        bodyHTML += `<button class="opt-btn" data-q="${q.id}" data-i="${i}" onclick="checkMCQ(${q.id},${i})">${opt}</button>`;
      });
      bodyHTML += `</div>`;
    } else if (q.type === 'short') {
      bodyHTML += `
        <div class="sa-wrap">
          <input type="text" id="sa-${q.id}" class="sa-input" placeholder="정답을 입력하세요..." autocomplete="off">
          <button class="sa-submit" id="saBtn-${q.id}" onclick="checkSA(${q.id})">제출</button>
        </div>
        <div class="sa-result" id="saRes-${q.id}"></div>`;
    } else if (q.type === 'ox') {
      bodyHTML += `
        <div class="ox-wrap" id="ox-${q.id}">
          <button class="ox-btn" data-q="${q.id}" data-v="O" onclick="checkOX(${q.id},'O')">O</button>
          <button class="ox-btn" data-q="${q.id}" data-v="X" onclick="checkOX(${q.id},'X')">X</button>
        </div>`;
    }

    bodyHTML += `
      <div class="explanation" id="exp-${q.id}">
        <div class="exp-label">📖 해설</div>
        <div class="exp-answer">${''}</div>
        <div class="exp-reason">${''}</div>
      </div>`;

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">Q${idx+1}</div>
        <div class="q-type">${typeLabel}</div>
        <div class="q-diff ${diffClass}">${diffLabel}</div>
      </div>
      <div class="q-body">${bodyHTML}</div>`;
    container.appendChild(card);
  });
}

function showExplanation(qid, isCorrect) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const expDiv = document.getElementById('exp-' + qid);
  expDiv.querySelector('.exp-answer').textContent = q.explanation.correct;
  expDiv.querySelector('.exp-reason').textContent = q.explanation.reason;
  expDiv.style.display = 'block';
  onAnswer(isCorrect);
}

function checkMCQ(qid, selected) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const btns = document.querySelectorAll(`[data-q="${qid}"]`);
  btns.forEach(btn => btn.disabled = true);
  const isCorrect = (selected === q.answer);
  btns[selected].classList.add(isCorrect ? 'correct' : 'wrong');
  btns[selected].innerHTML += `<span class="opt-badge">${isCorrect ? '✓ 정답!' : '✗ 오답'}</span>`;
  if (!isCorrect) {
    btns[q.answer].classList.add('correct');
    btns[q.answer].innerHTML += `<span class="opt-badge">✓ 정답</span>`;
  }
  showExplanation(qid, isCorrect);
}

function checkSA(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const input = document.getElementById('sa-' + qid);
  const btn = document.getElementById('saBtn-' + qid);
  const res = document.getElementById('saRes-' + qid);
  const val = input.value.trim().toLowerCase().replace(/\s/g,'');
  if (!val) return;

  const correct = q.answer.toLowerCase().replace(/\s/g,'');
  const aliases = (q.aliases || []).map(a => a.toLowerCase().replace(/\s/g,''));
  const isCorrect = val === correct || aliases.includes(val);

  input.disabled = true;
  btn.disabled = true;
  res.style.display = 'block';
  res.textContent = isCorrect ? '✓ 정답입니다!' : `✗ 오답. 정답: ${q.answer}`;
  res.className = 'sa-result ' + (isCorrect ? 'correct' : 'wrong');
  showExplanation(qid, isCorrect);
}

function checkOX(qid, val) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const btns = document.querySelectorAll(`#ox-${qid} .ox-btn`);
  btns.forEach(btn => btn.disabled = true);
  const isCorrect = (val === q.answer);
  btns.forEach(btn => {
    if (btn.dataset.v === val) btn.classList.add(isCorrect ? 'correct' : 'wrong');
    if (!isCorrect && btn.dataset.v === q.answer) btn.classList.add('correct');
  });
  showExplanation(qid, isCorrect);
}

// Allow Enter key for short answer
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.classList.contains('sa-input')) {
    const id = parseInt(document.activeElement.id.replace('sa-',''));
    checkSA(id);
  }
});

// INIT
renderQuiz();
updateScoreBar();
</script>
</body>
</html>
