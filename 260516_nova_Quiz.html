<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Real Invest — 시험문제 10선</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --bg2: #fafafa; --text: #1a1a1a; --text2: #777777;
  --red: #e11d48; --red2: #f43f5e; --border: #e5e5e5;
  --green: #16a34a; --green-bg: #dcfce7; --red-bg: #fee2e2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.7; }

/* STICKY SCORE BAR */
.score-bar {
  position: sticky; top: 0; z-index: 100;
  background: var(--text); color: #fff;
  padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  border-bottom: 2px solid var(--red);
}
.score-bar .brand { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--red2); flex-shrink: 0; }
.score-nums { display: flex; gap: 12px; font-size: 12px; flex: 1; flex-wrap: wrap; }
.score-nums span { color: #bbb; }
.score-nums strong { color: #fff; }
.progress-wrap { flex: 1; min-width: 100px; background: #333; height: 6px; border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; width: 0%; transition: width 0.4s ease, background 0.4s ease; background: var(--red); }

/* HEADER */
.quiz-header { background: var(--text); color: #fff; padding: 36px 20px; text-align: center; }
.quiz-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(22px, 6vw, 36px); margin-bottom: 8px; }
.quiz-header h1 span { color: var(--red2); }
.quiz-header p { color: #aaa; font-size: 13px; }

/* CONTENT */
.content { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }

/* QUIZ CARD */
.quiz-card {
  border: 1px solid var(--border); margin-bottom: 20px;
  background: var(--bg); overflow: hidden;
}
.qc-head {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 12px;
}
.qc-num {
  flex-shrink: 0;
  background: var(--red); color: #fff;
  font-family: 'Playfair Display', serif;
  font-size: 16px; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
}
.qc-meta { display: flex; flex-direction: column; flex: 1; }
.qc-badges { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; letter-spacing: 0.5px;
}
.badge-type { background: #f3f4f6; color: #374151; }
.badge-easy { background: #dcfce7; color: #15803d; }
.badge-med { background: #fef9c3; color: #854d0e; }
.badge-hard { background: #fee2e2; color: #b91c1c; }
.qc-question { font-size: 15px; font-weight: 500; line-height: 1.6; }

/* OPTIONS */
.qc-options { padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.opt-btn {
  width: 100%; text-align: left; padding: 10px 14px;
  border: 1px solid var(--border); background: var(--bg2);
  cursor: pointer; font-size: 13px; font-family: 'Noto Sans KR', sans-serif;
  color: var(--text); border-radius: 2px;
  transition: background 0.15s ease, border-color 0.15s ease;
  display: flex; align-items: center; gap: 8px;
  -webkit-tap-highlight-color: transparent;
}
.opt-btn:hover:not([disabled]) { background: #fff0f3; border-color: var(--red); }
.opt-btn.correct { background: var(--green-bg) !important; border-color: var(--green) !important; color: #14532d !important; font-weight: 600; }
.opt-btn.wrong { background: var(--red-bg) !important; border-color: var(--red) !important; color: #7f1d1d !important; }
.opt-btn[disabled] { cursor: default; }
.opt-badge { font-size: 11px; font-weight: 700; margin-left: auto; flex-shrink: 0; }

/* SHORT ANSWER */
.short-wrap { padding: 14px 18px; display: flex; gap: 8px; }
.short-wrap input {
  flex: 1; border: 1px solid var(--border); padding: 9px 12px;
  font-size: 13px; font-family: 'Noto Sans KR', sans-serif; color: var(--text);
  background: var(--bg2); outline: none;
}
.short-wrap input:focus { border-color: var(--red); }
.short-wrap input[disabled] { background: #f9f9f9; color: #aaa; }
.submit-btn {
  background: var(--red); color: #fff; border: none;
  padding: 9px 16px; cursor: pointer; font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 600; flex-shrink: 0;
}
.submit-btn:hover { background: var(--red2); }
.submit-btn[disabled] { background: #ccc; cursor: default; }

/* OX */
.ox-wrap { padding: 14px 18px; display: flex; gap: 10px; }
.ox-btn {
  flex: 1; padding: 14px; border: 1px solid var(--border);
  background: var(--bg2); cursor: pointer; font-size: 22px;
  font-family: 'Playfair Display', serif; text-align: center;
  transition: background 0.15s; border-radius: 2px;
  -webkit-tap-highlight-color: transparent;
}
.ox-btn:hover:not([disabled]) { background: #fff0f3; border-color: var(--red); }
.ox-btn.correct { background: var(--green-bg) !important; border-color: var(--green) !important; }
.ox-btn.wrong { background: var(--red-bg) !important; border-color: var(--red) !important; }
.ox-btn[disabled] { cursor: default; }

/* EXPLANATION */
.explanation {
  max-height: 0; overflow: hidden;
  transition: max-height 0.5s ease, padding 0.3s ease;
  background: #f8f9fa; border-top: 1px solid var(--border);
  font-size: 13px; color: var(--text2); line-height: 1.7;
}
.explanation.open { max-height: 600px; padding: 14px 18px; }
.explanation strong { color: var(--text); }
.expl-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--red); text-transform: uppercase; margin-bottom: 6px; }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); z-index: 200;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg); max-width: 380px; width: 100%;
  padding: 32px 24px; text-align: center; position: relative;
}
.modal h2 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 8px; }
.modal .grade { font-size: 64px; line-height: 1; margin: 16px 0; }
.modal .score-txt { font-size: 18px; font-weight: 700; color: var(--red); margin-bottom: 8px; }
.modal .msg { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
.modal .restart-btn {
  background: var(--red); color: #fff; border: none;
  padding: 12px 32px; font-size: 14px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 600;
}
.modal .restart-btn:hover { background: var(--red2); }
</style>
</head>
<body>

<!-- STICKY SCORE BAR -->
<div class="score-bar">
  <div class="brand">NOVA Quiz</div>
  <div class="score-nums">
    <span>푼 문제 <strong id="sSolved">0</strong> / 10</span>
    <span>맞힌 문제 <strong id="sCorrect">0</strong></span>
    <span>정답률 <strong id="sRate">0%</strong></span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<!-- HEADER -->
<div class="quiz-header">
  <h1>나스닥 폭락 <span>시험문제</span></h1>
  <p>NOVA Real Invest 2026.05.15 방송 내용 기반 · 10문제</p>
</div>

<div class="content" id="quizContainer"></div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>최종 결과</h2>
    <div class="grade" id="gradeEmoji">🏆</div>
    <div class="score-txt" id="scoreText"></div>
    <div class="msg" id="scoreMsg"></div>
    <button class="restart-btn" onclick="restartQuiz()">↺ 다시 풀기</button>
  </div>
</div>

  },

    options: [

    id: 8, type: 'ox', difficulty: 'easy',
    question: '방송에서 "5월 20일 엔비디아 실적 발표"가 올해 하반기 주식시장 방향을 결정지을 중요한 이벤트라고 언급되었다.',

  },
  {
    id: 9, type: 'mc', difficulty: 'hard',
    question: '테슬라(TSLA)의 재무 위험 요소로 방송에서 언급된 내용 중 올바르지 않은 것은?',
    options: [
      '풀 셀프 드라이빙(FSD) 관련 이연 수익(Deferred Revenue) 처리 의혹',
      '일론 머스크 보상 패키지로 약 8% 주식 희석 예정',
      '로보택시 이벤트를 새 일정 없이 취소(사실상 연기)',
      '중국 공장 가동 중단으로 인한 매출 급감'
    ],
    answer: 3,
    explanation: '방송에서 중국 공장 가동 중단은 언급되지 않음. 언급된 위험은 FSD 이연수익 회계처리, 8% 주식 희석, 로보택시 이벤트 무기한 연기(날짜 없는 연기).'
  },
  {
    id: 10, type: 'ox', difficulty: 'med',
    question: '방송에 따르면, 인텔(INTC)의 서버 CPU 시장 점유율이 AMD에 의해 잠식되어 현재 60% 이상을 유지하고 있다.',
    answer: false,
    explanation: '"지금 CPU 점유율이 54.9%로 떨어졌어요. 그 전에는 거의 한 60% 이상 됐었습니다. 그런데 54.9%로 떨어졌어요. 즉 AMD가 먹고 들어간 거죠." — 54.9%로 하락, 60% 이하.'
  }
];

let state = { solved: 0, correct: 0 };

function updateScoreBar() {
  document.getElementById('sSolved').textContent = state.solved;
  document.getElementById('sCorrect').textContent = state.correct;
  const rate = state.solved > 0 ? Math.round(state.correct / state.solved * 100) : 0;
  document.getElementById('sRate').textContent = rate + '%';
  const bar = document.getElementById('progressBar');
  bar.style.width = (state.solved / QUIZ_DATA.length * 100) + '%';
  bar.style.background = rate < 40 ? '#e11d48' : rate < 70 ? '#f59e0b' : '#16a34a';
}

function showExplanation(id) {
  const el = document.getElementById('expl-' + id);
  if (el) { el.classList.add('open'); }
}

function markAnswer(id, isCorrect) {
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreBar();
  showExplanation(id);
  if (state.solved === QUIZ_DATA.length) setTimeout(showModal, 600);
}

function renderMC(q) {
  const opts = q.options.map((o, i) =>
    `<button class="opt-btn" id="opt-${q.id}-${i}" onclick="chooseMC(${q.id},${i})">${i+1}. ${o}</button>`
  ).join('');
  return `<div class="qc-options">${opts}</div>`;
}

function chooseMC(qid, chosen) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const isCorrect = chosen === q.answer;
  q.options.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qid}-${i}`);
    btn.disabled = true;
    if (i === q.answer) {
      btn.classList.add('correct');
      btn.innerHTML += '<span class="opt-badge">✓ 정답</span>';
    } else if (i === chosen && !isCorrect) {
      btn.classList.add('wrong');
      btn.innerHTML += '<span class="opt-badge">✗ 오답</span>';
    }
  });
  markAnswer(qid, isCorrect);
}

function renderShort(q) {
  return `<div class="short-wrap">
    <input type="text" id="short-${q.id}" placeholder="답을 입력하세요..." maxlength="30">
    <button class="submit-btn" id="shortsub-${q.id}" onclick="submitShort(${q.id})">제출</button>
  </div>`;
}

function submitShort(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const input = document.getElementById(`short-${qid}`);
  const val = input.value.trim().toLowerCase().replace(/\s/g,'');
  const isCorrect = q.keywords.some(k => val.includes(k.toLowerCase().replace(/\s/g,'')));

  input.disabled = true;
  document.getElementById(`shortsub-${qid}`).disabled = true;
  input.style.border = isCorrect ? '1px solid #16a34a' : '1px solid #e11d48';
  input.style.background = isCorrect ? '#dcfce7' : '#fee2e2';

  const result = document.createElement('div');
  result.style.cssText = 'padding:6px 18px; font-size:13px; font-weight:700;';
  result.style.color = isCorrect ? '#15803d' : '#b91c1c';
  result.textContent = isCorrect ? `✓ 정답! 정답: ${q.answer}` : `✗ 오답. 정답: ${q.answer}`;
  input.closest('.short-wrap').after(result);

  markAnswer(qid, isCorrect);
}

function renderOX(q) {
  return `<div class="ox-wrap">
    <button class="ox-btn" id="ox-${q.id}-true" onclick="chooseOX(${q.id}, true)">O</button>
    <button class="ox-btn" id="ox-${q.id}-false" onclick="chooseOX(${q.id}, false)">X</button>
  </div>`;
}

function chooseOX(qid, chosen) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const isCorrect = chosen === q.answer;
  ['true','false'].forEach(v => {
    const btn = document.getElementById(`ox-${qid}-${v}`);
    btn.disabled = true;
    if (v === String(q.answer)) btn.classList.add('correct');
    else if (v === String(chosen) && !isCorrect) btn.classList.add('wrong');
  });
  markAnswer(qid, isCorrect);
}

function diffClass(d) { return d === 'easy' ? 'badge-easy' : d === 'med' ? 'badge-med' : 'badge-hard'; }
function diffLabel(d) { return d === 'easy' ? '쉬움' : d === 'med' ? '보통' : '어려움'; }
function typeLabel(t) { return t === 'mc' ? '객관식' : t === 'short' ? '단답형' : 'O / X'; }

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUIZ_DATA.forEach(q => {
    let bodyHtml = '';
    if (q.type === 'mc') bodyHtml = renderMC(q);
    else if (q.type === 'short') bodyHtml = renderShort(q);
    else bodyHtml = renderOX(q);

    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.innerHTML = `
      <div class="qc-head">
        <div class="qc-num">${q.id}</div>
        <div class="qc-meta">
          <div class="qc-badges">
            <span class="badge badge-type">${typeLabel(q.type)}</span>
            <span class="badge ${diffClass(q.difficulty)}">${diffLabel(q.difficulty)}</span>
          </div>
          <div class="qc-question">${q.question}</div>
        </div>
      </div>
      ${bodyHtml}
      <div class="explanation" id="expl-${q.id}">
        <div class="expl-label">📖 해설</div>
        ${q.explanation}
      </div>`;
    container.appendChild(card);
  });
}

function showModal() {
  const pct = Math.round(state.correct / QUIZ_DATA.length * 100);
  let grade, emoji, msg;
  if (pct >= 90) { grade = 'A'; emoji = '🏆'; msg = '완벽합니다! NOVA 레벨 투자자입니다.'; }
  else if (pct >= 70) { grade = 'B'; emoji = '🥈'; msg = '훌륭합니다! 핵심 내용을 잘 이해했습니다.'; }
  else if (pct >= 50) { grade = 'C'; emoji = '🥉'; msg = '양호합니다. 해설을 다시 한 번 읽어보세요.'; }
  else { grade = 'D'; emoji = '📚'; msg = '방송 내용을 다시 복습해 보세요!'; }

  document.getElementById('gradeEmoji').textContent = emoji;
  document.getElementById('scoreText').textContent = `${state.correct} / ${QUIZ_DATA.length} 정답 · ${pct}점 (등급 ${grade})`;
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('modalOverlay').classList.add('open');
}

function restartQuiz() {
  state = { solved: 0, correct: 0 };
  updateScoreBar();
  document.getElementById('modalOverlay').classList.remove('open');
  buildQuiz();
}

buildQuiz();
updateScoreBar();
</script>
</body>
</html>
