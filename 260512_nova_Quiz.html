    explanation: '방송에서 "코어 CPI가 2.7로 꽁쭉 올라갈 수 있는데, 컨센서스를 상회해 2.8 정도 나온다면 앞으로 당분간 금리 인하에 대한 얘기는 쏙 들어가게 될 것"이라고 했습니다. 금리인하 기대 소멸은 기술주·성장주에 직격탄이 됩니다.'
  },
  {
    id: 10,
    type: 'short',
    difficulty: 'hard',
    question: '방송에서 5월 하순의 세 가지 빅이벤트(CPI, 트럼프 방중, 엔비디아 실적) 결과가 결정짓는다고 한 기간은 언제인가요? (예: "2026년 X분기" 형태로 답하세요)',
    answer: '2026년 하반기',
    altAnswers: ['하반기', '2026 하반기', '올해 하반기'],
    explanation: '방송에서 "5월 하순이 움직이는 이것들이 전체 2026년 하반기를 결정짓는 방향타 역할을 할 것"이라고 했습니다. 즉 이번 5월 이벤트들이 하반기 투자 방향의 분기점이라는 의미입니다.'
  }
];

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let state = { solved: 0, correct: 0 };

function updateScorebar() {
  document.getElementById('solvedCount').textContent = state.solved;
  document.getElementById('correctCount').textContent = state.correct;
  const rate = state.solved > 0 ? Math.round((state.correct / state.solved) * 100) : 0;
  document.getElementById('rateLabel').textContent = rate + '%';
  const bar = document.getElementById('progressBar');
  bar.style.width = (state.solved / 10 * 100) + '%';
  if (rate < 40) bar.style.background = '#e11d48';
  else if (rate < 70) bar.style.background = '#d97706';
  else bar.style.background = '#16a34a';
  if (state.solved === 10) showFinalModal();
}

function gradeResult(correct, total) {
  const pct = correct / total;
  if (pct >= 0.9) return { grade: 'A', emoji: '🏆', msg: '완벽합니다! 방송 내용을 완전히 이해하셨군요. 노바픽 수준의 통찰력입니다.' };
  if (pct >= 0.7) return { grade: 'B', emoji: '🥈', msg: '훌륭해요! 핵심 내용을 잘 파악하셨습니다. 한 번 더 복습하면 A입니다.' };
  if (pct >= 0.5) return { grade: 'C', emoji: '📚', msg: '절반 이상 맞히셨네요. 분석 리포트를 한 번 더 정독해보세요.' };
  return { grade: 'D', emoji: '💪', msg: '방송 내용을 다시 들어보시고, 리포트를 천천히 읽어보세요. 다음엔 더 잘하실 수 있어요!' };
}

function showFinalModal() {
  const r = gradeResult(state.correct, 10);
  document.getElementById('modalEmoji').textContent = r.emoji;
  document.getElementById('modalScore').textContent = state.correct + ' / 10';
  document.getElementById('modalGrade').textContent = '등급: ' + r.grade;
  document.getElementById('modalMsg').textContent = r.msg;
  const modal = document.getElementById('finalModal');
  modal.classList.add('show');
}

function retryQuiz() {
  state = { solved: 0, correct: 0 };
  updateScorebar();
  document.getElementById('finalModal').classList.remove('show');
  renderQuiz();
}

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function diffLabel(d) {
  if (d === 'easy') return '<span class="q-difficulty diff-easy">쉬움</span>';
  if (d === 'medium') return '<span class="q-difficulty diff-medium">보통</span>';
  return '<span class="q-difficulty diff-hard">어려움</span>';
}
function typeLabel(t) {
  if (t === 'mcq') return '<span class="q-type">객관식</span>';
  if (t === 'ox') return '<span class="q-type">OX</span>';
  return '<span class="q-type">단답형</span>';
}

function renderMCQ(q) {
  const opts = q.options.map((opt, i) =>
    `<button class="opt-btn" onclick="checkMCQ(${q.id},${i})" id="opt-${q.id}-${i}">${String.fromCharCode(9312+i)} ${opt}</button>`
  ).join('');
  return `<div class="options">${opts}</div>`;
}

function renderOX(q) {
  return `<div class="ox-row">
    <button class="ox-btn" onclick="checkOX(${q.id},'O')" id="ox-${q.id}-O">⭕ O</button>
    <button class="ox-btn" onclick="checkOX(${q.id},'X')" id="ox-${q.id}-X">❌ X</button>
  </div>`;
}

function renderShort(q) {
  return `<div class="sa-row">
    <input type="text" class="sa-input" id="sa-${q.id}" placeholder="답을 입력하세요..." onkeydown="if(event.key==='Enter')checkShort(${q.id})">
    <button class="submit-btn" id="sa-btn-${q.id}" onclick="checkShort(${q.id})">제출</button>
  </div>`;
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = QUIZ_DATA.map(q => {
    let body = '';
    if (q.type === 'mcq') body = renderMCQ(q);
    else if (q.type === 'ox') body = renderOX(q);
    else body = renderShort(q);
    return `<div class="q-card" id="qcard-${q.id}">
      <div class="q-header">
        <div class="q-num">${q.id}</div>
        ${diffLabel(q.difficulty)}
        ${typeLabel(q.type)}
      </div>
      <div class="q-text">${q.question}</div>
      ${body}
      <div class="explanation" id="exp-${q.id}"></div>
    </div>`;
  }).join('');
}

// ─────────────────────────────────────────
// GRADING
// ─────────────────────────────────────────
function showExplanation(q, isCorrect) {
  const exp = document.getElementById(`exp-${q.id}`);
  let answerLine = '';
  if (q.type === 'mcq') answerLine = `<span class="correct-ans">✅ 정답: ${String.fromCharCode(9312+q.answer)} ${q.options[q.answer]}</span>`;
  else if (q.type === 'ox') answerLine = `<span class="correct-ans">✅ 정답: ${q.answer}</span>`;
  else answerLine = `<span class="correct-ans">✅ 정답 예시: ${q.answer}</span>`;
  exp.innerHTML = answerLine + q.explanation;
  exp.classList.add('show');
}

function checkMCQ(qid, chosen) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const isCorrect = chosen === q.answer;
  // disable all opts
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${qid}-${i}`);
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === chosen && !isCorrect) btn.classList.add('wrong');
  }
  state.solved++;
  if (isCorrect) state.correct++;
  updateScorebar();
  showExplanation(q, isCorrect);
}

function checkOX(qid, chosen) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const isCorrect = chosen === q.answer;
  ['O','X'].forEach(v => {
    const btn = document.getElementById(`ox-${qid}-${v}`);
    btn.disabled = true;
    if (v === q.answer) btn.classList.add('correct');
    else if (v === chosen && !isCorrect) btn.classList.add('wrong');
  });
  state.solved++;
  if (isCorrect) state.correct++;
  updateScorebar();
  showExplanation(q, isCorrect);
}

function checkShort(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const input = document.getElementById(`sa-${qid}`);
  const btn = document.getElementById(`sa-btn-${qid}`);
  const raw = input.value.trim();
  if (!raw) return;
  const allAnswers = [q.answer, ...(q.altAnswers || [])].map(a => a.replace(/\s/g,'').toLowerCase());
  const userAns = raw.replace(/\s/g,'').toLowerCase();
  const isCorrect = allAnswers.some(a => userAns.includes(a) || a.includes(userAns));
  input.disabled = true;
  btn.disabled = true;
  input.classList.add(isCorrect ? 'correct' : 'wrong');
  state.solved++;
  if (isCorrect) state.correct++;
  updateScorebar();
  showExplanation(q, isCorrect);
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
renderQuiz();
</script>
</body>
</html>
