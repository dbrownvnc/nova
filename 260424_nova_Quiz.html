    ref: '자막: "제가 계속 말씀드리지만 딱따구리 딱따구리를 여러분이 기억하시면 됩니다."'
  },
  {
    id: 10,
    type: 'short',
    difficulty: 'hard',
    question: '방송에서 다음 주(4월 29~30일)를 "수목주목"이라고 강조한 이유를 핵심 발표 2개로 서술하세요.',
    answer: 'FOMC(연준회의), PCE 또는 GDP',
    acceptList: ['fomc', '연준', 'pce', 'gdp', '연준회의', '물가'],
    explanation: '4월 29일(수) FOMC 연준 회의, 4월 30일(목) PCE(개인소비지출 물가지수) + 2분기 GDP 어드밴스드(1차 추정치)가 동시에 발표됩니다. 인플레이션과 성장률 데이터가 한꺼번에 쏟아지는 빅이벤트입니다.',
    ref: '자막: "다음주 수요일날 연준회의가 있어요... 목요일날 PCE가 나옵니다. GDP도 나오고요."'
  }
];

let state = { solved: 0, correct: 0 };

function getDiffBadge(d) {
  if (d === 'easy') return '<span class="badge badge-easy">쉬움</span>';
  if (d === 'med') return '<span class="badge badge-med">보통</span>';
  return '<span class="badge badge-hard">어려움</span>';
}
function getTypeBadge(t) {
  if (t === 'mc') return '<span class="badge badge-type">객관식</span>';
  if (t === 'ox') return '<span class="badge badge-type">OX</span>';
  return '<span class="badge badge-type">단답형</span>';
}

function renderQuiz() {
  const wrap = document.getElementById('quizArea');
  wrap.innerHTML = '';
  QUIZ_DATA.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.id = 'card-' + q.id;

    let optionsHTML = '';
    if (q.type === 'mc') {
      optionsHTML = '<div class="options">' +
        q.options.map((opt, i) =>
          `<button class="opt-btn" id="opt-${q.id}-${i}" onclick="checkMC(${q.id}, ${i})">${opt}</button>`
        ).join('') + '</div>';
    } else if (q.type === 'ox') {
      optionsHTML = '<div class="ox-wrap">' +
        `<button class="ox-btn" id="ox-${q.id}-0" onclick="checkOX(${q.id}, 0)">⭕</button>` +
        `<button class="ox-btn" id="ox-${q.id}-1" onclick="checkOX(${q.id}, 1)">❌</button>` +
        '</div>';
    } else {
      optionsHTML = `<div class="sa-wrap">
        <input type="text" class="sa-input" id="sa-${q.id}" placeholder="정답 입력...">
        <button class="submit-btn" id="sabtn-${q.id}" onclick="checkSA(${q.id})">제출</button>
      </div>`;
    }

    card.innerHTML = `
      <div class="card-header">
        <span class="q-num">Q${idx + 1}</span>
        ${getDiffBadge(q.difficulty)}
        ${getTypeBadge(q.type)}
      </div>
      <div class="q-text">${q.question}</div>
      ${optionsHTML}
      <div class="feedback-badge" id="fb-${q.id}" style="display:none;"></div>
      <div class="explanation" id="expl-${q.id}">
        <div class="expl-title">✍️ 해설</div>
        <div class="expl-body">${q.explanation}</div>
        <div class="expl-ref">📌 근거: ${q.ref}</div>
      </div>
    `;
    wrap.appendChild(card);
  });
}

function showFeedback(qId, isCorrect) {
  const fb = document.getElementById('fb-' + qId);
  fb.style.display = 'inline-block';
  fb.className = 'feedback-badge ' + (isCorrect ? 'fb-correct' : 'fb-wrong');
  fb.textContent = isCorrect ? '✓ 정답!' : '✗ 오답';
  document.getElementById('expl-' + qId).classList.add('show');
}

function updateScore(isCorrect) {
  state.solved++;
  if (isCorrect) state.correct++;
  document.getElementById('sb-solved').textContent = state.solved + ' / 10';
  document.getElementById('sb-correct').textContent = state.correct;
  const rate = state.solved > 0 ? Math.round(state.correct / state.solved * 100) : 0;
  const bar = document.getElementById('progressBar');
  bar.style.width = rate + '%';
  bar.style.background = rate < 40 ? '#e11d48' : rate < 70 ? '#f59e0b' : '#16a34a';
  document.getElementById('progressLabel').textContent = '정답률 ' + rate + '%';
  if (state.solved === 10) setTimeout(showModal, 600);
}

function checkMC(qId, selected) {
  const q = QUIZ_DATA.find(q => q.id === qId);
  const isCorrect = selected === q.answer;
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById('opt-' + qId + '-' + i);
    btn.disabled = true;
    if (i === q.answer) btn.classList.add(isCorrect ? 'correct' : 'reveal');
    else if (i === selected && !isCorrect) btn.classList.add('wrong');
  }
  showFeedback(qId, isCorrect);
  updateScore(isCorrect);
}

function checkOX(qId, selected) {
  const q = QUIZ_DATA.find(q => q.id === qId);
  const isCorrect = selected === q.answer;
  for (let i = 0; i <= 1; i++) {
    const btn = document.getElementById('ox-' + qId + '-' + i);
    btn.disabled = true;
    if (i === q.answer) btn.classList.add(isCorrect ? 'correct' : 'reveal');
    else if (i === selected && !isCorrect) btn.classList.add('wrong');
  }
  showFeedback(qId, isCorrect);
  updateScore(isCorrect);
}

function checkSA(qId) {
  const q = QUIZ_DATA.find(q => q.id === qId);
  const input = document.getElementById('sa-' + qId);
  const btn = document.getElementById('sabtn-' + qId);
  const userAns = input.value.trim().toLowerCase();
  const isCorrect = q.acceptList.some(a => userAns.includes(a.toLowerCase()));
  input.disabled = true;
  btn.disabled = true;
  input.style.borderColor = isCorrect ? 'var(--green)' : 'var(--red)';
  showFeedback(qId, isCorrect);
  updateScore(isCorrect);
}

function showModal() {
  const score = state.correct;
  const rate = Math.round(score / 10 * 100);
  let grade, msg, emoji;
  if (score >= 9) { grade = 'A+ — 탁월'; msg = '완벽에 가까운 이해! 시장 프로급입니다 🎉'; emoji = '🏆'; }
  else if (score >= 8) { grade = 'A — 우수'; msg = '훌륭합니다! 핵심을 잘 파악했습니다.'; emoji = '⭐'; }
  else if (score >= 6) { grade = 'B — 양호'; msg = '기본기는 갖췄습니다. 틀린 문제 복습 권장!'; emoji = '📈'; }
  else if (score >= 4) { grade = 'C — 보통'; msg = '한 번 더 읽어보세요. 꼭 다시 풀어보길!'; emoji = '📖'; }
  else { grade = 'D — 분발'; msg = '다시 한번 방송을 정독해 주세요!'; emoji = '💪'; }
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalScore').textContent = score + ' / 10 (' + rate + '%)';
  document.getElementById('modalGrade').textContent = grade;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalOverlay').classList.add('show');
}

function restartQuiz() {
  state = { solved: 0, correct: 0 };
  document.getElementById('sb-solved').textContent = '0 / 10';
  document.getElementById('sb-correct').textContent = '0';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressBar').style.background = 'var(--red)';
  document.getElementById('progressLabel').textContent = '정답률 0%';
  document.getElementById('modalOverlay').classList.remove('show');
  renderQuiz();
}

// handle SA enter key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.classList.contains('sa-input')) {
    const id = parseInt(e.target.id.replace('sa-', ''));
    const btn = document.getElementById('sabtn-' + id);
    if (btn && !btn.disabled) checkSA(id);
  }
});

renderQuiz();
</script>
</body>
</html>
