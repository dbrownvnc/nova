<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>httpCIA.chat 멤버미팅 2026-05-14 — 시험문제</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#ffffff; --bg2:#fafafa; --text:#1a1a1a; --text2:#777777;
  --accent:#e11d48; --accent2:#f43f5e; --border:#e5e5e5;
  --green:#16a34a; --red:#dc2626; --orange:#ea580c;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;}

/* ── STICKY SCOREBOARD ── */
.scoreboard{
  position:sticky;top:0;z-index:100;
  background:var(--text);color:#fff;
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.score-item{font-size:12px;color:#aaa;}
.score-item strong{font-size:14px;color:#fff;}
.score-item.highlight strong{color:var(--accent2);}
.progress-wrap{flex:1;min-width:100px;height:8px;background:#333;border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:width 0.5s ease,background 0.5s ease;width:0%;}

/* ── HEADER ── */
.quiz-header{
  background:var(--accent);color:#fff;
  padding:28px 20px 22px;
}
.quiz-header::before{content:'';display:block;height:4px;background:var(--text);margin-bottom:12px;border-radius:2px;}
.quiz-header h1{font-family:'Playfair Display',serif;font-size:clamp(20px,5vw,28px);font-weight:900;line-height:1.2;}
.quiz-header p{font-size:13px;color:rgba(255,255,255,0.8);margin-top:8px;}

/* ── CONTAINER ── */
.container{max-width:680px;margin:0 auto;padding:0 16px;}

/* ── QUIZ CARD ── */
.quiz-card{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:20px;
  margin:16px 0;
  transition:box-shadow 0.2s;
}
.quiz-card:hover{box-shadow:0 2px 12px rgba(225,29,72,0.08);}

.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.q-num{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:900;
  color:var(--accent);line-height:1;
}
.badge{
  display:inline-block;padding:2px 8px;border-radius:2px;
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
}
.badge-easy{background:#dcfce7;color:#15803d;}
.badge-mid{background:#fef9c3;color:#854d0e;}
.badge-hard{background:#fee2e2;color:var(--red);}
.badge-mc{background:#dbeafe;color:#1d4ed8;}
.badge-sa{background:#ede9fe;color:#6d28d9;}
.badge-ox{background:#fce7f3;color:#be185d;}

.q-text{font-size:15px;font-weight:500;margin-bottom:14px;line-height:1.6;}

/* ── OPTIONS ── */
.options{display:flex;flex-direction:column;gap:8px;}
.opt-btn{
  width:100%;text-align:left;
  padding:10px 14px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
  font-family:'Noto Sans KR',sans-serif;
  transition:all 0.18s;
  line-height:1.5;
}
.opt-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:#fff5f7;}
.opt-btn:disabled{cursor:default;}
.opt-btn.correct{background:#dcfce7;border-color:var(--green);color:var(--green);font-weight:700;}
.opt-btn.wrong{background:#fee2e2;border-color:var(--red);color:var(--red);}
.result-badge{
  display:inline-block;margin-left:8px;font-size:11px;font-weight:700;
  padding:1px 6px;border-radius:2px;
}
.result-badge.ok{background:var(--green);color:#fff;}
.result-badge.no{background:var(--red);color:#fff;}

/* ── SHORT ANSWER ── */
.sa-wrap{display:flex;gap:8px;margin-top:4px;}
.sa-input{
  flex:1;padding:10px 12px;
  border:1px solid var(--border);border-radius:4px;
  font-size:14px;font-family:'Noto Sans KR',sans-serif;
  outline:none;transition:border-color 0.2s;
}
.sa-input:focus{border-color:var(--accent);}
.sa-input:disabled{background:#f5f5f5;color:var(--text2);}
.submit-btn{
  padding:10px 16px;
  background:var(--accent);color:#fff;
  border:none;border-radius:4px;
  cursor:pointer;font-size:13px;font-weight:700;
  font-family:'Noto Sans KR',sans-serif;
  transition:background 0.2s;white-space:nowrap;
}
.submit-btn:hover:not(:disabled){background:var(--accent2);}
.submit-btn:disabled{background:#ccc;cursor:default;}

/* ── OX ── */
.ox-wrap{display:flex;gap:12px;margin-top:4px;}
.ox-btn{
  flex:1;padding:14px;
  font-size:22px;font-weight:900;
  border:1px solid var(--border);background:#fff;
  border-radius:4px;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;
  transition:all 0.18s;
}
.ox-btn:hover:not(:disabled){border-color:var(--accent);background:#fff5f7;}
.ox-btn:disabled{cursor:default;}
.ox-btn.correct{background:#dcfce7;border-color:var(--green);}
.ox-btn.wrong{background:#fee2e2;border-color:var(--red);}

/* ── EXPLANATION ── */
.explanation{
  display:none;
  margin-top:12px;
  background:#fff;
  border-left:3px solid var(--accent);
  padding:12px 14px;
  border-radius:0 4px 4px 0;
  font-size:13px;
  color:var(--text);
  line-height:1.7;
}
.explanation.show{display:block;}
.expl-title{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}

/* ── FINAL MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  z-index:200;align-items:center;justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex;}
.modal{
  background:#fff;border-radius:8px;
  padding:28px 24px;max-width:380px;width:100%;
  text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,0.25);
}
.modal-grade{
  font-family:'Playfair Display',serif;
  font-size:64px;font-weight:900;
  color:var(--accent);line-height:1;
  margin-bottom:8px;
}
.modal-score{font-size:20px;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:14px;color:var(--text2);margin-bottom:20px;line-height:1.6;}
.modal-retry{
  background:var(--accent);color:#fff;
  border:none;padding:12px 28px;border-radius:4px;
  cursor:pointer;font-size:14px;font-weight:700;
  font-family:'Noto Sans KR',sans-serif;
  transition:background 0.2s;
}
.modal-retry:hover{background:var(--accent2);}

/* ── FOOTER ── */
.footer{background:var(--text);color:#555;padding:16px;text-align:center;font-size:11px;margin-top:30px;}
.footer span{color:var(--accent2);}
</style>

let state = { solved: 0, correct: 0, answered: {} };

function updateScoreboard() {
  const s = state;
  document.getElementById('sb-solved').textContent  = s.solved;
  document.getElementById('sb-correct').textContent = s.correct;
  const pct = s.solved === 0 ? 0 : Math.round(s.correct / s.solved * 100);
  document.getElementById('sb-pct').textContent = pct + '%';
  const bar = document.getElementById('sb-bar');
  bar.style.width = (s.solved / 10 * 100) + '%';
  bar.style.background = pct < 40 ? '#dc2626' : pct < 70 ? '#ea580c' : '#16a34a';
}

function showExplanation(id) {
  document.getElementById('expl-' + id).classList.add('show');
}

function onMcAnswer(qid, chosen, correct, btns) {
  if (state.answered[qid]) return;
  state.answered[qid] = true;
  state.solved++;
  const isCorrect = chosen === correct;
  if (isCorrect) state.correct++;
  btns.forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.val === correct) {
      btn.classList.add('correct');
      btn.innerHTML += ' <span class="result-badge ok">✓ 정답</span>';
    } else if (btn.dataset.val === chosen && !isCorrect) {
      btn.classList.add('wrong');
      btn.innerHTML += ' <span class="result-badge no">✗ 오답</span>';
    }
  });
  showExplanation(qid);
  updateScoreboard();
  checkComplete();
}

function onOxAnswer(qid, chosen, correct, btns) {
  if (state.answered[qid]) return;
  state.answered[qid] = true;
  state.solved++;
  const isCorrect = chosen === correct;
  if (isCorrect) state.correct++;
  btns.forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.val === correct) btn.classList.add('correct');
    else if (btn.dataset.val === chosen) btn.classList.add('wrong');
  });
  showExplanation(qid);
  updateScoreboard();
  checkComplete();
}

function onSaSubmit(qid, inputEl, correct, submitBtn) {
  if (state.answered[qid]) return;
  const val = inputEl.value.trim().toLowerCase().replace(/[,\s·]+/g, ' ');
  if (!val) return;
  state.answered[qid] = true;
  state.solved++;
  // flexible check: all key words present
  const keys = correct.toLowerCase().split(',').map(k => k.trim());
  const isCorrect = keys.every(k => val.includes(k));
  if (isCorrect) state.correct++;
  inputEl.disabled = true;
  submitBtn.disabled = true;
  const feedback = document.getElementById('sa-feedback-' + qid);
  if (feedback) {
    feedback.style.display = 'block';
    feedback.style.color = isCorrect ? '#16a34a' : '#dc2626';
    feedback.textContent = isCorrect ? '✓ 정답입니다!' : '✗ 오답입니다. 정답: ' + correct.split(',').map(k=>k.trim()).map(k=>k.charAt(0).toUpperCase()+k.slice(1)).join(' → ');
  }
  showExplanation(qid);
  updateScoreboard();
  checkComplete();
}

function checkComplete() {
  if (state.solved < 10) return;
  const pct = Math.round(state.correct / 10 * 100);
  let grade, msg;
  if (pct >= 90) { grade = 'A'; msg = '완벽합니다! 오늘 방송 내용을 거의 완전히 이해하셨군요. AI 투자의 핵심을 꿰뚫고 있습니다.'; }
  else if (pct >= 70) { grade = 'B'; msg = '잘 하셨습니다! 핵심 내용을 잘 파악하고 있습니다. 틀린 문제를 다시 복습해 보세요.'; }
  else if (pct >= 50) { grade = 'C'; msg = '절반 이상 맞히셨습니다. 방송 내용을 한 번 더 복습하면 완벽해질 거예요.'; }
  else { grade = 'D'; msg = '조금 더 공부가 필요합니다. SPA 원칙의 첫 번째, Study부터 다시 시작해봅시다!'; }
  document.getElementById('modalGrade').textContent = grade;
  document.getElementById('modalScore').textContent = state.correct + ' / 10 점 (' + pct + '%)';
  document.getElementById('modalMsg').textContent = msg;
  setTimeout(() => document.getElementById('modalOverlay').classList.add('show'), 600);
}

function retryQuiz() {
  state = { solved: 0, correct: 0, answered: {} };
  document.getElementById('modalOverlay').classList.remove('show');
  updateScoreboard();
  renderQuiz();
}

function diffBadge(d) {
  if (d === 'easy') return '<span class="badge badge-easy">쉬움</span>';
  if (d === 'mid')  return '<span class="badge badge-mid">보통</span>';
  return '<span class="badge badge-hard">어려움</span>';
}
function typeBadge(t) {
  if (t === 'mc') return '<span class="badge badge-mc">객관식</span>';
  if (t === 'sa') return '<span class="badge badge-sa">단답형</span>';
  return '<span class="badge badge-ox">O / X</span>';
}

function renderQuiz() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  QUIZ_DATA.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    let inner = `
      <div class="q-meta">
        <div class="q-num">Q${idx + 1}</div>
        ${typeBadge(q.type)}
        ${diffBadge(q.difficulty)}
      </div>
      <div class="q-text">${q.question}</div>
    `;

    if (q.type === 'mc') {
      inner += '<div class="options" id="opts-' + q.id + '">';
      q.options.forEach(opt => {
        inner += `<button class="opt-btn" data-val="${opt}" onclick="mcClick(${q.id}, this)">${opt}</button>`;
      });
      inner += '</div>';
    } else if (q.type === 'sa') {
      inner += `
        <div class="sa-wrap">
          <input type="text" class="sa-input" id="sa-input-${q.id}" placeholder="답을 입력하세요..." maxlength="60">
          <button class="submit-btn" id="sa-btn-${q.id}" onclick="saClick(${q.id})">제출</button>
        </div>
        <div id="sa-feedback-${q.id}" style="display:none;font-size:13px;font-weight:700;margin-top:6px;"></div>
      `;
    } else if (q.type === 'ox') {
      inner += `
        <div class="ox-wrap" id="ox-${q.id}">
          <button class="ox-btn" data-val="O" onclick="oxClick(${q.id}, this)">⭕ O</button>
          <button class="ox-btn" data-val="X" onclick="oxClick(${q.id}, this)">❌ X</button>
        </div>
      `;
    }

    inner += `
      <div class="explanation" id="expl-${q.id}">
        <div class="expl-title">해설</div>
        ${q.explanation}
      </div>
    `;

    card.innerHTML = inner;
    area.appendChild(card);
  });

  // enter key for SA
  QUIZ_DATA.filter(q => q.type === 'sa').forEach(q => {
    const inp = document.getElementById('sa-input-' + q.id);
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') saClick(q.id); });
  });
}

function mcClick(qid, btn) {
  if (state.answered[qid]) return;
  const wrap = document.getElementById('opts-' + qid);
  const btns = Array.from(wrap.querySelectorAll('.opt-btn'));
  const q = QUIZ_DATA.find(x => x.id === qid);
  onMcAnswer(qid, btn.dataset.val, q.answer, btns);
}

function oxClick(qid, btn) {
  if (state.answered[qid]) return;
  const wrap = document.getElementById('ox-' + qid);
  const btns = Array.from(wrap.querySelectorAll('.ox-btn'));
  const q = QUIZ_DATA.find(x => x.id === qid);
  onOxAnswer(qid, btn.dataset.val, q.answer, btns);
}

function saClick(qid) {
  if (state.answered[qid]) return;
  const inp  = document.getElementById('sa-input-' + qid);
  const btn  = document.getElementById('sa-btn-' + qid);
  const q    = QUIZ_DATA.find(x => x.id === qid);
  onSaSubmit(qid, inp, q.answer, btn);
}

renderQuiz();
updateScoreboard();
</script>
</body>
</html>
