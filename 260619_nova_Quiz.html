<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA 퀴즈 — The Great Divergence (2026.06.18)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#fafafa;--text:#1a1a1a;--text2:#777777;
  --accent:#e11d48;--accent2:#f43f5e;--border:#e5e5e5;
  --up:#16a34a;--down:#e11d48;
  --correct:#dcfce7;--correct-bd:#16a34a;
  --wrong:#fff1f2;--wrong-bd:#e11d48;
}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f5f5;color:var(--text);min-height:100vh;padding-bottom:60px}

/* ── Sticky Score Bar ── */
.score-bar{
  position:sticky;top:0;z-index:100;
  background:var(--text);color:#fff;
  padding:10px 16px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.score-title{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-stats{display:flex;gap:12px;font-size:11px;font-weight:700;flex-shrink:0}
.score-stat span{color:rgba(255,255,255,.5);font-weight:400}
.progress-wrap{height:4px;background:#333;position:relative}
.progress-fill{height:4px;width:0;transition:width .4s ease,background .4s ease;background:var(--down)}

/* ── Header ── */
.quiz-hdr{background:var(--text);color:#fff;padding:36px 16px 28px;text-align:center;border-bottom:3px solid var(--accent)}
.quiz-hdr-eye{font-size:10px;letter-spacing:3px;color:var(--accent);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.quiz-hdr h1{font-family:'Playfair Display',serif;font-size:clamp(20px,5vw,30px);font-weight:900;margin-bottom:8px;line-height:1.2}
.quiz-hdr p{font-size:12px;color:rgba(255,255,255,.6);line-height:1.6}

/* ── Main ── */
.qwrap{max-width:680px;margin:0 auto;padding:20px 14px}

/* ── Question Card ── */
.qcard{
  background:var(--bg);border-radius:6px;
  padding:20px 18px;margin-bottom:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  border:1px solid var(--border);
}
.qcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.qnum{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--accent);line-height:1}
.qtype-badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700;letter-spacing:.5px}
.badge-mc{background:#eff6ff;color:#1d4ed8}
.badge-short{background:#fefce8;color:#854d0e}
.badge-ox{background:#f0fdf4;color:#166534}
.diff-badge{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:700}
.diff-easy{background:#f0fdf4;color:#15803d}
.diff-medium{background:#fefce8;color:#b45309}
.diff-hard{background:#fff1f2;color:#be123c}

.qtext{font-size:15px;font-weight:700;line-height:1.6;margin-bottom:16px;color:var(--text)}

/* ── Options ── */
.options{display:flex;flex-direction:column;gap:8px}
.opt-btn{
  width:100%;text-align:left;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:4px;
  background:var(--bg2);color:var(--text);
  font-size:13px;font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;transition:all .15s ease;line-height:1.5;
}
.opt-btn:hover:not(:disabled){border-color:var(--accent);background:#fff1f2;color:var(--accent)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:var(--correct)!important;border-color:var(--correct-bd)!important;color:#15803d!important;font-weight:700}
.opt-btn.wrong{background:var(--wrong)!important;border-color:var(--wrong-bd)!important;color:var(--accent)!important}
.opt-result{display:inline-block;font-size:11px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:2px;vertical-align:middle}
.opt-result.ok{background:#15803d;color:#fff}
.opt-result.no{background:var(--accent);color:#fff}

/* OX Buttons */
.ox-group{display:flex;gap:10px}
.ox-btn{
  flex:1;padding:14px;border:2px solid var(--border);border-radius:4px;
  background:var(--bg2);color:var(--text);font-size:26px;font-weight:700;
  cursor:pointer;transition:all .15s;text-align:center;
  font-family:'Playfair Display',serif;
}
.ox-btn:hover:not(:disabled){border-color:var(--accent);background:#fff1f2}
.ox-btn:disabled{cursor:default}
.ox-btn.correct{background:var(--correct)!important;border-color:var(--correct-bd)!important}
.ox-btn.wrong{background:var(--wrong)!important;border-color:var(--wrong-bd)!important}

/* Short Answer */
.short-wrap{display:flex;gap:8px;flex-wrap:wrap}
.short-input{
  flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--border);border-radius:4px;
  font-size:14px;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg2);
}
.short-input:focus{outline:none;border-color:var(--accent)}
.short-input:disabled{background:#f9f9f9;color:var(--text2)}
.short-input.correct-input{border-color:var(--correct-bd)!important;background:var(--correct)!important}
.short-input.wrong-input{border-color:var(--wrong-bd)!important;background:var(--wrong)!important}
.short-submit{
  padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:4px;
  font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  font-family:'Noto Sans KR',sans-serif;
}
.short-submit:hover:not(:disabled){background:var(--accent2)}
.short-submit:disabled{background:var(--text2);cursor:default}
.short-hint{font-size:11px;color:var(--text2);margin-top:6px}

/* ── Explanation ── */
.explanation{
  display:none;
  margin-top:14px;padding:12px 14px;
  border-radius:4px;border-left:3px solid var(--accent);
  background:#fff8f9;font-size:13px;color:#7f1d1d;line-height:1.65;
}
.explanation.show{display:block}
.explanation .expl-head{font-weight:700;color:var(--accent);font-size:12px;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.explanation .expl-answer{font-size:12px;color:var(--text2);margin-top:6px}
.explanation .expl-answer strong{color:var(--text);font-weight:700}

/* ── Final Modal ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
  align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.show{display:flex}
.modal-card{
  background:#fff;border-radius:8px;padding:36px 24px;max-width:420px;width:100%;
  text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.modal-card h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;margin-bottom:8px;color:var(--text)}
.modal-score{font-family:'Playfair Display',serif;font-size:56px;font-weight:900;color:var(--accent);margin:16px 0 4px}
.modal-grade{display:inline-block;font-size:22px;font-weight:700;padding:4px 18px;border-radius:4px;margin-bottom:12px}
.modal-msg{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:20px}
.modal-restart{
  background:var(--accent);color:#fff;border:none;border-radius:4px;
  padding:12px 32px;font-size:14px;font-weight:700;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:background .15s;
}
.modal-restart:hover{background:var(--accent2)}
.grade-A{background:#dcfce7;color:#15803d}
.grade-B{background:#dbeafe;color:#1d4ed8}
.grade-C{background:#fef9c3;color:#854d0e}
.grade-D{background:#fff1f2;color:var(--accent)}

@media(max-width:480px){
  .score-stats{gap:8px;font-size:10px}
  .qcard{padding:16px 14px}
  .short-wrap{flex-direction:column}
  .short-submit{width:100%}
  .ox-btn{font-size:22px;padding:12px}
}
</style>
</head>
<body>

/* ═══════════════════════════════════════

let state = { solved: 0, correct: 0 };

/* ═══════════════════════════════════════
   RENDER
═══════════════════════════════════════ */
function renderQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  QUIZ_DATA.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = `qcard-${q.id}`;

    const diffLabel = { easy: '쉬움', medium: '보통', hard: '어려움' }[q.difficulty];
    const diffClass = `diff-${q.difficulty}`;
    const typeLabel = { multiple: '객관식', short: '단답형', ox: 'O/X' }[q.type];
    const typeBadge = { multiple: 'badge-mc', short: 'badge-short', ox: 'badge-ox' }[q.type];

    let bodyHTML = '';
    if (q.type === 'multiple') {
      bodyHTML = `<div class="options" id="opts-${q.id}">
        ${q.options.map((opt, i) => {
          const letter = ['A','B','C','D'][i];
          return `<button class="opt-btn" data-qid="${q.id}" data-letter="${letter}" onclick="answerMC(${q.id},'${letter}',this)">${opt}</button>`;
        }).join('')}
      </div>`;
    } else if (q.type === 'ox') {
      bodyHTML = `<div class="ox-group" id="ox-${q.id}">
        <button class="ox-btn" data-qid="${q.id}" onclick="answerOX(${q.id},'O',this)">O</button>
        <button class="ox-btn" data-qid="${q.id}" onclick="answerOX(${q.id},'X',this)">X</button>
      </div>`;
    } else {
      bodyHTML = `<div class="short-wrap">
        <input class="short-input" type="text" id="short-${q.id}" placeholder="답을 입력하세요..." onkeydown="if(event.key==='Enter')submitShort(${q.id})">
        <button class="short-submit" id="short-btn-${q.id}" onclick="submitShort(${q.id})">제출</button>
      </div>
      <div class="short-hint">※ 입력 후 엔터 또는 제출 버튼을 누르세요</div>`;
    }

    card.innerHTML = `
      <div class="qcard-meta">
        <div class="qnum">${String(idx + 1).padStart(2,'0')}</div>
        <span class="qtype-badge ${typeBadge}">${typeLabel}</span>
        <span class="diff-badge ${diffClass}">${diffLabel}</span>
      </div>
      <div class="qtext">${q.question}</div>
      ${bodyHTML}
      <div class="explanation" id="expl-${q.id}">
        <div class="expl-head">📖 해설</div>
        <div id="expl-text-${q.id}"></div>
        <div class="expl-answer" id="expl-ans-${q.id}"></div>
      </div>
    `;
    container.appendChild(card);
  });
}

/* ═══════════════════════════════════════
   ANSWER HANDLERS
═══════════════════════════════════════ */
function answerMC(qid, letter, clickedBtn) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  if (!q) return;
  const isCorrect = letter === q.answer;

  // Disable all buttons
  document.querySelectorAll(`[data-qid="${qid}"].opt-btn`).forEach(btn => {
    btn.disabled = true;
    const l = btn.getAttribute('data-letter');
    if (l === q.answer) {
      btn.classList.add('correct');
      btn.innerHTML += '<span class="opt-result ok">✓ 정답</span>';
    } else if (l === letter && !isCorrect) {
      btn.classList.add('wrong');
      btn.innerHTML += '<span class="opt-result no">✗ 오답</span>';
    }
  });

  recordResult(qid, isCorrect, q.explanation, q.answerLabel);
}

function answerOX(qid, pick, clickedBtn) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  if (!q) return;
  const isCorrect = pick === q.answer;

  document.querySelectorAll(`#ox-${qid} .ox-btn`).forEach(btn => {
    btn.disabled = true;
  });

  const oxBtns = document.querySelectorAll(`#ox-${qid} .ox-btn`);
  oxBtns.forEach(btn => {
    const txt = btn.textContent.trim();
    if (txt === q.answer) btn.classList.add('correct');
    else if (txt === pick && !isCorrect) btn.classList.add('wrong');
  });

  recordResult(qid, isCorrect, q.explanation, q.answerLabel);
}

function submitShort(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  if (!q) return;
  const input = document.getElementById(`short-${qid}`);
  const btn = document.getElementById(`short-btn-${qid}`);
  if (!input || input.disabled) return;

  const userVal = input.value.trim().replace(/\s/g,'').toLowerCase();
  const answers = q.answer.map(a => a.replace(/\s/g,'').toLowerCase());
  const isCorrect = answers.includes(userVal);

  input.disabled = true;
  btn.disabled = true;
  input.classList.add(isCorrect ? 'correct-input' : 'wrong-input');

  recordResult(qid, isCorrect, q.explanation, q.answerLabel);
}

/* ═══════════════════════════════════════
   SCORE + EXPLANATION
═══════════════════════════════════════ */
function recordResult(qid, isCorrect, explanation, answerLabel) {
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreBar();
  showExplanation(qid, isCorrect, explanation, answerLabel);

  if (state.solved === QUIZ_DATA.length) {
    setTimeout(showFinalModal, 700);
  }
}

function showExplanation(qid, isCorrect, explanation, answerLabel) {
  const expl = document.getElementById(`expl-${qid}`);
  const explText = document.getElementById(`expl-text-${qid}`);
  const explAns = document.getElementById(`expl-ans-${qid}`);

  explText.textContent = explanation;
  explAns.innerHTML = `<strong>${answerLabel}</strong>`;
  expl.classList.add('show');

  // Smooth scroll to explanation
  setTimeout(() => {
    expl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

/* ═══════════════════════════════════════
   SCORE BAR
═══════════════════════════════════════ */
function updateScoreBar() {
  const pct = state.solved > 0 ? Math.round((state.correct / state.solved) * 100) : 0;
  document.getElementById('sb-solved').textContent = state.solved;
  document.getElementById('sb-correct').textContent = state.correct;
  document.getElementById('sb-pct').textContent = pct + '%';

  const fill = document.getElementById('progress-fill');
  fill.style.width = (state.solved / QUIZ_DATA.length * 100) + '%';

  // Color by accuracy
  if (pct >= 70) fill.style.background = '#16a34a';
  else if (pct >= 40) fill.style.background = '#f59e0b';
  else fill.style.background = '#e11d48';
}

/* ═══════════════════════════════════════
   FINAL MODAL
═══════════════════════════════════════ */
function showFinalModal() {
  const score = state.correct;
  const total = QUIZ_DATA.length;
  const pct = Math.round(score / total * 100);

  let grade, gradeClass, msg;
  if (pct >= 90) {
    grade = 'A'; gradeClass = 'grade-A';
    msg = '훌륭합니다! 반도체 슈퍼사이클과 AI 인프라 흐름을 완벽하게 이해하고 계십니다. "This is NOVA!"';
  } else if (pct >= 70) {
    grade = 'B'; gradeClass = 'grade-B';
    msg = '잘 하셨습니다! 핵심 개념은 파악하고 있으나 세부 수치나 심층 내용을 한 번 더 복습하면 완벽해집니다.';
  } else if (pct >= 50) {
    grade = 'C'; gradeClass = 'grade-C';
    msg = '기본 개념은 이해했습니다. AI 인프라 스택 3레이어와 주요 종목별 흐름을 다시 한번 정리해 보세요.';
  } else {
    grade = 'D'; gradeClass = 'grade-D';
    msg = '분석 리포트를 처음부터 다시 읽고, 핵심 수치와 인과 관계에 집중해서 복습해 보세요. 화이팅!';
  }

  document.getElementById('modal-score').textContent = `${score} / ${total}`;
  const gradeEl = document.getElementById('modal-grade');
  gradeEl.textContent = `등급 ${grade} (정답률 ${pct}%)`;
  gradeEl.className = `modal-grade ${gradeClass}`;
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal').classList.add('show');
}

/* ═══════════════════════════════════════
   RESTART
═══════════════════════════════════════ */
function restartQuiz() {
  state = { solved: 0, correct: 0 };
  updateScoreBar();
  document.getElementById('progress-fill').style.width = '0';
  document.getElementById('modal').classList.remove('show');
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── INIT ── */
renderQuiz();
updateScoreBar();
</script>
</body>
</html>
