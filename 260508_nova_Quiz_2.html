<style>

    font-size: 15px;

    margin: 0 auto;
    padding: 0 16px 80px;

  /* ── Sticky Score Bar ── */
  #scoreBar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--text);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #scoreBar .score-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; }
  #scoreBar .score-val { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; }
  #scoreBar .progress-wrap { flex: 1; min-width: 80px; background: rgba(255,255,255,0.2); border-radius: 4px; height: 8px; }
  #progressBar { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.5s ease; width: 0%; background: #e11d48; }

  /* ── Page Header ── */
  .page-header {
    border-bottom: 3px solid var(--accent);
    padding: 28px 0 16px;
    margin-bottom: 28px;
  }
  .page-header .kicker {
    font-size: 10px; font-weight: 700; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase; margin-bottom: 6px;
  }
  .page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 6vw, 34px);
    font-weight: 900; line-height: 1.2;
  }
  .page-header .sub { font-size: 13px; color: var(--text2); margin-top: 6px; }

  /* ── Quiz Card ── */
  .quiz-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 18px;
    margin-bottom: 24px;
  }
  .card-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 13px; font-weight: 700;
    color: var(--accent);
  }
  .badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px;
  }
  .badge.easy { background: #dcfce7; color: #166534; }
  .badge.med { background: #fef9c3; color: #854d0e; }
  .badge.hard { background: #fee2e2; color: #991b1b; }
  .badge.mc { background: #dbeafe; color: #1e40af; }
  .badge.sa { background: #ede9fe; color: #5b21b6; }
  .badge.ox { background: #f3f4f6; color: #374151; }

  .q-text { font-size: 15px; font-weight: 700; line-height: 1.6; margin-bottom: 16px; }

  /* ── Options ── */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .opt-btn:not(:disabled):hover { border-color: var(--accent); background: #fff5f7; }
  .opt-btn.correct-pick {
    background: var(--correct-bg) !important;
    border-color: var(--correct) !important;
    color: var(--correct) !important;
    font-weight: 700;
  }
  .opt-btn.wrong-pick {
    background: var(--wrong-bg) !important;
    border-color: var(--wrong) !important;
    color: var(--wrong) !important;
  }
  .opt-btn.show-correct {
    background: var(--correct-bg) !important;
    border-color: var(--correct) !important;
    color: var(--correct) !important;
    font-weight: 700;
  }
  .opt-btn:disabled { cursor: not-allowed; }

  /* ── Short Answer ── */
  .sa-wrap { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .sa-input {
    flex: 1; min-width: 160px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    background: #fff;

  .sa-input:focus { outline: none; border-color: var(--accent); }
  .submit-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;

    font-size: 13px; font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .submit-btn:hover { background: var(--accent2); }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

  .ox-wrap { display: flex; gap: 12px; }
  .ox-btn {
    flex: 1;
    padding: 14px;
    font-size: 26px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-weight: 700;

  .ox-btn:disabled { cursor: not-allowed; }

    display: inline-block;
    margin-top: 10px;
    font-size: 13px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px;

  .feedback-badge.ok { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct-border); }
  .feedback-badge.ng { background: var(--wrong-bg); color: var(--wrong); border: 1px solid var(--wrong-border); }

  /* ── Explanation ── */

    display: none;
    margin-top: 14px;

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Final Modal ── */
  #finalModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #finalModal.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 36px 28px;
    text-align: center;
    max-width: 380px;
    width: 100%;

  .retry-btn {
    background: var(--accent);
    color: #fff; border: none;
    border-radius: 8px;
    padding: 14px 36px;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;

  /* ── Divider ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 30px 0; }
</style>
</head>

    answer: '리스크 매니지먼트',
    altAnswers: ['risk management', 'riskmanagement', '위험관리', '리스크매니지먼트'],
    explanation: '노바는 "주식은 우리가 잘나서 버는 게 아니에요. 시장이 좋으면 자동으로 올라갑니다. 우리는 리스크 매니지먼트만 하면 된다"고 강조했습니다. 관리만 잘하면 된다는 메시지를 탑건 1986년/2018년 비교 이미지로도 설명했습니다.'
  }
];

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let state = { solved: 0, correct: 0 };

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function render() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUIZ_DATA.forEach(q => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.id = 'card-' + q.id;

    const diffMap = { easy: ['easy','쉬움'], med: ['med','보통'], hard: ['hard','어려움'] };
    const typeMap = { mc: ['mc','객관식'], sa: ['sa','단답형'], ox: ['ox','O/X'] };
    const [dc, dl] = diffMap[q.difficulty];
    const [tc, tl] = typeMap[q.type];

    let inner = `
      <div class="card-meta">
        <span class="q-num">Q${q.id}</span>
        <span class="badge ${dc}">${dl}</span>
        <span class="badge ${tc}">${tl}</span>
      </div>
      <div class="q-text">${q.question}</div>
    `;

    if (q.type === 'mc') {
      inner += `<div class="options" id="opts-${q.id}">`;
      q.options.forEach((opt, i) => {
        inner += `<button class="opt-btn" onclick="checkMC(${q.id}, ${i})">${opt}</button>`;
      });
      inner += `</div>`;
    } else if (q.type === 'ox') {
      inner += `<div class="ox-wrap" id="opts-${q.id}">
        <button class="ox-btn" onclick="checkOX(${q.id}, 'O')">⭕</button>
        <button class="ox-btn" onclick="checkOX(${q.id}, 'X')">❌</button>
      </div>`;
    } else if (q.type === 'sa') {
      inner += `<div class="sa-wrap">
        <input type="text" class="sa-input" id="sa-${q.id}" placeholder="정답을 입력하세요" onkeydown="if(event.key==='Enter') checkSA(${q.id})">
        <button class="submit-btn" id="sa-btn-${q.id}" onclick="checkSA(${q.id})">제출</button>
      </div>`;
    }

    inner += `<div class="explanation" id="exp-${q.id}"><div class="exp-title">📖 해설</div>${q.explanation}</div>`;
    inner += `<div id="fb-${q.id}"></div>`;
    card.innerHTML = inner;
    container.appendChild(card);

    // Add HR except last
    if (q.id < QUIZ_DATA.length) {
      const hr = document.createElement('hr');
      hr.className = 'divider';
      container.appendChild(hr);
    }
  });
}

// ─────────────────────────────────────────
// SCORE UPDATE
// ─────────────────────────────────────────
function updateScore(isCorrect) {
  state.solved++;
  if (isCorrect) state.correct++;
  const rate = state.solved > 0 ? Math.round(state.correct / state.solved * 100) : 0;
  document.getElementById('solvedCount').textContent = state.solved;
  document.getElementById('correctCount').textContent = state.correct;
  document.getElementById('rateDisplay').textContent = rate;
  const bar = document.getElementById('progressBar');
  bar.style.width = rate + '%';
  bar.style.background = rate < 40 ? '#e11d48' : rate < 70 ? '#f59e0b' : '#22c55e';

  if (state.solved === QUIZ_DATA.length) {
    setTimeout(showFinal, 700);
  }
}

// ─────────────────────────────────────────
// FEEDBACK DISPLAY
// ─────────────────────────────────────────
function showFeedback(qid, isCorrect) {
  const fb = document.getElementById('fb-' + qid);
  fb.innerHTML = `<span class="feedback-badge ${isCorrect ? 'ok' : 'ng'}">${isCorrect ? '✓ 정답!' : '✗ 오답'}</span>`;
  document.getElementById('exp-' + qid).classList.add('show');
}

// ─────────────────────────────────────────
// MC CHECK
// ─────────────────────────────────────────
function checkMC(qid, picked) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const opts = document.querySelectorAll(`#opts-${qid} .opt-btn`);
  opts.forEach(btn => btn.disabled = true);
  const isCorrect = picked === q.answer;
  opts[picked].classList.add(isCorrect ? 'correct-pick' : 'wrong-pick');
  if (!isCorrect) opts[q.answer].classList.add('show-correct');
  showFeedback(qid, isCorrect);
  updateScore(isCorrect);
}

// ─────────────────────────────────────────
// OX CHECK
// ─────────────────────────────────────────
function checkOX(qid, picked) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const btns = document.querySelectorAll(`#opts-${qid} .ox-btn`);
  btns.forEach(b => b.disabled = true);
  const isCorrect = picked === q.answer;
  const pickedBtn = picked === 'O' ? btns[0] : btns[1];
  pickedBtn.classList.add(isCorrect ? 'correct-pick' : 'wrong-pick');
  if (!isCorrect) {
    const correctBtn = q.answer === 'O' ? btns[0] : btns[1];
    correctBtn.classList.add('show-correct');
  }
  showFeedback(qid, isCorrect);
  updateScore(isCorrect);
}

// ─────────────────────────────────────────
// SA CHECK
// ─────────────────────────────────────────
function checkSA(qid) {
  const q = QUIZ_DATA.find(x => x.id === qid);
  const input = document.getElementById('sa-' + qid);
  const btn = document.getElementById('sa-btn-' + qid);
  if (!input.value.trim()) return;
  input.disabled = true;
  btn.disabled = true;
  const val = input.value.trim().toLowerCase().replace(/\s+/g,'');
  const answers = [q.answer.toLowerCase().replace(/\s+/g,'')];
  if (q.altAnswers) q.altAnswers.forEach(a => answers.push(a.toLowerCase().replace(/\s+/g,'')));
  const isCorrect = answers.includes(val);
  input.style.borderColor = isCorrect ? 'var(--correct)' : 'var(--wrong)';
  input.style.background = isCorrect ? 'var(--correct-bg)' : 'var(--wrong-bg)';
  showFeedback(qid, isCorrect);
  if (!isCorrect) {
    const hint = document.createElement('div');
    hint.style.cssText = 'margin-top:8px;font-size:13px;color:var(--correct);font-weight:700;';
    hint.textContent = '✓ 정답: ' + q.answer;
    document.getElementById('fb-' + qid).appendChild(hint);
  }
  updateScore(isCorrect);
}

// ─────────────────────────────────────────
// FINAL MODAL
// ─────────────────────────────────────────
function showFinal() {
  const score = state.correct;
  const rate = Math.round(score / QUIZ_DATA.length * 100);
  let grade, color, msg;
  if (score >= 9) { grade='A'; color='#16a34a'; msg='🎉 완벽합니다! httpCIA 방송을 매우 집중해서 시청했군요. 뛰어난 이해도입니다.'; }
  else if (score >= 7) { grade='B'; color='#2563eb'; msg='👍 훌륭해요! 핵심 내용을 잘 파악하고 있습니다.'; }
  else if (score >= 5) { grade='C'; color='#d97706'; msg='📚 절반 이상 맞혔네요. 틀린 문제 해설을 다시 한번 확인해보세요!'; }
  else { grade='D'; color='#dc2626'; msg='💪 다시 도전해보세요! 방송 내용을 복습한 뒤 재시도를 권장합니다.'; }

  document.getElementById('modalScore').textContent = score;
  const gb = document.getElementById('modalGrade');
  gb.textContent = '등급 ' + grade;
  gb.style.background = color + '22';
  gb.style.color = color;
  gb.style.border = '2px solid ' + color;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('finalModal').classList.add('show');
}

// ─────────────────────────────────────────
// RETRY
// ─────────────────────────────────────────
function retryAll() {
  state = { solved: 0, correct: 0 };
  document.getElementById('solvedCount').textContent = '0';
  document.getElementById('correctCount').textContent = '0';
  document.getElementById('rateDisplay').textContent = '0';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressBar').style.background = '#e11d48';
  document.getElementById('finalModal').classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// INIT
render();
</script>
</body>
</html>
