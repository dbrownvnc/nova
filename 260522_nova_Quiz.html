<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퀴즈 | 시장 분석 2026-05-21</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #fafafa;
    --text: #1a1a1a;
    --text2: #777777;
    --accent: #e11d48;
    --accent2: #f43f5e;
    --border: #e5e5e5;
    --correct: #16a34a;
    --wrong: #e11d48;
  }

  body {
    background: var(--bg2);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    line-height: 1.7;
    font-size: 15px;
    min-height: 100vh;
  }

  /* STICKY SCORE BAR */
  .score-bar {
    position: sticky;
    top: 0;
    z-index: 200;
    background: var(--text);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .score-bar .title-sm {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    color: #fff;
    font-weight: 700;
    flex-shrink: 0;
  }
  .score-stats {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    flex: 1;
    flex-wrap: wrap;
  }
  .score-stats span strong {
    color: #fff;
    font-weight: 700;
  }
  .progress-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin-top: 6px;
  }
  .progress-bar {
    height: 4px;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.4s ease, background 0.4s ease;
    width: 0%;
  }
  .progress-bar.orange { background: #f97316; }
  .progress-bar.green { background: var(--correct); }

  /* HEADER */
  .page-header {
    background: var(--bg);
    border-bottom: 3px solid var(--accent);
    padding: 24px 20px 18px;
  }
  .page-header .label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 900;
    line-height: 1.2;
    color: var(--text);
  }
  .page-header .sub {
    font-size: 12px;
    color: var(--text2);
    margin-top: 8px;
  }

  /* QUIZ CONTAINER */
  .quiz-wrap {
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .q-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    flex-shrink: 0;
    min-width: 28px;
  }
  .q-meta {
    flex: 1;
  }
  .q-badges {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge.mc { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
  .badge.sa { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .badge.ox { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .badge.easy { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .badge.medium { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .badge.hard { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
  .q-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.6;
  }

  /* OPTIONS */
  .q-body { padding: 12px 16px 14px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    border: 1px solid var(--border);
    background: var(--bg2);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
    transition: all 0.15s;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #fff1f2;
  }
  .opt-btn:disabled { cursor: default; }
  .opt-btn .opt-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .opt-btn .opt-text { flex: 1; }
  .opt-btn .badge-result {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 2px;
    flex-shrink: 0;
    display: none;
  }

  /* CORRECT */
  .opt-btn.correct {
    background: #f0fdf4;
    border-color: var(--correct);
  }
  .opt-btn.correct .opt-label {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .opt-btn.correct .badge-result {
    display: inline-block;
    background: var(--correct);
    color: #fff;
  }

  /* WRONG */
  .opt-btn.wrong {
    background: #fff1f2;
    border-color: var(--wrong);
  }
  .opt-btn.wrong .opt-label {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .opt-btn.wrong .badge-result {
    display: inline-block;
    background: var(--wrong);
    color: #fff;
  }

  /* OX BUTTONS */
  .ox-row { display: flex; gap: 10px; }
  .ox-btn {
    flex: 1;
    padding: 16px 10px;
    border: 1px solid var(--border);
    background: var(--bg2);
    cursor: pointer;
    font-size: 26px;
    font-weight: 900;
    text-align: center;
    font-family: 'Playfair Display', serif;
    transition: all 0.15s;
  }
  .ox-btn:hover:not(:disabled) { border-color: var(--accent); background: #fff1f2; }
  .ox-btn:disabled { cursor: default; }
  .ox-btn.correct { background: #f0fdf4; border-color: var(--correct); }
  .ox-btn.wrong { background: #fff1f2; border-color: var(--wrong); }

  /* SHORT ANSWER */
  .sa-row { display: flex; gap: 8px; align-items: stretch; }
  .sa-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .sa-input:focus { border-color: var(--accent); }
  .sa-input:disabled { background: var(--bg2); }
  .sa-submit {
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .sa-submit:hover:not(:disabled) { background: var(--accent2); }
  .sa-submit:disabled { background: var(--border); color: var(--text2); cursor: default; }
  .sa-result {
    margin-top: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 700;
    display: none;
  }
  .sa-result.correct { background: #f0fdf4; color: var(--correct); border-left: 4px solid var(--correct); }
  .sa-result.wrong { background: #fff1f2; color: var(--wrong); border-left: 4px solid var(--wrong); }

  /* EXPLANATION */
  .explanation {
    margin-top: 12px;
    border-top: 1px dashed var(--border);
    padding-top: 12px;
    display: none;
    animation: slideDown 0.3s ease;
  }
  .explanation.show { display: block; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .exp-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .exp-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.7;
  }
  .exp-source {
    font-size: 11px;
    color: var(--text2);
    margin-top: 6px;
    font-style: italic;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg);
    max-width: 380px;
    width: 100%;
    padding: 28px 24px;
    text-align: center;
    position: relative;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  .modal-grade {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .modal-grade.green { color: var(--correct); }
  .modal-grade.orange { color: #f97316; }
  .modal-score {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .modal-msg {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .modal-restart {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 28px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
  }
  .modal-restart:hover { background: var(--accent2); }
</style>
</head>

    keywords: ['800억', '80billion', '80 billion', '80b', '$80', '800'],

    source: '"자사주 매업도 80빌리언이면 정말 괴물 같은 주주 환원책"'
  },
  {
    id: 9,
    type: 'ox',
    difficulty: 'easy',
    question: 'Ross Stores(라스)는 당일 어닝 서프라이즈로 주가가 약 21% 폭등했다. (O/X)',
    answer: 'O',
    explanation: '라스(Ross Stores)는 어닝 서프라이즈로 당일 +21% 폭등했습니다. 강사는 "미쳤습니다. 어닝 서프라이즈 보니까"라고 표현했습니다. TJX 실적을 보고 라스에 투자했다면 대박을 친 날이라고 설명했습니다.',
    source: '"어닝 서프라이즈 보니까 미쳤습니다. 그래서 오늘 주가가 21%나 폭등했어요"'
  },
  {
    id: 10,
    type: 'ox',
    difficulty: 'medium',
    question: '강사는 ETF와 뮤추얼 펀드 투자를 초보자를 포함한 모든 투자자에게 적극 권장한다. (O/X)',
    answer: 'X',
    explanation: '강사는 ETF와 뮤추얼 펀드를 초보자의 베타 라인 추종 전략으로는 인정하면서도, 개인적으로는 좋아하지 않는다고 밝혔습니다. 이유는 ①내가 종목을 직접 고를 수 없다 ②양심에 꺼리는 종목이 포함될 수 있다 ③목표는 알파 라인(시장 대비 초과 수익)이기 때문입니다.',
    source: '"뮤지얼 펀드 저는 좋아하지 않습니다... ETF나 뮤추얼 펀드로 베타 라인을 쫓아가는 거 좋아요. 근데 우리가 주식을 하는 이유는..."'
  }
];

let state = { solved: 0, correct: 0, answered: {} };

function getGrade(rate) {
  if (rate >= 90) return { g: 'A', cls: 'green', msg: '완벽합니다! 시장의 흐름을 정확히 파악하셨군요. 오늘 장세를 제대로 읽으셨습니다.' };
  if (rate >= 70) return { g: 'B', cls: 'green', msg: '훌륭합니다! 핵심 내용을 잘 이해하셨습니다. 놓친 부분을 한 번 더 확인해보세요.' };
  if (rate >= 50) return { g: 'C', cls: 'orange', msg: '괜찮습니다! 기본기는 갖추셨습니다. 분석 리포트를 다시 읽어보시면 도움이 됩니다.' };
  return { g: 'D', cls: '', msg: '아직 갈 길이 있습니다. 분석 리포트를 한 번 더 정독한 뒤 도전해보세요!' };
}

function updateScoreBar() {
  const solved = state.solved;
  const correct = state.correct;
  const rate = solved > 0 ? Math.round(correct / solved * 100) : 0;

  document.getElementById('solved').textContent = solved;
  document.getElementById('correct').textContent = correct;
  document.getElementById('rate').textContent = rate + '%';

  const bar = document.getElementById('progressBar');
  const pct = Math.round(correct / 10 * 100);
  bar.style.width = pct + '%';
  bar.className = 'progress-bar';
  if (rate >= 70) bar.classList.add('green');
  else if (rate >= 40) bar.classList.add('orange');

  if (solved === 10) {
    setTimeout(showModal, 500);
  }
}

function showModal() {
  const rate = Math.round(state.correct / 10 * 100);
  const { g, cls, msg } = getGrade(rate);
  const gradeEl = document.getElementById('modalGrade');
  gradeEl.textContent = g;
  gradeEl.className = 'modal-grade ' + cls;
  document.getElementById('modalScore').textContent = `${state.correct}/10점`;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalOverlay').classList.add('show');
}

function restartQuiz() {
  state = { solved: 0, correct: 0, answered: {} };
  document.getElementById('modalOverlay').classList.remove('show');
  updateScoreBar();
  renderQuiz();
}

function checkAnswer(qid, isCorrect) {
  if (state.answered[qid]) return;
  state.answered[qid] = true;
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreBar();
}

function renderQuiz() {
  const wrap = document.getElementById('quizWrap');
  wrap.innerHTML = '';

  QUIZ_DATA.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card-${q.id}`;

    const typeMap = { mc: ['객관식', 'mc'], sa: ['단답형', 'sa'], ox: ['OX형', 'ox'] };
    const diffMap = { easy: ['쉬움', 'easy'], medium: ['보통', 'medium'], hard: ['어려움', 'hard'] };
    const [typeTxt, typeCls] = typeMap[q.type];
    const [diffTxt, diffCls] = diffMap[q.difficulty];

    let bodyHTML = '';

    if (q.type === 'mc') {
      const opts = q.options.map((o, i) => {
        const label = ['A','B','C','D'][i];
        return `<button class="opt-btn" id="opt-${q.id}-${i}" onclick="handleMC(${q.id}, ${i}, '${o.replace(/'/g,"\\'")}')">
          <span class="opt-label">${label}</span>
          <span class="opt-text">${o}</span>
          <span class="badge-result" id="badge-${q.id}-${i}"></span>
        </button>`;
      }).join('');
      bodyHTML = `<div class="options">${opts}</div>`;
    } else if (q.type === 'ox') {
      bodyHTML = `<div class="ox-row">
        <button class="ox-btn" id="ox-${q.id}-O" onclick="handleOX(${q.id}, 'O')">O</button>
        <button class="ox-btn" id="ox-${q.id}-X" onclick="handleOX(${q.id}, 'X')">X</button>
      </div>`;
    } else if (q.type === 'sa') {
      bodyHTML = `<div class="sa-row">
        <input type="text" class="sa-input" id="sa-input-${q.id}" placeholder="답변을 입력하세요..." autocomplete="off">
        <button class="sa-submit" id="sa-btn-${q.id}" onclick="handleSA(${q.id})">제출</button>
      </div>
      <div class="sa-result" id="sa-result-${q.id}"></div>`;
    }

    bodyHTML += `<div class="explanation" id="exp-${q.id}">
      <div class="exp-label">해설</div>
      <div class="exp-text">${q.explanation}</div>
      <div class="exp-source">📌 원문 근거: ${q.source}</div>
    </div>`;

    card.innerHTML = `
      <div class="q-head">
        <div class="q-num">${q.id}</div>
        <div class="q-meta">
          <div class="q-badges">
            <span class="badge ${typeCls}">${typeTxt}</span>
            <span class="badge ${diffCls}">${diffTxt}</span>
          </div>
          <div class="q-text">${q.question.replace(/\n/g,'<br>')}</div>
        </div>
      </div>
      <div class="q-body">${bodyHTML}</div>
    `;
    wrap.appendChild(card);

    // enter key for SA
    if (q.type === 'sa') {
      setTimeout(() => {
        const inp = document.getElementById(`sa-input-${q.id}`);
        if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleSA(q.id); });
      }, 0);
    }
  });
}

function handleMC(qid, idx, chosen) {
  if (state.answered[qid]) return;
  const q = QUIZ_DATA.find(x => x.id === qid);
  const isCorrect = chosen === q.answer;

  q.options.forEach((o, i) => {
    const btn = document.getElementById(`opt-${qid}-${i}`);
    const badge = document.getElementById(`badge-${qid}-${i}`);
    btn.disabled = true;
    if (o === q.answer) {
      btn.classList.add('correct');
      badge.textContent = '✓ 정답';
    }
    if (i === idx && !isCorrect) {
      btn.classList.add('wrong');
      badge.textContent = '✗ 오답';
    }
  });

  document.getElementById(`exp-${qid}`).classList.add('show');
  checkAnswer(qid, isCorrect);
}

function handleOX(qid, chosen) {
  if (state.answered[qid]) return;
  const q = QUIZ_DATA.find(x => x.id === qid);
  const isCorrect = chosen === q.answer;

  ['O','X'].forEach(v => {
    const btn = document.getElementById(`ox-${qid}-${v}`);
    btn.disabled = true;
    if (v === q.answer) btn.classList.add('correct');
    if (v === chosen && !isCorrect) btn.classList.add('wrong');
  });

  document.getElementById(`exp-${qid}`).classList.add('show');
  checkAnswer(qid, isCorrect);
}

function handleSA(qid) {
  if (state.answered[qid]) return;
  const q = QUIZ_DATA.find(x => x.id === qid);
  const input = document.getElementById(`sa-input-${qid}`);
  const val = input.value.trim();
  if (!val) return;

  const resultEl = document.getElementById(`sa-result-${qid}`);
  const btn = document.getElementById(`sa-btn-${qid}`);
  
  const isCorrect = q.keywords.some(kw => val.replace(/\s/g,'').toLowerCase().includes(kw.replace(/\s/g,'').toLowerCase()));

  input.disabled = true;
  btn.disabled = true;

  resultEl.style.display = 'block';
  if (isCorrect) {
    resultEl.className = 'sa-result correct';
    resultEl.textContent = `✓ 정답! 입력: "${val}"`;
  } else {
    resultEl.className = 'sa-result wrong';
    resultEl.textContent = `✗ 오답. 입력: "${val}" → 정답: ${q.answer}`;
  }

  document.getElementById(`exp-${qid}`).classList.add('show');
  checkAnswer(qid, isCorrect);
}

// Init
renderQuiz();
updateScoreBar();
</script>
</body>
</html>
