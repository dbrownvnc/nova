<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose: #e11d48;
    --rose-soft: #f43f5e;
    --ink: #1a1a1a;
    --muted: #777777;
    --bg: #ffffff;
    --bg2: #fafafa;
    --border: #e5e5e5;
    --blue: #2563eb;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --red-bg: #fff1f2;
    --max: 680px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  /* ── STICKY SCOREBOARD ── */
  .scoreboard {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .score-item { font-size: 12px; color: rgba(255,255,255,0.65); }
  .score-item strong { display: block; font-size: 16px; color: #fff; font-weight: 700; }
  .score-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.18); }
  .progress-wrap { flex: 1; }
  .progress-bar-bg {
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease, background 0.4s ease;
    width: 0%;
    background: var(--green);
  }
  .progress-pct { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 3px; text-align: right; }

  /* ── HERO ── */
  .hero {
    background: var(--rose);
    color: #fff;
    padding: 32px 18px 28px;
  }
  .hero-inner { max-width: var(--max); margin: 0 auto; }
  .hero-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    margin-bottom: 10px;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .hero-sub { font-size: 13px; color: rgba(255,255,255,0.8); }

  /* ── PAGE WRAP ── */
  .page-wrap { max-width: var(--max); margin: 0 auto; padding: 24px 18px 0; }

  /* ── QUIZ CARD ── */
  .quiz-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 18px;
    margin-bottom: 20px;
    transition: box-shadow 0.2s;
  }
  .quiz-card.answered { box-shadow: none; }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .q-num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--rose);
    line-height: 1;
    flex: 0 0 auto;
  }
  .diff-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    flex: 0 0 auto;
  }
  .diff-easy { background: #dcfce7; color: #15803d; }
  .diff-mid { background: #fef3c7; color: #b45309; }
  .diff-hard { background: #fee2e2; color: var(--rose); }
  .q-type {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 20px;
    flex: 0 0 auto;
  }

  .q-text { font-size: 15px; font-weight: 600; line-height: 1.6; margin-bottom: 14px; }

  /* ── OPTIONS ── */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    color: var(--ink);
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--rose); background: #fff8f9; }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { background: var(--green-bg); border-color: var(--green); }
  .opt-btn.wrong { background: var(--red-bg); border-color: var(--rose); }
  .badge-tag {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: auto;
  }
  .badge-correct { background: var(--green); color: #fff; }
  .badge-wrong { background: var(--rose); color: #fff; }

  /* ── SHORT ANSWER ── */
  .sa-wrap { display: flex; gap: 8px; }
  .sa-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .sa-input:focus { border-color: var(--rose); }
  .sa-input:disabled { background: var(--bg2); cursor: default; }
  .sa-submit {
    background: var(--rose);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .sa-submit:hover:not(:disabled) { background: var(--rose-soft); }
  .sa-submit:disabled { background: var(--muted); cursor: default; }

  /* ── OX ── */
  .ox-wrap { display: flex; gap: 10px; }
  .ox-btn {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 14px 10px;
    font-size: 28px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    background: var(--bg);
    transition: border-color 0.15s, background 0.15s;
  }
  .ox-btn:hover:not(:disabled) { border-color: var(--rose); background: #fff8f9; }
  .ox-btn:disabled { cursor: default; }
  .ox-btn.correct { background: var(--green-bg); border-color: var(--green); }
  .ox-btn.wrong { background: var(--red-bg); border-color: var(--rose); }

  /* ── EXPLANATION ── */
  .explanation {
    display: none;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.7;
  }
  .explanation.show { display: block; animation: slideDown 0.3s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .exp-label { font-size: 11px; font-weight: 700; color: var(--rose); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .exp-text { color: var(--ink); }
  .exp-source { margin-top: 8px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }

  /* ── RESULT MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--bg);
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  .modal-emoji { font-size: 48px; margin-bottom: 12px; }
  .modal-grade {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 900;
    color: var(--rose);
    line-height: 1;
    margin-bottom: 8px;
  }
  .modal-score { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .modal-msg { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
  .btn-retry {
    background: var(--rose);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-retry:hover { background: var(--rose-soft); }

  @media (max-width: 400px) {
    .quiz-card { padding: 16px 14px; }
    .sa-wrap { flex-direction: column; }
  }
</style>
</head>

    options: ['O', 'X'],
    answer: 0,
    explanation: '방송에서 "5월 한 달 동안 무려 순자산이 49.9 빌리언이 유입이 됐습니다... 4월달하고 전년하고 비교하면 YY로 비교하면 무려 42%나 폭증한 거예요. 그리고 일평균 거래 건수도 1180만 건... 사상 최고치를 보여주고 있습니다"라고 언급했다.',
    source: '원본: "YY로 비교하면 무려 42%나 폭증... 일평균 거래 건수도 1180만 건... 사상 최고치"'
  }
];

let state = { solved: 0, correct: 0 };
const diffLabels = { easy: '쉬움', mid: '보통', hard: '어려움' };
const typeLabels = { mcq: '객관식', short: '단답형', ox: 'OX' };

function updateScoreboard() {
  document.getElementById('sc-solved').textContent = `${state.solved} / 10`;
  document.getElementById('sc-correct').textContent = state.correct;
  const pct = state.solved === 0 ? 0 : Math.round(state.correct / state.solved * 100);
  document.getElementById('sc-bar').style.width = pct + '%';
  document.getElementById('sc-pct').textContent = `정답률 ${pct}%`;
  const bar = document.getElementById('sc-bar');
  if (pct < 40) bar.style.background = '#ef4444';
  else if (pct < 70) bar.style.background = '#f97316';
  else bar.style.background = '#16a34a';
  if (state.solved === 10) showModal();
}

function showExplanation(id, isCorrect, exp, src) {
  const el = document.getElementById(`exp-${id}`);
  el.innerHTML = `
    <div class="exp-label">${isCorrect ? '✓ 정답' : '✗ 오답'} — 해설</div>
    <div class="exp-text">${exp}</div>
    <div class="exp-source">📌 근거: ${src}</div>
  `;
  el.classList.add('show');
}

function handleMCQ(qid, chosenIdx, correctIdx, exp, src) {
  const card = document.getElementById(`card-${qid}`);
  if (card.classList.contains('answered')) return;
  card.classList.add('answered');
  const btns = card.querySelectorAll('.opt-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctIdx) {
      btn.classList.add('correct');
      const tag = document.createElement('span');
      tag.className = 'badge-tag badge-correct';
      tag.textContent = '✓ 정답';
      btn.appendChild(tag);
    }
    if (i === chosenIdx && i !== correctIdx) {
      btn.classList.add('wrong');
      const tag = document.createElement('span');
      tag.className = 'badge-tag badge-wrong';
      tag.textContent = '✗ 오답';
      btn.appendChild(tag);
    }
  });
  const isCorrect = chosenIdx === correctIdx;
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreboard();
  showExplanation(qid, isCorrect, exp, src);
}

function handleOX(qid, chosen, correct, exp, src) {
  const card = document.getElementById(`card-${qid}`);
  if (card.classList.contains('answered')) return;
  card.classList.add('answered');
  const btns = card.querySelectorAll('.ox-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    if (i === chosen && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = chosen === correct;
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreboard();
  showExplanation(qid, isCorrect, exp, src);
}

function handleShort(qid, answers, exp, src) {
  const card = document.getElementById(`card-${qid}`);
  if (card.classList.contains('answered')) return;
  const input = document.getElementById(`sa-input-${qid}`);
  const val = input.value.trim().toLowerCase().replace(/\s/g, '');
  if (!val) return;
  card.classList.add('answered');
  input.disabled = true;
  document.getElementById(`sa-btn-${qid}`).disabled = true;
  const isCorrect = answers.some(a => val.includes(a.toLowerCase().replace(/\s/g, '')) || a.toLowerCase().replace(/\s/g, '').includes(val));
  input.style.borderColor = isCorrect ? '#16a34a' : '#e11d48';
  input.style.background = isCorrect ? '#f0fdf4' : '#fff1f2';
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreboard();
  showExplanation(qid, isCorrect, exp, src);
}

function renderQuiz() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  QUIZ_DATA.forEach(q => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.id = `card-${q.id}`;

    let interactiveHTML = '';
    if (q.type === 'mcq') {
      interactiveHTML = `<div class="options">${q.options.map((opt, i) => `
        <button class="opt-btn" onclick="handleMCQ(${q.id}, ${i}, ${q.answer}, ${JSON.stringify(q.explanation)}, ${JSON.stringify(q.source)})">
          <span>${['①','②','③','④'][i]}</span> ${opt}
        </button>`).join('')}</div>`;
    } else if (q.type === 'ox') {
      interactiveHTML = `<div class="ox-wrap">
        <button class="ox-btn" onclick="handleOX(${q.id}, 0, ${q.answer}, ${JSON.stringify(q.explanation)}, ${JSON.stringify(q.source)})">O</button>
        <button class="ox-btn" onclick="handleOX(${q.id}, 1, ${q.answer}, ${JSON.stringify(q.explanation)}, ${JSON.stringify(q.source)})">X</button>
      </div>`;
    } else if (q.type === 'short') {
      interactiveHTML = `<div class="sa-wrap">
        <input type="text" class="sa-input" id="sa-input-${q.id}" placeholder="답을 입력하세요" 
          onkeydown="if(event.key==='Enter') handleShort(${q.id}, ${JSON.stringify(q.answer)}, ${JSON.stringify(q.explanation)}, ${JSON.stringify(q.source)})">
        <button class="sa-submit" id="sa-btn-${q.id}" onclick="handleShort(${q.id}, ${JSON.stringify(q.answer)}, ${JSON.stringify(q.explanation)}, ${JSON.stringify(q.source)})">제출</button>
      </div>`;
    }

    card.innerHTML = `
      <div class="card-header">
        <div class="q-num">${String(q.id).padStart(2,'0')}</div>
        <span class="diff-badge diff-${q.difficulty}">${diffLabels[q.difficulty]}</span>
        <span class="q-type">${typeLabels[q.type]}</span>
      </div>
      <div class="q-text">${q.question}</div>
      ${interactiveHTML}
      <div class="explanation" id="exp-${q.id}"></div>
    `;
    area.appendChild(card);
  });
}

function showModal() {
  const pct = Math.round(state.correct / 10 * 100);
  let grade, emoji, msg;
  if (pct >= 90) { grade = 'A'; emoji = '🏆'; msg = '완벽합니다! 시장 분석력이 탁월합니다.'; }
  else if (pct >= 70) { grade = 'B'; emoji = '👍'; msg = '훌륭합니다! 핵심 내용을 잘 파악하셨네요.'; }
  else if (pct >= 50) { grade = 'C'; emoji = '💪'; msg = '절반 이상 맞히셨어요. 한 번 더 도전해보세요!'; }
  else { grade = 'D'; emoji = '📚'; msg = '방송 내용을 다시 한번 확인하고 재도전하세요!'; }
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalGrade').textContent = grade;
  document.getElementById('modalScore').textContent = `${state.correct} / 10 문제 정답 (${pct}점)`;
  document.getElementById('modalMsg').textContent = msg;
  document.getElementById('modalOverlay').classList.add('show');
}

function retryQuiz() {
  state = { solved: 0, correct: 0 };
  document.getElementById('modalOverlay').classList.remove('show');
  updateScoreboard();
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
updateScoreboard();
</script>
</body>
</html>
