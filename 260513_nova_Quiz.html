<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 수퍼사이클 전환 — 인터랙티브 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --bg2: #fafafa; --text: #1a1a1a; --text2: #777;
  --accent: #e11d48; --accent2: #f43f5e; --border: #e5e5e5;
  --green: #16a34a; --red: #e11d48; --orange: #f97316;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); font-size:15px; }

/* STICKY SCOREBOARD */
#scoreboard {
  position: sticky; top: 0; z-index: 100;
  background: var(--text);
  padding: 10px 18px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.score-item { text-align: center; }
.score-num { font-family:'Playfair Display',serif; font-size:20px; font-weight:900; color:#fff; }
.score-label { font-size:10px; color:#aaa; letter-spacing:0.5px; }
.score-progress-wrap { flex:1; height:6px; background:#333; border-radius:3px; overflow:hidden; min-width:60px; }
.score-progress-bar { height:100%; border-radius:3px; transition: width 0.4s ease, background 0.4s ease; width:0%; background: var(--accent); }

/* HEADER */
.quiz-header {
  background: linear-gradient(135deg, #1a1a1a 0%, #2d1b22 100%);
  padding: 36px 20px 28px;
  text-align: center;
  position: relative;
}
.quiz-header::before {
  content:''; position:absolute; top:0;left:0;right:0; height:4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.quiz-issue { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--accent2); margin-bottom:12px; }
.quiz-title { font-family:'Playfair Display',serif; font-size:clamp(22px,5vw,34px); font-weight:900; color:#fff; line-height:1.2; margin-bottom:8px; }
.quiz-title span { color: var(--accent2); }
.quiz-sub { font-size:12px; color:#999; }

/* CONTAINER */
.container { max-width:680px; margin:0 auto; padding:0 16px; }

/* QUIZ CARD */
.quiz-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 0;
  margin: 20px 0;
  padding: 22px 18px;
  border-left: 4px solid var(--border);
  transition: border-color 0.3s;
}
.quiz-card.correct-card { border-left-color: var(--green); }
.quiz-card.wrong-card   { border-left-color: var(--red); }

.card-meta {
  display:flex; align-items:center; gap:8px; margin-bottom:12px;
}
.q-num {
  font-family:'Playfair Display',serif; font-size:11px; font-weight:700;
  color: var(--text2); letter-spacing:1px;
}
.q-badge {
  font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  padding:2px 7px; border:1px solid;
}
.badge-easy   { border-color:#16a34a; color:#16a34a; }
.badge-medium { border-color:#f97316; color:#f97316; }
.badge-hard   { border-color:var(--accent); color:var(--accent); }
.badge-ox     { border-color:#6b7280; color:#6b7280; }
.badge-short  { border-color:#2563eb; color:#2563eb; }

.q-text {
  font-size:15px; font-weight:500; line-height:1.6; margin-bottom:16px;
}

/* OPTIONS */
.options { display:flex; flex-direction:column; gap:9px; }
.opt-btn {
  background: var(--bg2); border: 1px solid var(--border);
  padding: 11px 14px; text-align:left; cursor:pointer; font-size:13px;
  font-family:'Noto Sans KR',sans-serif; color:var(--text);
  transition: all 0.15s; line-height:1.5; border-radius:0;
}
.opt-btn:hover:not(:disabled) { background:#f3f3f3; border-color:#aaa; }
.opt-btn:disabled { cursor:default; }
.opt-btn.selected-correct { background:#dcfce7; border-color:var(--green); color:var(--green); font-weight:700; }
.opt-btn.selected-wrong   { background:#fee2e2; border-color:var(--red);   color:var(--red);   font-weight:700; }
.opt-btn.reveal-correct   { background:#dcfce7; border-color:var(--green); color:var(--green); }

.feedback-badge {
  display:inline-block; font-size:11px; font-weight:700; padding:2px 8px;
  margin-left:8px; vertical-align:middle;
}
.badge-ok  { background:var(--green); color:#fff; }
.badge-no  { background:var(--red);   color:#fff; }

/* OX BUTTONS */
.ox-row { display:flex; gap:12px; }
.ox-btn {
  flex:1; padding:14px; font-size:22px; font-weight:900;
  border:2px solid var(--border); background:var(--bg2); cursor:pointer;
  transition:all 0.15s; font-family:'Playfair Display',serif;
}
.ox-btn:hover:not(:disabled) { background:#f3f3f3; }
.ox-btn:disabled { cursor:default; }
.ox-btn.selected-correct { background:#dcfce7; border-color:var(--green); }
.ox-btn.selected-wrong   { background:#fee2e2; border-color:var(--red); }
.ox-btn.reveal-correct   { background:#dcfce7; border-color:var(--green); }

/* SHORT ANSWER */
.short-row { display:flex; gap:8px; }
.short-input {
  flex:1; padding:10px 12px; border:1px solid var(--border);
  font-size:14px; font-family:'Noto Sans KR',sans-serif; outline:none;
  color:var(--text); background:var(--bg2);
}
.short-input:focus { border-color: var(--accent); }
.short-input:disabled { background:#f0f0f0; }
.submit-btn {
  background:var(--accent); color:#fff; border:none;
  padding:10px 16px; cursor:pointer; font-size:13px;
  font-family:'Noto Sans KR',sans-serif; font-weight:700;
  transition: background 0.15s;
}
.submit-btn:hover:not(:disabled) { background: #c21b40; }
.submit-btn:disabled { background:#ccc; cursor:default; }

/* EXPLANATION */
.explanation {
  display:none; margin-top:14px;
  background: #1a1a1a; color:#e5e5e5;
  padding:14px 16px; font-size:13px; line-height:1.6;
  border-left:3px solid var(--accent2);
}
.explanation.show { display:block; }
.explanation strong { color:var(--accent2); }
.explanation .ex-label {
  font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  color: var(--accent2); margin-bottom:6px; font-weight:700;
}

/* RESULT MODAL */
#resultModal {
  display:none; position:fixed; inset:0; z-index:999;
  background: rgba(0,0,0,0.85); align-items:center; justify-content:center;
}
#resultModal.show { display:flex; }
.modal-inner {
  background:#fff; max-width:360px; width:90%; padding:36px 28px;
  text-align:center; border-top:5px solid var(--accent);
}
.modal-score-big {
  font-family:'Playfair Display',serif; font-size:64px; font-weight:900;
  color:var(--accent); line-height:1;
}
.modal-grade {
  font-family:'Playfair Display',serif; font-size:28px; font-weight:700;
  margin:8px 0; color:var(--text);
}
.modal-msg { font-size:14px; color:var(--text2); margin:12px 0 20px; line-height:1.6; }
.modal-retry {
  background:var(--accent); color:#fff; border:none;
  padding:12px 28px; cursor:pointer; font-size:14px; font-weight:700;
  font-family:'Noto Sans KR',sans-serif; width:100%;
  transition: background 0.15s;
}
.modal-retry:hover { background:#c21b40; }

.quiz-footer {
  background: var(--text); color:#777; text-align:center;
  padding:20px; font-size:11px; letter-spacing:1px; margin-top:32px;
}
.quiz-footer strong { color: var(--accent2); }

@media(max-width:400px) {
  .quiz-card { padding:16px 13px; }
  .short-row { flex-direction:column; }
  .submit-btn { width:100%; }
}
</style>
</head>
<body>

</div>

    <button class="modal-retry" onclick="retryQuiz()">↺ 다시 풀기</button>

<script>

    card.id = `card-${q.id}`;

    let innerHTML = `
      <div class="card-meta">
        <span class="q-num">Q${q.id}</span>
        <span class="q-badge ${diffClass[q.difficulty]}">${diffLabel[q.difficulty]}</span>
        ${q.type === 'ox' ? '<span class="q-badge badge-ox">OX</span>' : ''}
        ${q.type === 'short' ? '<span class="q-badge badge-short">단답형</span>' : ''}
      </div>
      <div class="q-text">${q.question}</div>
    `;

    if (q.type === 'mcq') {
      innerHTML += `<div class="options">`;
      q.options.forEach((opt, idx) => {
        innerHTML += `<button class="opt-btn" onclick="submitMCQ(${q.id}, ${idx})" data-idx="${idx}">${idx+1}. ${opt}</button>`;
      });
      innerHTML += `</div>`;
    } else if (q.type === 'ox') {
      innerHTML += `
        <div class="ox-row">
          <button class="ox-btn" onclick="submitOX(${q.id}, 'O')" data-val="O">⭕ O</button>
          <button class="ox-btn" onclick="submitOX(${q.id}, 'X')" data-val="X">❌ X</button>
        </div>`;
    } else if (q.type === 'short') {
      innerHTML += `
        <div class="short-row">
          <input type="text" class="short-input" id="short-${q.id}" placeholder="답을 입력하세요..." onkeydown="if(event.key==='Enter')submitShort(${q.id})">
          <button class="submit-btn" id="shortbtn-${q.id}" onclick="submitShort(${q.id})">제출</button>
        </div>`;
    }

    innerHTML += `<div class="explanation" id="exp-${q.id}"><div class="ex-label">📖 해설</div>${q.explanation}</div>`;
    card.innerHTML = innerHTML;
    container.appendChild(card);
  });
}

function updateScoreboard() {
  document.getElementById('sSolved').textContent = state.solved;
  document.getElementById('sCorrect').textContent = state.correct;
  const pct = state.solved > 0 ? Math.round(state.correct / state.solved * 100) : 0;
  document.getElementById('sPct').textContent = pct;
  const bar = document.getElementById('sBar');
  bar.style.width = (state.solved / 10 * 100) + '%';
  if (pct < 40) bar.style.background = '#e11d48';
  else if (pct < 70) bar.style.background = '#f97316';
  else bar.style.background = '#16a34a';
}

function showExplanation(qId) {
  const exp = document.getElementById(`exp-${qId}`);
  if (exp) exp.classList.add('show');
}

function recordAnswer(qId, isCorrect) {
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreboard();
  const card = document.getElementById(`card-${qId}`);
  card.classList.add(isCorrect ? 'correct-card' : 'wrong-card');
  showExplanation(qId);
  if (state.solved === QUIZ_DATA.length) {
    setTimeout(showResult, 600);
  }
}

function submitMCQ(qId, idx) {
  const q = QUIZ_DATA.find(x => x.id === qId);
  const btns = document.querySelectorAll(`#card-${qId} .opt-btn`);
  btns.forEach(b => b.disabled = true);
  const isCorrect = idx === q.answer;
  btns[idx].classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
  btns[idx].innerHTML += `<span class="feedback-badge ${isCorrect ? 'badge-ok' : 'badge-no'}">${isCorrect ? '✓ 정답!' : '✗ 오답'}</span>`;
  if (!isCorrect) {
    btns[q.answer].classList.add('reveal-correct');
    btns[q.answer].innerHTML += `<span class="feedback-badge badge-ok">✓ 정답</span>`;
  }
  recordAnswer(qId, isCorrect);
}

function submitOX(qId, val) {
  const q = QUIZ_DATA.find(x => x.id === qId);
  const btns = document.querySelectorAll(`#card-${qId} .ox-btn`);
  btns.forEach(b => b.disabled = true);
  const isCorrect = val === q.answer;
  btns.forEach(b => {
    if (b.dataset.val === val) {
      b.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
      b.innerHTML += `<div style="font-size:11px;font-weight:700;margin-top:4px;">${isCorrect ? '✓ 정답!' : '✗ 오답'}</div>`;
    }
    if (!isCorrect && b.dataset.val === q.answer) {
      b.classList.add('reveal-correct');
      b.innerHTML += `<div style="font-size:11px;font-weight:700;margin-top:4px;">✓ 정답</div>`;
    }
  });
  recordAnswer(qId, isCorrect);
}

function submitShort(qId) {
  const q = QUIZ_DATA.find(x => x.id === qId);
  const input = document.getElementById(`short-${qId}`);
  const btn = document.getElementById(`shortbtn-${qId}`);
  const val = input.value.trim();
  if (!val) { input.style.borderColor = 'var(--accent)'; return; }
  input.disabled = true;
  btn.disabled = true;

  // Flexible matching
  const normalize = s => s.toLowerCase().replace(/[\s,]/g,'').replace(/달러/,'').replace(/억/,'억');
  const userNorm = normalize(val);
  const ansNorm = normalize(q.answer);

  let isCorrect = userNorm === ansNorm;
  // Also accept partial matches for common variations
  const acceptedVariants = {
    'do nothing': ['donothing', '두낫띵', '두낫씽', '아무것도하지않는것'],
    '7천억 달러': ['7000억달러','7000억','7천억','칠천억달러','칠천억'],
  };
  if (!isCorrect && acceptedVariants[q.answer]) {
    isCorrect = acceptedVariants[q.answer].some(v => userNorm.includes(normalize(v)) || normalize(v).includes(userNorm));
  }

  const feedbackDiv = document.createElement('div');
  feedbackDiv.style.cssText = 'margin-top:8px;font-size:13px;font-weight:700;';
  if (isCorrect) {
    feedbackDiv.style.color = 'var(--green)';
    feedbackDiv.textContent = '✓ 정답입니다!';
    input.style.borderColor = 'var(--green)';
  } else {
    feedbackDiv.style.color = 'var(--accent)';
    feedbackDiv.textContent = `✗ 오답 — 정답: ${q.answer}`;
    input.style.borderColor = 'var(--accent)';
  }
  btn.parentElement.parentElement.insertBefore(feedbackDiv, btn.parentElement.nextSibling);
  recordAnswer(qId, isCorrect);
}

function showResult() {
  const correct = state.correct;
  const grades = [
    { min:9, grade:'A+', msg:'완벽합니다! AI 수퍼사이클 전환기의 핵심을 완벽히 파악하셨습니다. 지금 당장 투자에 적용할 준비가 되어 있습니다.' },
    { min:7, grade:'A',  msg:'훌륭합니다! 대부분의 핵심 개념을 정확히 이해하셨습니다. 몇 가지 세부 사항을 복습하시면 완벽합니다.' },
    { min:5, grade:'B',  msg:'양호합니다! 주요 흐름은 파악하셨지만, 섹터 로테이션과 개별 종목 분석을 좀 더 복습해보세요.' },
    { min:3, grade:'C',  msg:'기초가 필요합니다. 방송 핵심 내용인 인플레이션, 금리, AI 물리 인프라 전환을 다시 한번 정리해보세요.' },
    { min:0, grade:'D',  msg:'다시 도전하세요! 방송을 처음부터 꼼꼼히 복습한 뒤 다시 풀어보시면 훨씬 나은 결과를 얻으실 수 있습니다.' }
  ];
  const g = grades.find(x => correct >= x.min);
  document.getElementById('modalScore').textContent = correct;
  document.getElementById('modalGrade').textContent = `등급: ${g.grade}`;
  document.getElementById('modalMsg').textContent = g.msg;
  document.getElementById('resultModal').classList.add('show');
}

function retryQuiz() {
  state = { solved: 0, correct: 0 };
  updateScoreboard();
  document.getElementById('resultModal').classList.remove('show');
  renderQuiz();
}

// INIT
renderQuiz();
updateScoreboard();
</script>
</body>
</html>
