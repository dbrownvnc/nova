<style>
  :root {
    --bg: #ffffff;
    --bg2: #fafafa;
    --text: #1a1a1a;
    --text2: #777777;
    --accent: #e11d48;
    --accent2: #f43f5e;
    --border: #e5e5e5;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #d97706;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* STICKY SCORE BAR */
  .score-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--text);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .score-bar .title { font-family: 'Playfair Display', serif; font-size: 14px; flex: 1; min-width: 100px; }
  .score-bar .stats { display: flex; gap: 12px; align-items: center; font-size: 13px; }
  .stat-item { text-align: center; }
  .stat-item .n { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; line-height: 1; }
  .stat-item .l { font-size: 10px; color: #aaa; }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: #333;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--red);
    transition: width 0.4s, background 0.4s;
    border-radius: 2px;
  }

  /* HERO */
  .hero {
    background: var(--text);
    color: #fff;
    padding: 36px 20px 28px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.12;
  }
  .hero-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .hero-desc { font-size: 13px; color: #aaa; }

  /* QUIZ BODY */
  .quiz-body { padding: 20px 16px; max-width: 680px; margin: 0 auto; }

  /* QUESTION CARD */
  .q-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    margin-bottom: 20px;
    transition: border-color 0.3s;
  }
  .q-card.correct-card { border-color: var(--green); background: #f0fdf4; }
  .q-card.wrong-card { border-color: var(--red); background: #fff0f3; }

  .q-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .q-num {
    background: var(--text);
    color: #fff;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .q-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .badge-type { background: #e0f2fe; color: #0369a1; }
  .badge-easy { background: #dcfce7; color: #15803d; }
  .badge-medium { background: #fef3c7; color: #b45309; }
  .badge-hard { background: #fee2e2; color: #dc2626; }

  .q-text {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  /* OPTIONS */
  .options { display: grid; gap: 8px; }
  .opt-btn {
    width: 100%;
    padding: 11px 14px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13.5px;
    color: var(--text);
    transition: all 0.2s;
    line-height: 1.5;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #fff0f3; }
  .opt-btn:disabled { cursor: not-allowed; }
  .opt-btn.correct { background: #dcfce7; border-color: var(--green); color: #15803d; font-weight: 700; }
  .opt-btn.wrong { background: #fee2e2; border-color: var(--red); color: var(--red); font-weight: 700; }

  /* OX BUTTONS */
  .ox-group { display: flex; gap: 12px; }
  .ox-btn {
    flex: 1;
    padding: 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    transition: all 0.2s;
    text-align: center;
  }
  .ox-btn:hover:not(:disabled) { border-color: var(--accent); transform: scale(1.03); }
  .ox-btn:disabled { cursor: not-allowed; }
  .ox-btn.correct { background: #dcfce7; border-color: var(--green); color: var(--green); }
  .ox-btn.wrong { background: #fee2e2; border-color: var(--red); color: var(--red); }

  /* SHORT ANSWER */
  .short-group { display: flex; gap: 8px; align-items: center; }
  .short-input {
    flex: 1;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    transition: border-color 0.2s;
  }
  .short-input:focus { outline: none; border-color: var(--accent); }
  .short-input:disabled { background: #f5f5f5; cursor: not-allowed; }
  .submit-btn {
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .submit-btn:hover:not(:disabled) { background: var(--accent2); }
  .submit-btn:disabled { background: var(--border); color: var(--text2); cursor: not-allowed; }

  /* FEEDBACK */
  .feedback {
    display: none;
    margin-top: 12px;
    border-radius: 10px;
    overflow: hidden;
  }
  .feedback.show { display: block; }
  .fb-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 14px;
  }
  .fb-badge.correct-fb { background: var(--green); color: #fff; }
  .fb-badge.wrong-fb { background: var(--red); color: #fff; }
  .fb-explanation {
    background: #f8f8f8;
    border: 1px solid var(--border);
    border-top: none;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.7;
  }
  .fb-explanation b { color: var(--accent); }

  /* FINAL MODAL */
  .final-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .final-overlay.show { display: flex; }
  .final-card {
    background: #fff;
    border-radius: 20px;
    padding: 36px 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);

  .final-emoji { font-size: 52px; margin-bottom: 14px; }
  .final-score {

    font-size: 48px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 6px;
  }
  .final-grade {
    display: inline-block;
    padding: 4px 18px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .grade-A { background: #dcfce7; color: #15803d; }
  .grade-B { background: #e0f2fe; color: #0369a1; }
  .grade-C { background: #fef3c7; color: #b45309; }
  .grade-D { background: #fee2e2; color: var(--red); }
  .final-msg { font-size: 14px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
  .retry-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .retry-btn:hover { background: var(--accent2); }
</style>
</head>

  state = { solved: 0, correct: 0, answered: {} };
  updateScoreBar();
  renderQuiz();
}

function renderQuiz() {
  const body = document.getElementById('quizBody');
  body.innerHTML = '';
  QUIZ_DATA.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + q.id;

    const diffClass = q.difficulty === 'easy' ? 'badge-easy' : q.difficulty === 'medium' ? 'badge-medium' : 'badge-hard';
    const diffLabel = q.difficulty === 'easy' ? '쉬움' : q.difficulty === 'medium' ? '보통' : '어려움';
    const typeLabel = q.type === 'multiple' ? '객관식' : q.type === 'ox' ? 'OX형' : '단답형';

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${q.id}</div>
        <div class="q-badges">
          <span class="badge badge-type">${typeLabel}</span>
          <span class="badge ${diffClass}">${diffLabel}</span>
        </div>
      </div>
      <div class="q-text">${q.question}</div>
      <div class="q-input" id="input-${q.id}"></div>
      <div class="feedback" id="fb-${q.id}"></div>
    `;
    body.appendChild(card);

    const inputArea = document.getElementById('input-' + q.id);

    if (q.type === 'multiple') {
      const opts = document.createElement('div');
      opts.className = 'options';
      q.options.forEach((opt, idx) => {
        const letter = ['A','B','C','D'][idx];
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = opt;
        btn.dataset.answer = letter;
        btn.addEventListener('click', () => handleMultiple(q, letter, btn, opts));
        opts.appendChild(btn);
      });
      inputArea.appendChild(opts);
    } else if (q.type === 'ox') {
      const grp = document.createElement('div');
      grp.className = 'ox-group';
      ['O','X'].forEach(v => {
        const btn = document.createElement('button');
        btn.className = 'ox-btn';
        btn.textContent = v;
        btn.addEventListener('click', () => handleOX(q, v, grp));
        grp.appendChild(btn);
      });
      inputArea.appendChild(grp);
    } else {
      const grp = document.createElement('div');
      grp.className = 'short-group';
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'short-input';
      inp.placeholder = '정답을 입력하세요';
      inp.id = 'short-' + q.id;
      const btn = document.createElement('button');
      btn.className = 'submit-btn';
      btn.textContent = '제출';
      btn.addEventListener('click', () => handleShort(q, inp, btn));
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') btn.click(); });
      grp.appendChild(inp);
      grp.appendChild(btn);
      inputArea.appendChild(grp);
    }
  });
}

function handleMultiple(q, selected, clickedBtn, container) {
  if (state.answered[q.id]) return;
  markAnswered(q.id);
  const isCorrect = selected === q.answer;
  const btns = container.querySelectorAll('.opt-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.dataset.answer === q.answer) b.classList.add('correct');
  });
  if (!isCorrect) clickedBtn.classList.add('wrong');
  showFeedback(q, isCorrect);
  updateScore(isCorrect, q.id);
}

function handleOX(q, selected, container) {
  if (state.answered[q.id]) return;
  markAnswered(q.id);
  const isCorrect = selected === q.answer;
  const btns = container.querySelectorAll('.ox-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });
  if (!isCorrect) {
    btns.forEach(b => { if (b.textContent === selected) b.classList.add('wrong'); });
  }
  showFeedback(q, isCorrect);
  updateScore(isCorrect, q.id);
}

function handleShort(q, inp, btn) {
  if (state.answered[q.id]) return;
  const userAns = inp.value.trim();
  if (!userAns) { inp.style.borderColor = 'var(--accent)'; return; }
  markAnswered(q.id);
  const all = [q.answer, ...(q.aliases || [])].map(a => a.toLowerCase().replace(/\s/g,''));
  const isCorrect = all.includes(userAns.toLowerCase().replace(/\s/g,''));
  inp.disabled = true;
  btn.disabled = true;
  if (isCorrect) { inp.style.borderColor = 'var(--green)'; inp.style.background = '#dcfce7'; }
  else { inp.style.borderColor = 'var(--red)'; inp.style.background = '#fee2e2'; }
  showFeedback(q, isCorrect, userAns);
  updateScore(isCorrect, q.id);
}

function markAnswered(id) {
  state.answered[id] = true;
}

function showFeedback(q, isCorrect, userAns) {
  const fb = document.getElementById('fb-' + q.id);
  const card = document.getElementById('card-' + q.id);
  card.classList.add(isCorrect ? 'correct-card' : 'wrong-card');
  let wrongLine = '';
  if (!isCorrect && q.type === 'short') {
    wrongLine = `<br>입력한 답: <b style="color:var(--red)">${userAns}</b> &nbsp;|&nbsp; 정답: <b style="color:var(--green)">${q.answer}</b>`;
  }
  fb.innerHTML = `
    <div class="fb-badge ${isCorrect ? 'correct-fb' : 'wrong-fb'}">
      ${isCorrect ? '✓ 정답입니다!' : '✗ 오답입니다'}
    </div>
    <div class="fb-explanation">
      ${wrongLine}
      <b>💡 해설:</b> ${q.explanation}
    </div>
  `;
  fb.classList.add('show');
}

function updateScore(isCorrect, qid) {
  state.solved++;
  if (isCorrect) state.correct++;
  updateScoreBar();
  if (state.solved === QUIZ_DATA.length) {
    setTimeout(showFinal, 600);
  }
}

function updateScoreBar() {
  document.getElementById('s-solved').textContent = state.solved + ' / ' + QUIZ_DATA.length;
  document.getElementById('s-correct').textContent = state.correct;
  const rate = state.solved > 0 ? Math.round((state.correct / state.solved) * 100) : 0;
  document.getElementById('s-rate').textContent = rate + '%';
  const fill = document.getElementById('progressFill');
  const pct = (state.solved / QUIZ_DATA.length) * 100;
  fill.style.width = pct + '%';
  if (rate >= 70) fill.style.background = '#22c55e';
  else if (rate >= 40) fill.style.background = '#f59e0b';
  else fill.style.background = 'var(--red)';
}

function showFinal() {
  const score = state.correct;
  const rate = Math.round((score / QUIZ_DATA.length) * 100);
  let grade, gradeClass, emoji, msg;
  if (rate >= 90) { grade = 'A+'; gradeClass = 'grade-A'; emoji = '🏆'; msg = '완벽합니다! NOVA 브리핑을 완전히 마스터했습니다. AI 인프라 투자 전략을 정확히 이해하고 계십니다.'; }
  else if (rate >= 80) { grade = 'A'; gradeClass = 'grade-A'; emoji = '🎯'; msg = '훌륭합니다! 핵심 내용을 잘 파악했습니다. 조금 더 세부 수치에 집중해보세요.'; }
  else if (rate >= 70) { grade = 'B'; gradeClass = 'grade-B'; emoji = '📈'; msg = '잘 했습니다! 주요 이슈를 이해했습니다. 유가 전망과 메모리 사이클 부분을 복습해보세요.'; }
  else if (rate >= 50) { grade = 'C'; gradeClass = 'grade-C'; emoji = '📚'; msg = '더 노력해보세요! 방송 내용을 다시 한번 꼼꼼히 복습한 후 재도전해보시기 바랍니다.'; }
  else { grade = 'D'; gradeClass = 'grade-D'; emoji = '💪'; msg = '아직 부족하지만 괜찮습니다! 분석 리포트를 먼저 읽고 다시 도전해보세요.'; }

  document.getElementById('finalEmoji').textContent = emoji;
  document.getElementById('finalScore').textContent = score + ' / ' + QUIZ_DATA.length;
  const gradeEl = document.getElementById('finalGrade');
  gradeEl.textContent = '등급: ' + grade + ' (' + rate + '%)';
  gradeEl.className = 'final-grade ' + gradeClass;
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('finalOverlay').classList.add('show');
}

function retryQuiz() {
  document.getElementById('finalOverlay').classList.remove('show');
  init();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
</body>
</html>
